[workspace]
resolver = "3"
# wasm is EXCLUDED from the workspace: its `no-lean-link` platform-gate
# enables would otherwise feature-unify onto dregg-turn/sdk/etc in any
# whole-workspace build (cargo test --workspace), deleting the Lean paths
# on native. It builds standalone via wasm-pack (scripts/build-web-artifacts.sh,
# pages.yml), which uses its manifest path directly.
# members += the 12 absorbed deos/starbridge elephant crates (formerly standalone
# workspaces) so they share ONE target dir + one resolve (the disk + CI win).
# `discord-bot` is NOT a member: it (+ deos-zed-full) pull sqlx/sqlez →
# libsqlite3-sys 0.30, whose `links = "sqlite3"` conflicts with deos-matrix's
# rusqlite-0.35 (matrix-sdk-sqlite). Cargo allows ONE `links="sqlite3"` per
# workspace, so those two stay separate workspaces (discord-bot excluded below,
# deos-zed-full still excluded). `default-members` (below) is the light protocol/
# circuit/app set so bare `cargo build`/`cargo test` stays gpui/mozjs/servo-free.
#
# ⚠ TWO MEMBERS CANNOT LINK ON LINUX, AND A `--workspace` BUILD OR TEST MUST NAME THEM.
# `grain-verify-wasm` and `starbridge-v2/web` (package `starbridge-web`) are wasm-bindgen
# bundles that declare `crate-type = ["cdylib", "rlib"]`, and both reach `dregg-lean-ffi`
# unconditionally on native (grain-verify's Lean-proven R3 verify core; starbridge-v2's
# `embedded-executor` → dregg-sdk). `cargo build`/`cargo test` builds the cdylib for the
# HOST target too — an artifact nothing ever loads — and on ELF that link fails:
#     rust-lld: error: relocation R_X86_64_TPOFF32 against _mi_heap_default
#               cannot be used with -shared
# `libleanrt.a:static.c.o` — the Lean 4.30.0 toolchain's bundled mimalloc — uses local-exec
# TLS, which is only legal in a main executable. Measured 2026-07-26 on persvati: both
# crates fail this way; the same `cargo build -p grain-verify-wasm` LINKS on macOS (Mach-O
# has no equivalent rule), which is why the macOS `cargo test --workspace` job is green and
# the Linux one has been unable to complete.
# The mimalloc objects ride INSIDE `dregg-lean-ffi`'s rlib — rustc bundles `static=`-linked
# native libs into the rlib — and are pulled in to satisfy the `+whole-archive` FFI shim.
# `-Wl,--gc-sections` is already on that link line and cannot help: a rejected relocation is
# a resolution-time error, before any section could be dropped.
# There is NO per-crate opt-out inside one workspace resolve: `dregg-lean-ffi`'s
# `no-lean-link` feature UNIFIES onto every native crate (the reason `wasm` is excluded,
# above) and `DREGG_LEAN_LINK=shared` — the toolchain knob that swaps the static runtime for
# `libleanshared.so` — is an env var, i.e. whole-build, and propagates no rpath downstream.
# So a Linux workspace test is TWO invocations, and the second is not optional:
#     cargo test --workspace --exclude deos-zed \
#         --exclude grain-verify-wasm --exclude starbridge-web
#     cargo test -p grain-verify-wasm -p starbridge-web --lib
# THE SECOND LINE IS WHY THE FIRST COSTS NO TEST. `--lib` selects only the lib-as-test
# target, which rustc builds with `--test` into an EXECUTABLE — never a cdylib — so all 9
# native tests (grain-verify-wasm's 8 agreement tests + starbridge-web's
# `wire_msg_roundtrips`) still run on Linux. Dropping the second line silently narrows the
# broadest gate in the repo by nine; keep them together. What the pair still does not link
# on Linux: the two libs' doctests (measured: zero doc examples in either crate),
# `gen-fixture` (zero #[test]), and starbridge-web's `pty_ws_e2e` / `web_panes_wasm` (both
# already `never-run` rows in `.github/dark-targets.txt`). All four stay covered by
# `cargo check --workspace --all-targets` (which does not link) and by the whole macOS
# `cargo test --workspace`.
# ⚠ `cargo build --workspace` (repro-gate.yml's manual `repro-gate-full-workspace`) hits the
# SAME wall on Linux for the same reason — it is a LINK constraint, not a `cargo test` one.
members = ["macaroon", "secrets", "token", "tokenizer", "hints", "commit", "trace", "demo", "demo-agent", "demo/sdk-consensus", "demo/dungeon-service", "demo/real-dungeon-service", "federation", "dregg-codec", "circuit", "circuit-prove", "recursion-verify", "deco-prove", "audit", "bridge", "wire", "persist", "cell", "cell-crypto", "turn", "turn-prover", "exec-lean", "coord", "tests", "types", "sdk", "dregg-sdk-net", "node", "intent", "net", "discharge-gateway", "teasting", "app-framework", "dregg-payable", "dregg-dsl", "dregg-dsl-runtime", "dregg-dsl-tests", "dregg-dsl-differential", "blocklace", "captp", "cli", "verifier", "protocol-tests", "observability", "storage", "starbridge-apps/nameservice", "dfa", "dfa-federation", "rbg", "credentials", "directory", "starbridge-apps/identity", "starbridge-apps/subscription", "starbridge-apps/governed-namespace", "starbridge-apps/compartment-workflow-mandate", "starbridge-apps/storage-gateway-mandate", "starbridge-apps/privacy-voting", "starbridge-apps/bounty-board", "starbridge-apps/agent-provenance", "starbridge-apps/tool-access-delegation", "starbridge-apps/sealed-auction", "starbridge-apps/polis", "starbridge-apps/escrow-market", "starbridge-apps/first-room", "starbridge-apps/compute-exchange", "starbridge-apps/gallery", "starbridge-apps/swarm-orchestration", "starbridge-apps/supply-chain-provenance", "starbridge-apps/agent-orchestration", "starbridge-apps/tussle", "starbridge-apps/kvstore", "starbridge-apps/branch-stitch-multiplayer", "starbridge-apps/execution-lease", "starbridge-apps/org", "starbridge-apps/vat", "starbridge-apps/billing", "dregg-sandbox", "starbridge-apps/guard", "starbridge-apps/domains", "starbridge-apps/edge-mandate", "dregg-umem", "dregg-storage-templates", "preflight", "dregg-lean-ffi", "lightclient", "redteam", "perf", "dregg-auth", "dregg-query", "audit-flashprove", "dregg-merge", "dregg-userspace-verify", "dregg-deploy", "dregg-analyzer", "dregg-mirror", "dregg-epoch", "dregg-genesis-snapshot"