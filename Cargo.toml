[workspace.lints.rust]
# `deny` (escalated from "warn" 2026-07-17; flipped from "allow" 2026-07-16, ember-approved).
# `unexpected_cfgs` fires on a `cfg(feature = "X")` where X is NOT a declared feature — always-false, so
# the gated code silently compiles to NOTHING. That is how a fail-open peer-exchange guard (cell-crypto,
# `zkvm` — no such feature), the "production PIR discovery transport" (dregg-sdk-net, `reqwest` — a
# non-optional dep, not a feature), and the never-compiled `gen_plonky3` DSL backend (emitted code that
# didn't build; deleted 43b930241) all vanished from every build undetected. The surfaced set is cleared,
# so the class is now a build error. NOTE: this binds only crates with `[lints] workspace = true` —
# every member has it (added 2026-07-17) except crates whose manifests other lanes held dirty at the
# time (see TESTQALOG 2026-07-17 board/lane-a); vendored third-party (starbridge-v2/vendor/*) keeps
# rustc's default warn with its real build-script cfgs declared in its own manifest.
unexpected_cfgs = "deny"

[profile.bench]
opt-level = 3
lto = "thin"
codegen-units = 1

# Incremental compilation is OFF for dev/test. The default-on incremental
# partitioner interacts badly with the opt-level asymmetry below: the
# `dregg-circuit` lib is opt-level 3 (rustc disables `share-generics` export at
# opt>=2, so the rlib does NOT emit shared generic monomorphizations), while the
# integration-test binaries are opt-level 0 (`share-generics` import ON, so they
# emit only *references* to those upstream instantiations). Under incremental,
# rustc's stale-CGU reuse drops the object that would define a referenced p3
# generic (e.g. `BinomialExtensionField::from_ext_basis_coefficients`,
# `p3_uni_stark::verifier::recompose_quotient_from_chunks`,
# `p3_batch_stark::symbolic::get_max_constraint_degree`) while keeping the
# reference in a sibling `.rcgu.o` — yielding undefined-symbol link failures on
# the prover-feature test umbrella (`anon.*`/`.llvm.<hash>` dangling locals).
# Disabling incremental forces a clean per-build partition so every monomorph is
# emitted. Cheap here: all packages + deps already compile at opt-level 3 below,
# so incremental's reuse buys little, and a green link is the floor everything
# rides on. (Witness: `CARGO_INCREMENTAL=0 cargo build … --tests` links clean.)
[profile.dev]
incremental = false

# DEBUG INFO: line tables only. Nothing in this repo reads full DWARF, and full
# DWARF was 83-92% of every debug binary.
#
# MEASURED — a controlled A/B on ONE artifact, one lane (persvati:darkpool), one
# revision (03759c3a2), identical features, this key the only variable. Both
# binaries were kept side by side; reproduce with `size -A <binary>`:
#
#                        debug=2 (was)   line-tables-only (is)    delta
#     file on disk        1570.6 MB          665.0 MB           2.36x smaller
#     DWARF total         1249.7 MiB         388.9 MiB          3.21x smaller
#     .debug_str           490.4 MiB         164.1 MiB           -66.5%
#     .debug_info          375.3 MiB          90.5 MiB           -75.9%
#     .debug_loc           225.6 MiB          17.8 MiB           -92.1%
#     .debug_ranges         78.7 MiB          45.7 MiB           -41.9%
#     .debug_line           70.5 MiB          64.3 MiB            -8.9%
#     .text                107.4 MiB         104.5 MiB            -2.8%
#     DWARF as % of file      83.4%             61.3%
#
# The 84% is not one unlucky binary: the 20 largest ELF artifacts in the lane
# measured 83.4-84.5% DWARF each, and all 528 linked binaries under target/debug
# totalled 168.6 GiB of which 152.8 GiB (90.6%) was DWARF.
#
# THE .text WOBBLE IS NOT DEAD-CODE RETENTION — it was worth checking, because if
# `-g` had been keeping otherwise-collectable code alive, dropping it would have
# been changing what we SHIP. It is not: over the 212,534 function names present in
# both binaries, 69.8% are byte-identical in size, 29.2% are smaller under
# line-tables-only, 0.9% larger, netting -2.76% — which is the entire section
# delta. The smaller binary has slightly MORE `.text` symbols (303,546 vs
# 303,045), so nothing was dropped; per-function codegen simply differs under
# `-g`, concentrated in heavily-inlined functions. Which LLVM pass is responsible
# is NOT isolated.
#
# STILL DWARF AFTER THIS: 61.3% of the remainder, dominated by `.debug_str`
# (164.1 MiB of mangled names for the subprogram/inlined-frame skeleton) and
# `.debug_line` (64.3 MiB). Those two ARE the backtrace-attribution machinery, so
# this key is the end of the free win, not the end of the weight. `debug = 0`
# would take the file to roughly 245 MiB by section arithmetic (UNBUILT — not a
# measurement), at the cost of file:line on backtrace frames. That is a real
# trade, so it is ember's call, not a default.
#
# `.debug_loc` is 226 MB because of the opt-level = 3 below, NOT because of this
# key: an optimized variable needs a location LIST per live range instead of one
# stack slot. So the two settings compound, and neither is the other's fault.
#
# WHAT THIS DOES NOT COST US. Verified by experiment, not assumed:
#   - PANIC LOCATIONS SURVIVE. `panicked at foo.rs:6:27` and the full `assert_eq!`
#     left/right dump are `#[track_caller]` + static `core::panic::Location` data
#     baked into .rodata. They are not DWARF; they are byte-identical even at
#     `debuginfo=0`. Every panic-based tooth in the tree keeps its teeth.
#   - BACKTRACE FUNCTION NAMES SURVIVE: they come from `.symtab`, also not DWARF.
#     (Which is why `strip` is NOT set here and must not be — that WOULD take
#     them. Nothing above deletes symbols.)
#   - `debug = "line-tables-only"` keeps `.debug_line`, so a backtrace FRAME can
#     still resolve to file:line. Full `debuginfo` buys variable inspection in a
#     debugger, and the tree has no debugger consumer: zero rust-gdb/rust-lldb
#     invocations, zero `Backtrace::capture`, zero debugger config files.
# If a debugging session ever needs locals, get them per-invocation without
# editing this file: `CARGO_PROFILE_DEV_DEBUG=2 cargo test …`.
#
# Package overrides inherit every key they do not name, so the `opt-level = 3`
# blocks below pick this up too — deps included. `profile.test` inherits `dev`.
# `release`/`bench` are untouched (they already default to no debug info).
#
# THIS DOES NOT REACH THE EXCLUDED WORKSPACES. All 11 of them carry their own
# `[workspace]` and none sets `debug`, so each still defaults to full DWARF:
# solana-lock, solana-settlement, wasm, sdk-py, pg-dregg, deos-zed-full,
# discord-bot, dregg-tui, deos-homeserver, durable-workflow, forge-ci-runner.
# A profile key cannot cross a workspace root; each needs its own line.
#
# NOT set: `split-debuginfo` — deliberately, and NOT because it is worthless.
# It is platform-divergent (macOS already defaults to `unpacked`, which is exactly
# why a Mac binary never carried this weight while a Linux one did; on Linux the
# default is `off`, so the linker copies every dep's DWARF into every binary).
# Measured on this lane: the 20 largest ELF artifacts are 28.8 GiB holding 24.2 GiB
# of DWARF (84.0%), and they are 20 near-identical copies of the SAME dependency
# DWARF — which is the shape split-DWARF deduplicates, since `.dwo` sidecars are
# emitted once per crate rather than copied once per linked binary. So it is a
# plausibly large second win, not a wash.
# It stays unset because it is UNVERIFIED at workspace scale: `off`/`packed`/
# `unpacked` were each confirmed to link and to keep panic locations on Linux
# x86_64 AND macOS arm64, but only on a standalone test crate, and the toy cannot
# size the effect (its DWARF comes from precompiled std, which split-DWARF does
# not touch). Note `.debug_line` CANNOT move to a `.dwo`, so this compounds with
# the key above rather than replacing it. Land it behind a real measurement.
debug = "line-tables-only"

# Fast dev/test builds with FAST crypto: keep our own crates cheap to compile
# (opt-level 0, quick iteration) but build all DEPENDENCIES optimized so the
# crypto primitives (plonky3 p3-*, poseidon2, BLS12-381, FRI) don't run
# unoptimized in debug — a debug-build STARK verify/prove pins a core for ages
# otherwise (e.g. dregg-lightclient tests). opt-level 3 deps + opt-level 0 ours
# = the best of both. Applies to the `test` profile too (it inherits `dev`).
[profile.dev.package."*"]
opt-level = 3

# The crypto-heavy WORKSPACE crates also get optimized in dev/test (they hold
# hot proving/verifying loops that the `*` glob above does not cover for
# workspace members). Compile cost is amortized by caching; runtime is night/day.
[profile.dev.package.dregg-circuit]
opt-level = 3
[profile.dev.package.dregg-lightclient]
opt-level = 3
# `dregg-circuit-prove` holds the recursion proving + AGGREGATION hot path —
# `aggregate_tree`/`merge_two_segment_proofs`, the in-circuit `seg_poseidon_commit`
# sponge + `segment_combine_expose`, the descriptor-leaf AIR construction. At
# opt-level 0 a single whole-chain fold pins a core for tens of minutes (the debug
# `-p dregg-lightclient` / `ivc_turn_chain` recursion tests never finish); at
# opt-level 3 it is the usual minutes. ALWAYS optimize it.
[profile.dev.package.dregg-circuit-prove]
opt-level = 3
