# datalog-check — the extracted stratified-Datalog checker (lane A, 2026-11-06): reads
# {"statement", "certificate"} JSON, runs `JoinClosure.verifyJ` (+ `verifyBudgetJ` when the
# statement carries a budget), prints the statement and the verdict, exits 0/1 (2 = bad input).
# `verifyJ_verifyS` transfers `StratifiedCert.verifyS_sound` to what this accepts. NOT a default
# target. Demo: ../demo/datalog-governance/run.sh
#
#     lake build datalog-check
#     ./.lake/build/bin/datalog-check ../demo/datalog-governance/data/certificate.json
[[lean_exe]]
name = "datalog-check"
root = "DatalogCheck"

# dfa-run — the flat-table DFA runner of the absence-receipt demo (lane C, 2026-11-06): reads a
# `dfa`-crate table JSON and a document (or a corpus manifest) and prints the verdict / the count.
# Imports Lean core only (Dregg2.Automata.TableRun); `TableRunSpec.accepts_iff` proves its verdict
# is `Deriv.PredRE.TableDfa.accepts`. NOT a default target. Demo: ../demo/absence-receipt/run.sh
#
#     lake build dfa-run
#     ./.lake/build/bin/dfa-run table.json --corpus <root> <manifest>
[[lean_exe]]
name = "dfa-run"
root = "DfaRun"

# policyc — the policy language's compiler, extracted from Lean (lane B, 2026-11-06):
# `check` / `fmt` / `compile --pattern NAME [--absence]` / `rules`. The parser is the one
# `Dregg2.Policy.Theorems.parse_print_roundtrip` is about; `compile` emits the byte table that
# `Dregg2.Policy.Compile.compiled_decides` proves decides the pattern. NOT a default target.
#
#     lake build policyc
#     ./.lake/build/bin/policyc compile Dregg2/Policy/examples/absence.policy --pattern delim --absence
[[lean_exe]]
name = "policyc"
