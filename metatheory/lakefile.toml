# GameFixtureGuards — the non-PathOfAngels half of the 2026-08-08 fixture split: the
# Automatafl and MultiwayTug fixture pins, converted from 252 in-module `#guard`s into
# named `native_decide` theorems (per docs/GUARD-DISCIPLINE.md — a fact worth asserting
# is worth naming) and moved OUT of the `Dregg2.FFI` closure. The five parent modules
# (`AutomataflRules`/`AutomataflFFI`/`Automatafl`/`MultiwayTug`/`MultiwayTugFFI`) stay in
# the closure for their exports and definitions and now carry ZERO elaboration-time
# evaluation; these five Fixtures modules carry all of it, so a game-fixture regression
# reds THIS library in a plain `lake build` and can no longer take the crypto archive
# down. Direct globs, same mechanism as PathOfAngelsGuards.
[[lean_lib]]
name = "GameFixtureGuards"
globs = [
  "Dregg2.Games.AutomataflRulesFixtures",
  "Dregg2.Games.AutomataflFFIFixtures",
  "Dregg2.Games.AutomataflFixtures",
  "Dregg2.Games.MultiwayTugFixtures",
  "Dregg2.Games.MultiwayTugFFIFixtures",
]

# ZkmlSuiteGuards — the checked, deterministic producer boundary consumed by
# Selvage/minidregg.  Direct-globbed because the module also carries the emit
# `main`; compiling this target runs its named meaning/KAT checks without pulling
# the emitter into the broad Dregg2 aggregate or leaving it as an orphan.
[[lean_lib]]
name = "ZkmlSuiteGuards"
globs = ["Dregg2.Circuit.ZkmlSuiteArtifact"]

# mina_wrap_opening_sched_emit — `dregg-mina-wrap-opening-sched::v1`: the IPA opening relation
