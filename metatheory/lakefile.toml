name = "Dregg2"
defaultTargets = ["Dregg2", "Metatheory", "Polis", "Market", "Bfv", "PicklesSynthesis", "MinaBridgeGuards", "CommitBindsGuards", "TurnAuthGuards", "PicklesEmitDrivers", "DivergenceToothGuards", "PathOfAngelsGuards", "GameFixtureGuards", "ZkmlSuiteGuards", "CallTreeGuards"]

# Pin mathlib to the exact revision matching v4.30.0
# (rev 1c2b90b13009c65b090d95a83c98e248deafb6f1). This is a PORTABLE `git`+`rev`
# require: `lake` fetches mathlib itself into `.lake/packages/mathlib` on any host,
# with NO assumption about where the repo was cloned. (It replaced a host-fragile
# `path = "../../../src/mathlib4"` local require that only resolved when breadstuffs
# was cloned exactly two levels under $HOME with mathlib as a $HOME/src sibling —
# which broke a fresh Linux cold-bootstrap on lassie. See docs/LEAN-SEED-ARTIFACT.md.)
#
# LOCAL FAST PATH (optional, no re-download): if you already have a warm mathlib
# checkout at the pinned rev, symlink it into the packages dir BEFORE the first
# `lake build` so lake reuses it instead of cloning + re-fetching oleans:
#     ln -sfn /path/to/your/mathlib4 metatheory/.lake/packages/mathlib
# (`.lake/` is gitignored + per-machine; this changes nothing committed.)
[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "1c2b90b13009c65b090d95a83c98e248deafb6f1"

[[lean_lib]]
name = "Dregg2"

# The Metatheory/* epistemic+categorical tree. Globbed (no `Metatheory.lean`
# root needed) so the WHOLE subtree — Categorical, Disputation, and every
# Open/* front — lands in the default `lake build` target and CI covers it.
# Previously only EpistemicConsensus/EpistemicDial were reachable (via Dregg2's
# Crypto imports); Categorical/Open.* were verified only via `lake env lean`.
[[lean_lib]]
name = "Metatheory"
globs = ["Metatheory.+"]

# The Polis/* polisware-constitution theory — split out of `Metatheory/` so the
# core categorical/dynamics/settlement spec stays uncrowded. Files keep their
# `Metatheory.*` namespaces (qualified names resolve unchanged); only the MODULE
# path moved (`Metatheory.PolisX` → `Polis.PolisX`). The two libs interleave at
# the module level (core game files import Polis theory; some Polis files import
# core game/dynamics files) — Lake resolves this fine, no module-import cycle.
[[lean_lib]]
name = "Polis"
globs = ["Polis.+"]

# A CALLABLE GOVERNOR: the verified `Metatheory.PolisSandbox.govStep` as a
# stdin/stdout service. Reads `<d0> <d1> <actor> <action> [victim]` per line,
# applies the SAME envelope `sandbox_governed_safe` proves keeps the floor, and
# prints ADMIT/REFUSE + the resulting world. (Root module: PolisGovernor,
# file ./PolisGovernor.lean.)
[[lean_exe]]
name = "polis_governor"
root = "PolisGovernor"

# mina_sg_bench — the NATIVE-COMPILED cost of one Mina checkpoint's `<s, srs.g>` leg.
# `Dregg2.Bridge.MinaWrapSgWeld` pins the same fold under `#guard`, which runs Lean's INTERPRETER
# (no `precompileModules` here), so the weld's wall time is an upper bound and not the compiled
# cost. This exe runs the identical `PastaIpaFold.msmHornerM` over the same 32,768 real generators
# through `leanc` and prints the number `docs/MINA-CHECKPOINT-CADENCE.md` §5a needs — self-checking
# in both polarities (non-zero exit if the fold misses block 539508's `sg`, and non-zero exit if a
# tampered generator list is accepted).
#
# ⚠ DELIBERATELY NOT IN `defaultTargets`: it drags `MinaWrapSrsG` (5.4 MB of Lean, 64 blocks of 512
# points) through C codegen. Build it explicitly, like `polis_governor`:
#     lake build mina_sg_bench && ./.lake/build/bin/mina_sg_bench
[[lean_exe]]
name = "mina_sg_bench"
root = "MinaSgBench"

# mina_chain_emit — the 46 witnesses of block 539508's phase-2 Fq transcript
# (`Dregg2.Circuit.Emit.MinaPhase2Chain`), the input to the recursion tree in
# `circuit-prove/src/mina_phase2_chain_leaf.rs`.
#
# ⚠ COMPILED FOR A REASON, and the reason is measured: one 2 048x469 trace costs 9 min 20 s
# through `lake env lean --run` (Lean's INTERPRETER), so 46 links would be seven hours of
# RENDERING — a codegen cost mistaken for a cost of the chain. Same objects, `leanc`.
#
# ⚠ DELIBERATELY NOT IN `defaultTargets`, like `mina_sg_bench`: it drags the whole Pasta sponge
# cone through C codegen. Build it explicitly:
#     lake build mina_chain_emit
#     ./.lake/build/bin/mina_chain_emit ../circuit/tests/fixtures/pasta-fq-chainlink 4   # ~4 min
#     ./.lake/build/bin/mina_chain_emit ../circuit/tests/fixtures/pasta-fq-chainlink     # all 46, ~45 min
#
# The optional COUNT exists so the fold gate is livable: sections 1-4 of
# `circuit-prove/tests/mina_phase2_chain_fold.rs` reach only links 0..3. A gate that needs 45
# minutes of rendering before it can run at all is one every machine reports RED and everyone
# learns to ignore.
[[lean_exe]]
name = "mina_chain_emit"
root = "MinaChainEmit"

# mina_fp_chain_emit — the PHASE-1 (Fp) twin: the `fp_kimchi` round and absorption fixtures plus
# the 27 witnesses of block 539508's phase-1 transcript (`Dregg2.Circuit.Emit.MinaPhase1Chain`),
# whose link 26 output lane 1 is the `fq_digest` the phase-2 chain absorbs as tape element 0 — AND
# the 28 witnesses of `Dregg2.Circuit.Emit.MinaWrapVkDigestChain`, the pinned Wrap verifier index's
# own commitments, whose link 27 output lane 0 is the `VKDIGEST` that tape STARTS with. Same
# descriptor for all 55 links; no new AIR.
#
# ⚠ COMPILED for the SAME measured reason as `mina_chain_emit`: one 2 048x469 trace costs
# 9 min 20 s through Lean's interpreter.
#
#     lake build mina_fp_chain_emit
#     ./.lake/build/bin/mina_fp_chain_emit ../circuit/tests/fixtures 0   # the 3 tracked fixtures
#     ./.lake/build/bin/mina_fp_chain_emit ../circuit/tests/fixtures     # …and all 27 links
[[lean_exe]]
name = "mina_fp_chain_emit"
root = "MinaFpChainEmit"

# mina_finalize_scalars_emit — `dregg-mina-finalize-scalars::v2`: the descriptor, the real-block
# honest trace/PIs and three refusal traces — the lct-shift trace among them: it ACCEPTED at v1
# (the open LCT port's one-parameter family) and the v2 gate-linearization leaf REFUSES it.
# COMPILED for the same measured reason as the chain emitters (the interpreter is ~50x slower on
# trace rendering). Deliberately NOT in defaultTargets. (The §4 slot tables are re-rendered by
# `lake env lean --run FsAllocRender.lean` and machine-spliced — never hand-typed.)
#
#     lake build mina_finalize_scalars_emit
#     ./.lake/build/bin/mina_finalize_scalars_emit ../circuit/tests/fixtures
[[lean_exe]]
name = "mina_finalize_scalars_emit"
root = "MinaFinalizeScalarsEmit"

# emit_seam_specs — the byte source for `circuit/descriptors/seams/` (SeamSpec JSONs + the port
# census). A lakefile target ON PURPOSE: `EmitMinaWrapClosing.lean`'s header names the
# scratch-driver-with-no-target shape as a defect (an API change stays CI-green until a human
# re-runs the emit); this one is `lake exe emit_seam_specs` and builds with the tree. Tiny data —
# the interpreter route (`lake env lean --run EmitSeamSpecs.lean`) is instant too.
[[lean_exe]]
name = "emit_seam_specs"
root = "EmitSeamSpecs"

# Market/* — DrEX (Dragon's Egg Exchange): the Lean-first proof-carrying exchange tower
# (namespace `Market`, composing with Dregg2.Intent + Dregg2.Intent.Ring). Root module
# `Market` (./Market.lean) aggregates Market/*; also imported from the Dregg2 root so the
# whole-tree build covers it either way.
[[lean_lib]]
name = "Market"

# Bfv/* — Lean-first BFV for the additive fold path (namespace `Bfv`): the two
# silent-failure guards as theorems — class (C) plaintext-modulus wrap (`Bfv.NoWrap`,
# honest tight capacity: 15 full-range u16 orders per bucket at t=1032193) and class (A)
# noise budget (`Bfv.Noise.decrypt_exact` + the emitted `noiseMargin`/`marginHolds`
# observable, `Bfv.Fold`), on the deployed fhe.rs degree-4096 parameters. Class (B)
# lattice security is NOT a Lean theorem (estimator artifact) — named in the root doc.
# Root module `Bfv` (./Bfv.lean) aggregates Bfv/* and pins the namespace kernel-clean.
[[lean_lib]]
name = "Bfv"

# PicklesSynthesis — the CI home for the Pickles-in-Lean SYNTHESIS rung (R1–R4a). Root module
# `Dregg2.PicklesSynthesis` (./Dregg2/PicklesSynthesis.lean) is a pure re-export aggregate importing
# the six clean-cone Pickles modules (KimchiCustomGates/Placement/Render + the three Pickles*Diff
# statement modules). Before this, those six built only under `lake env lean <file>` and were reachable
# from NO `defaultTargets` library, so their `#assert_axioms`/`by decide` o1js/chain differentials
# never ran in a plain `lake build` (gating-defaults-to-silence). Making it its own lean_lib + a
# defaultTarget roots them WITHOUT touching the `Dregg2.lean` import block (swept by sibling lanes).
# The de-vacuum modules (CaveatCommitBindsOrCollides/RotatedCommitBindsOrCollides) are NOT imported here
# — they now have their own root, `CommitBindsGuards` (bottom of this file); the deferral is CLOSED.
[[lean_lib]]
name = "PicklesSynthesis"
globs = ["Dregg2.PicklesSynthesis"]

# MinaBridgeGuards — the CI home for the Mina→dregg wrap-recursion welds (the P4 recursion-boundary
# evidence). Root module `Dregg2.MinaBridgeGuards` (./Dregg2/MinaBridgeGuards.lean) is a pure re-export
# aggregate importing the six `MinaWrap*`/`TickShifts` welds. Before this, those six built only under
# `lake env lean <file>` and were reachable from NO `defaultTargets` library, so their `#guard`/
# `#assert_axioms` replay/refutation goldens against real block 539508 never ran in a plain `lake build`
# — the exact gating-defaults-to-silence wound `MinaWrapFtEval0Weld` was born from
# (`scripts/check-guard-modules.py`). Making it its own lean_lib + a defaultTarget roots them WITHOUT
# touching the `Dregg2.lean` import block (swept by sibling lanes), mirroring PicklesSynthesis.
# The soundness de-vacuum modules (CaveatCommitBindsOrCollides/RotatedCommitBindsOrCollides) got their
# own root once `EffectVmEmitV2` went green — see `CommitBindsGuards` below.
[[lean_lib]]
name = "MinaBridgeGuards"
globs = ["Dregg2.MinaBridgeGuards"]

# CommitBindsGuards — the CI home for the FLOOR-FREE commitment-binding teeth (the 2026-07-31
# light-client soundness-weld de-vacuuming). Root module `Dregg2.CommitBindsGuards`
# (./Dregg2/CommitBindsGuards.lean) is a pure re-export aggregate importing the two `_or_collides`
# modules: `Dregg2.Circuit.Emit.CaveatCommitBindsOrCollides` (caveat manifest + DFA rc carrier) and
# `Dregg2.Circuit.RotatedCommitBindsOrCollides` (the PUBLISHED OLD_COMMIT/NEW_COMMIT rotated commit).
# Both restate anti-ghost bindings WITHOUT the `Poseidon2SpongeCR` floor this tree PROVES FALSE at
# deployed BabyBear width. `scripts/check-guard-modules.py` listed BOTH as `UNTRACKED-ORPHAN` — not
# even in `lean-orphans-allow.txt` — so their thirteen `#assert_axioms` ran in NO plain `lake build`.
# This was deferred twice above because the Rotated cone pulls `Dregg2.Circuit.Emit.EffectVmEmitV2`,
# RED at HEAD mid-ChipArity cutover; `f81509ff6` (the `chipArity_le_rate hins` one-liner) fixed it, so
# the deferral has outlived its reason. Verified GREEN at HEAD via `scripts/dregg-clean-build` (83s).
# Its own lean_lib + defaultTarget, mirroring PicklesSynthesis/MinaBridgeGuards, roots them WITHOUT
# touching the `Dregg2.lean` import block (swept by sibling lanes).
[[lean_lib]]
name = "CommitBindsGuards"
globs = ["Dregg2.CommitBindsGuards"]

# TurnAuthGuards — the CI home for the in-AIR AUTHORIZATION gadget (`TurnAuthLamportEmit`, the
# hash-based one-time signature verified over the deployed Poseidon2 chip) and its cap-open weld
# (`TurnAuthCapOpenWeld`, which re-introduces `actor`/`dst` as PUBLISHED AND FORCED). Root module
# `Dregg2.TurnAuthGuards` (./Dregg2/TurnAuthGuards.lean) is a pure re-export aggregate over the two.
# Before this, BOTH were reachable from NO `defaultTargets` library — `EmitTurnAuthProbe.lean` and
# `EmitRotationV3.lean` import them but neither is in this file — so their 46 `#guard`/`#assert_axioms`
# ran in no plain `lake build`, and their oleans on disk were dated Jul 30, i.e. unchecked straight
# through the ChipArity absorb-arity cutover that touched this very gadget. Same
# gating-defaults-to-silence wound as PicklesSynthesis/MinaBridgeGuards/CommitBindsGuards above, and
# rooted the same way: its own lean_lib + defaultTarget, WITHOUT touching the `Dregg2.lean` import
# block (swept by sibling lanes). Verified GREEN before rooting (`lake build` of both, 3171 jobs).
# ⚑ This one was additionally HIDDEN: `scripts/check-lean-orphans.sh` capped its listing at 40 names
# against 59 unlisted orphans, so these two were counted and never named. Cap removed in the same
# change; the gate's seed list now comes from THIS file rather than a stale copy of it.
[[lean_lib]]
name = "TurnAuthGuards"
globs = ["Dregg2.TurnAuthGuards"]

# ── 2026-08-04 — THE 23-ORPHAN SWEEP ────────────────────────────────────────────────────────────
# Three libs, same mechanism as PicklesSynthesis/MinaBridgeGuards/CommitBindsGuards/TurnAuthGuards
# above: root a cone of orphans WITHOUT touching the `Dregg2.lean` import block (swept by siblings).
#
# ⚑ WHY `globs` NAMES EACH MODULE DIRECTLY INSTEAD OF A RE-EXPORT AGGREGATE. The four libs above
# each glob ONE aggregate module that imports its cone. That shape is UNAVAILABLE here: eight of
# these modules carry a top-level `def main`, and an aggregate importing two of them is a duplicate
# `main` declaration — the exact reason `Dregg2.lean:1328-1330` gives for excluding `EmitAllJson` /
# `EmitGraduate` ("their top-level `main` collides with `Dregg2.Apps.AgentOrchestration.main`").
# A `globs` entry that names a module compiles it as its OWN module, in its own environment, so the
# `main`s never meet. That is what makes these drivers rootable at all rather than allowlisted
# forever, and it retires the "pure `def main` ⇒ nothing to enmesh" reasoning: there WAS something
# to enmesh — the compile itself. (`check-lean-orphans.sh` seeds a bare glob name directly, so its
# reachability agrees with lake's.)
#
# COST, MEASURED 2026-08-04 (`lean` with an extracted LEAN_PATH, warm .lake, per module):
#   PicklesEmitDrivers   7 modules   5–11 s   (~59 s total)
#   DivergenceToothGuards 6 modules  2–5 s    (~24 s total)
#   PathOfAngelsGuards   7 modules   3–7 s    (~31 s total)
# ~114 s added to a full build for 258 `#assert_axioms` + 10 `#assert_compiled` that ran NOWHERE.
# ⚠ The cone cost is ZERO beyond the modules themselves: every import these 20 modules make was
# ALREADY in the default-target closure (measured — rooting all 20 adds exactly 20 modules). The
# "rooting pulls a large cone" worry does not apply to this population; `KimchiWrapMain`, the usual
# example, is already rooted via `PicklesSynthesis`.

# PicklesEmitDrivers — the `lake env lean --run` JSON emit drivers for the Pickles/Kimchi harnesses.
# Zero theorems and zero pins each, so this buys COMPILE COVERAGE, not verification: these are the
# modules that break when `KimchiWrapMain`/`KimchiRenderPoseidon`/`KimchiComposeMSM` change shape,
# and until now they broke SILENTLY — the render modules are rooted (PicklesSynthesis) while their
# drivers were not, so an API change stayed green in CI and failed only when a human ran the emit.
# That is the `TurnAuthLamportEmit` wound (stale oleans through a cutover) one file over.
# ⚑ `EmitStepWrapChainJson` JOINED 2026-08-04, when the redness it waited on was repaired: the
# `KimchiStepWrapChain` conjunct W-PREV falsified was a WIDTH (`23 = 22`), not the tamper claim.
# Both modules are de-listed from `scripts/lean-orphans-allow.txt`.
[[lean_lib]]
name = "PicklesEmitDrivers"
globs = [
  "Dregg2.Circuit.Emit.EmitComposeMsmJson",
  "Dregg2.Circuit.Emit.EmitStepWrapChainJson",
  "Dregg2.Circuit.Emit.EmitCurveGateJson",
  "Dregg2.Circuit.Emit.EmitPoseidonJson",
  "Dregg2.Circuit.Emit.EmitPublicInputJson",
  "Dregg2.Circuit.Emit.EmitStepFragmentJson",
  "Dregg2.Circuit.Emit.EmitStepMainJson",
  "Dregg2.Circuit.Emit.EmitWrapMainJson",
  # ⚑ The §15c‴ memo's BOOTSTRAP. It prints `finSpDerivedWords` so `FIN_DEFERRED_CIP/_B/_XI`
  # can be typed in; the OBLIGATION that they are that triple is discharged by
  # `fin_deferred_words_are_the_derivation` (`…Pins12`, `native_decide` + `#assert_compiled` —
  # ⚠ this line said "kernel `rfl`" and was the FIFTH docblock to say so about a theorem that
  # did not exist until 2026-08-05; the derivation is a 1732-op `Array FOp` program and `whnf`
  # models an `Array` as a `List`) and `EmitWrapMainJson`'s refusal.
  # It was an unlisted orphan and therefore never compiled -- while it was the only way to
  # repair the memo that `d6683dd54` left at three zeros, which made every wrap emission
  # REFUSE. A bootstrap nothing builds is a bootstrap nobody can run.
  "Dregg2.Circuit.Emit.EmitWrapFinDeferred",
  # ⚑ JOINED 2026-08-07, from `check-lean-orphans` — both were UNLISTED orphans, i.e. compiled by
  # no default target AND not recorded as a deliberate exclusion, which is the one state this tree
  # refuses. Same class as every row above (`def main : IO Unit`, `lake env lean --run` drivers,
  # zero theorems), so this buys COMPILE COVERAGE against the render/pins modules they call:
  #   * `EmitPreimageJson` writes `preimage.json` / `unbound.json` / `preimage_ae.json` over
  #     `KimchiPreimageCircuit` + `KimchiAssertEqual`.
  #   * `EmitWrapFortyAgreement` re-derives the per-slot agreement count that
  #     `KimchiWrapMainPins10`/`Pins12` are graded on — `Pins12`'s own docblock cites it by name
  #     for the 2026-08-06 measurement. A driver a gate's docblock quotes, that nothing compiles,
  #     is a number nobody can reproduce.
  # ⚠ Its olean on disk was STALE when this landed (source 08-07 07:02, olean 08-06 20:27) — the
  # `TurnAuthLamportEmit` shape one more time. Both were elaborated clean under `lake env lean`
  # before being rooted here, so this adds coverage, not redness.
  "Dregg2.Circuit.Emit.EmitPreimageJson",
  "Dregg2.Circuit.Emit.EmitWrapFortyAgreement",
]

# DivergenceToothGuards — the first-divergence / tooth-combinator statement cone plus the Mina
# fixture emitter. 70 `#assert_axioms` across `FirstDivergence` (22), `FirstDivergenceInstances`
# (33), `ToothCombinator` (14) and `Verify.ToothCheck` (1), plus `MinaFixtureEmit`'s 3 — none of
# which ran in a plain `lake build`. `ToothCombinator` prints a four-line tooth census at
# elaboration (unconditional-false / refutable / fires / same-witness) that was going to no log.
# `KimchiStepWrapChainFixture` is here for compile coverage only (it is a pure data fixture, and it
# is GREEN — it is the CHAIN module that is red, not the fixture).
[[lean_lib]]
name = "DivergenceToothGuards"
globs = [
  "Dregg2.Circuit.FirstDivergence",
  "Dregg2.Circuit.FirstDivergenceInstances",
  "Dregg2.Circuit.ToothCombinator",
  "Dregg2.Verify.ToothCheck",
  "Dregg2.Circuit.Emit.MinaFixtureEmit",
  "Dregg2.Circuit.Emit.KimchiStepWrapChainFixture",
]

# PathOfAngelsGuards — the Path-of-Angels game cone: 185 `#assert_axioms` + 10 `#assert_compiled`
