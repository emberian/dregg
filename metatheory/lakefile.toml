# calltree-check — the call-tree certificate checker (initiative 9, 2026-11-06): reads a bundle
# {root, policy, tree, evidence}, runs `CallTreeDeploy.deployedVerify` (= `CallTreeCore.verify` at
# the deployed BLAKE3 hash and hop predicate; `CallTree.verify_sound` / `no_omission` /
# `verify_attested` are about it), prints the verdict, exits 0/1 (2 = bad input). Lean core only.
# NOT a default target.
#
#     lake build calltree-check
#     ./.lake/build/bin/calltree-check ../calltree/fixtures/tree.bundle.json
[[lean_lib]]
name = "CallTreeGuards"
globs = ["Dregg2.Lightclient.CallTree", "Dregg2.Lightclient.CallTreeDeploy"]

[[lean_exe]]
name = "calltree-check"
root = "CallTreeCheck"
