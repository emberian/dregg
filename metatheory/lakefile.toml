  # unnoticed; the live number is `DeckDescent.family_shape_is_measured`.)
  "Dregg2.Games.PathOfAngels.DeckDescent",
  # ⚑ 2026-08-06 (descent lane) — the descent WIRE. `DeckDescentEmit` carries the 5
