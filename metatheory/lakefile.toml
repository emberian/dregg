  "Dregg2.Games.PathOfAngels.ArtificerLogic",
  "Dregg2.Games.PathOfAngels.ArtificerLogicEmit",
  "Dregg2.Games.PathOfAngels.ArtificerLogicEmitMain",
  # ⚑ 2026-08-06 (vent-crawl lane) — the push-your-luck kernel and its wire.
