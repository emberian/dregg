  # by 07:15) and orphaned on arrival — the same shape as `PastaFieldSound`/`PastaAddSubSound`,
  # where a repair's own pins went into no CI target because the module was new. 38
  # `#assert_axioms` + 11 `#assert_compiled` between them; both GREEN and cheap (2 s / 3 s).
