[package]
name = "grain-turn"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "The R2 kernel-turn weld (THE-GRAIN.md face #1): the REAL GrainTurnMinter — it drives every admitted dregg-agent action through a genuine dregg_sdk::ToolGateway::invoke on a real dregg_cell::Cell grain turn-cell, so the agent's receipts become VIEWS over committed kernel turns and the executor's own calls_made caveat enforces the meter host-side. The heavyweight kernel-facing half kept OUT of the std-only dregg-agent crate."

[lib]
name = "grain_turn"
path = "src/lib.rs"

[dependencies]
# The std-only agent runtime + the GrainTurnMinter seam we implement.
dregg-agent = { path = "../dregg-agent" }
# The verified executor + the proven ToolGateway (delegAdmit mandate: the
# calls_made FieldLte/Monotonic caveat is the host-side meter).
dregg-sdk = { path = "../sdk" }
# The grain turn-cell's field-slot helpers (field_from_u64) + Effect/CellId types.
dregg-cell = { path = "../cell" }
# The action commit witnessed at ACTION_SLOT (same crypto tier dregg-agent uses).
blake3 = "1"
# The CONSUMER half of the R2 weld lives in the DreggNet repo (cross-repo sibling).
# OPTIONAL + feature-gated so breadstuffs builds STANDALONE — CI-green without a
# ~/dev/DreggNet checkout beside it. Enable the end-to-end R2 integration test with
# `--features grain-integration` (requires the DreggNet sibling present).
# NOTE (architecture): this is an INVERTED dep — the core (breadstuffs) reaching up
# into the operated layer (DreggNet). The proper fix is to move grain-verify's core
# types into breadstuffs; tracked in docs/GRAIN-VERIFY-HOME.md (coordinate w/ the
# DreggNet lane before moving).
grain-verify = { path = "../../DreggNet/grain-verify", optional = true }

[features]
# Off by default: keeps grain-turn + the whole breadstuffs workspace self-contained.
# On: pulls the DreggNet-side grain-verify for the cross-repo R2 end-to-end test.
grain-integration = ["dep:grain-verify"]
