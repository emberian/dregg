[package]
name = "dregg-node"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Federation node daemon — hosts an agent cipherclerk, participates in consensus, and serves a localhost API"

[dependencies]
dregg-types = { path = "../types" }
# The async prover's dedicated pool (`prove_pool.rs`, `DREGG_PROVE_THREADS`).
rayon = "1"
dregg-cell = { path = "../cell" }
dregg-cell-crypto = { path = "../cell-crypto" }
# Lean is UNCONDITIONAL on native (polarity-inverted, .docs-history-noclaude/FEATURE-HYGIENE.md §Lean): the
# shadow/gate executor, the F-4 admission gate, verified settle, and the captp/coord gates are
# all compiled in by default — no per-crate enables needed here anymore.
dregg-turn = { path = "../turn" }
# The γ.2 bilateral AGGREGATE prover/verifier (`api.rs`, `mcp/handlers_act.rs`,
# `blocklace_sync.rs`) moved out of `dregg-turn`'s `prover` feature into its own
# always-compiled crate. The node calls it UNCONDITIONALLY, so this is a plain
# dependency — the same honesty `dregg-circuit-prove` below already has.
dregg-turn-prover = { path = "../turn-prover" }
# The verified-Lean executor cluster (the shadow differential + strict-veto gate + the
# authoritative `produce_via_lean` state producer). This native crate links `libdregg_lean.a`;
# the node injects its `LeanShadowObserver` into every executor and calls `produce_via_lean` for
# producer mode. (`dregg-turn` itself is now FFI-free — the link comes through here.)
dregg-exec-lean = { path = "../exec-lean" }
# The verified FINALITY GATE (`finality_gate.rs`) calls the Lean-exported `dregg_blocklace_finalize`
# directly.
dregg-lean-ffi = { path = "../dregg-lean-ffi" }
# dregg-pq: the ML-DSA-65 (FIPS 204) verify seam. dregg-pq is a light leaf that routes its
# security-critical verify through an install-time function pointer; the node — which CAN link the
# Lean archive via dregg-lean-ffi — installs the extracted, Lean-verified real verify core at startup
# (`install_lean_verify_core_real`), taking the `fips204` crate OUT of the node's verify TCB. A direct
# dep so the node can call the install; dregg-pq is already in the graph transitively.
dregg-pq = { path = "../dregg-pq" }
dregg-token = { path = "../token", default-features = false, features = ["macaroon", "biscuit", "rand-deps"] }
dregg-persist = { path = "../persist" }
dregg-governance = { path = "../dregg-governance" }
poa-solana-gate = { path = "../poa-solana-gate" }
poa-curator = { path = "../poa-curator" }
dregg-federation = { path = "../federation" }
dregg-sdk = { path = "../sdk" }
dregg-sdk-net = { path = "../dregg-sdk-net" }
dregg-intent = { path = "../intent" }
# The attested-query index (dregg-query): the receipt-log MMR (non-omission
# certificate) + the typed EffectSummary EDB. The node maintains the MMR over
# its receipt chain and serves `/api/receipts/index/{root,range}`; this leaf
# crate is HTTP-free and pulls only serde + blake3 (already in the graph).
dregg-query = { path = "../dregg-query" }
dregg-circuit = { path = "../circuit" }
# The recursion prove/verify surface for REAL IVC history compression: the commit path retains a
# wrap-input `FinalizedTurn` per proven turn (turn_proving.rs), and the MCP `dregg_compress_history`
# tool folds those retained turns through `ivc_turn_chain::prove_turn_chain_recursive` and verifies
# the byte envelope (`verify_whole_chain_proof_bytes`). Already in the node graph transitively via
# `dregg-turn/prover`; named directly so the node can hold the fold's types.
dregg-circuit-prove = { path = "../circuit-prove" }
# ⚑ THE VERIFY-ONLY RECURSION CRATE — the edge that gives this node the ability to check a
# recursion ROOT. `dregg-turn` deliberately does not take it (`turn/Cargo.toml`) and therefore
# REFUSES every Mina anchored head; `mina_chain_root_backend.rs` injects the capability here.
# Named directly rather than reached through `dregg-circuit-prove` on purpose: the boundary the
# operator asked for is "which crates take the edge", and an edge you can see in `cargo tree` is
# a boundary, while a cargo feature is a hidden one. This is also the crate a prover-free
# consumer (the wasm card, a future seL4 verifier PD) would take INSTEAD of `circuit-prove`.
dregg-recursion-verify = { path = "../recursion-verify" }
dregg-commit = { path = "../commit" }
# The realm/instance/identity/catalog MUD substrate (realm-model, §9.4/§9.5/§9.2).
# The node HOSTS a durable `RealmWorld` via `realm_service`: realm-turn admission
# routes through realm-model's gate, and realm state is durable across a restart
# on the keystone receipt/turn-chain discipline (persist REALM_LOG replay).
realm-model = { path = "../realm-model" }
dregg-dsl-runtime = { path = "../dregg-dsl-runtime" }
dregg-coord = { path = "../coord" }
dregg-net = { path = "../net" }
dregg-blocklace = { path = "../blocklace" }
dregg-storage = { path = "../storage" }
dregg-storage-templates = { path = "../dregg-storage-templates" }
dregg-captp = { path = "../captp" }
dregg-app-framework = { path = "../app-framework" }
dregg-credentials = { path = "../credentials" }
# The dregg-pay treasury MIRROR for slash remainders (slash_treasury_mirror.rs): when a
# realized slash Transfers the seizure remainder to the treasury cell, the operator's
# dregg-pay Treasury records the SAME amount via deposit_dregg — an audit view of the one
# conserving Transfer, not a second creation of value. dregg-pay is a leaf over
# dregg-bridge; no cycle back into the node.
dregg-pay = { path = "../dregg-pay" }
# The gpui-free reflective substrate (deos-reflect): `reflect_cell` over any
# `Ledger`. The node uses the SAME reflector deos-js's crawl calls to surface its
# OWN runtime state AS A CELL (`self_cell.rs` — the reflexive-image Hearth step).
# This is the lean, starbridge-free, SpiderMonkey-free crate the design factors
# out (deos-js depends on it; the node does too — neither pulls the other).
deos-reflect = { path = "../deos-reflect" }
# THE DEOS-HOST (optional, `deos-host` feature): the node hosts a headless userspace
# deos-js "private server" program. deos-js links SpiderMonkey (mozjs), so it is OFF by
# default — a bare `cargo build -p dregg-node` stays mozjs-free (deos-js is a workspace
# member but NOT a default-member; nothing in the default node graph references it).
deos-js = { path = "../deos-js", optional = true }
starbridge-nameservice = { path = "../starbridge-apps/nameservice" }
starbridge-identity = { path = "../starbridge-apps/identity" }
starbridge-subscription = { path = "../starbridge-apps/subscription" }
starbridge-governed-namespace = { path = "../starbridge-apps/governed-namespace" }
starbridge-compartment-workflow-mandate = { path = "../starbridge-apps/compartment-workflow-mandate" }
starbridge-storage-gateway-mandate = { path = "../starbridge-apps/storage-gateway-mandate" }
starbridge-privacy-voting = { path = "../starbridge-apps/privacy-voting" }
starbridge-bounty-board = { path = "../starbridge-apps/bounty-board" }
# The execution-lease app: the devnet demo-lease seed (DREGG_SEED_DEMO_LEASE=1
# with --enable-faucet) opens a program-bearing, funded lease cell at boot so an
# external provider (the operated DreggNet plane) can decode + fulfill a REAL
# lease off this node's HTTP surface — the loop's mint, which no HTTP endpoint
# can perform (program install is not a wire effect).
starbridge-execution-lease = { path = "../starbridge-apps/execution-lease" }
# The pg-dregg MIRROR core (pg-dregg/src/mirror.rs): MirrorBatch / CellRow / TurnRow /
# CapRow / MemCell / RootChain. pg-dregg is a STANDALONE workspace whose DEFAULT feature
# set is EMPTY (no pgrx, no postgres) — this path dep links ONLY its `lib` (the mirror's
# row types + the anti-substitution RootChain), staying circuit- and postgres-free. The
# node's pg_mirror sink owns the `dregg_cell::Cell -> CellRow` decode (this crate cannot
# see dregg-cell by design) and calls MirrorBatch::from_parts + RootChain to ship verified
# turns. (.docs-history-noclaude/PG-DREGG.md §8; node/src/pg_mirror.rs.)
pg-dregg = { path = "../pg-dregg", default-features = false }
# THE ENCRYPTED CALL AUCTION (`dark_clearing_service.rs`). Unconditional, not a feature: the
# wound this closes is "no real crypto touches a user surface," and a default-off feature would
# leave the shipped node exactly as it was. This pulls fhegg-fhe's DEFAULT surface only — the
# threshold/quorum BFV DKG, the authenticated encrypted order ingress, the carry-free additive
# fold, the masked boundary, the PartyMPC crossing, and the clearing attestation. It does NOT
# enable `tfhe-integer` (no tfhe-rs in the node graph) and does NOT enable `amm-input-binding`
# (no extra proof tower). `fhe`/`fhe-traits` are named directly so the node can parse and publish
# the collective public key a trader encrypts against.
fhegg-fhe = { path = "../fhegg-fhe" }
fhe = "0.1.1"
fhe-traits = "0.1.1"
# `rand` 0.8 is the RNG trait `fhegg-fhe`'s PartyMPC ingress and preprocessing are written
# against (`rand::Rng`); the node feeds them `OsRng`, never a seeded RNG.
rand = "0.8"
dregg-macaroon = { workspace = true, features = ["crypto"] }
ark-serialize = { workspace = true }
ark-std = "0.5.0"

tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
# `raw_value` so the PoA Records read can splice native Lean's exact emitted
# document into its response instead of re-serializing it through `Value`, which
# would reorder keys and stop the served bytes from being Lean's bytes. Std-only
# feature; it adds no crate to the graph.
serde_json = { version = "1", features = ["raw_value"] }
clap = { version = "4", features = ["derive"] }
# Pulled only by the `deos-host` feature (the playable `mud-client` reads world cells off
# the node over HTTP via `GET /api/cell/{id}`). Already in the graph via `dregg-sdk-net`, so
# this adds no new crate — just names it directly for the deos-host module.
reqwest = { version = "0.12", features = ["json"] }
# Pulled only by the `deos-host` feature: the `mud_client` / `shared_world` boot harnesses
# stand up an in-process node on a temp dir. These are non-`cfg(test)` modules (the playable
# REPL + the shared-world engine), so the temp-dir crate must be a normal dep under the
# feature, not a bare dev-dependency (a dev-dep is absent in the plain `--bin` build).
tempfile = { version = "3", optional = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
getrandom = { workspace = true }
uuid = { version = "1", features = ["v4"] }
ed25519-dalek = { version = "2", features = ["std"] }
quinn = { version = "0.11", features = ["runtime-tokio", "rustls-ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
blake3 = "1"
sha2 = { workspace = true }
argon2 = "0.5"
subtle = { workspace = true }
base64 = { workspace = true }
postcard = { version = "1", features = ["use-std"] }
zeroize = { workspace = true }
x25519-dalek = { workspace = true }
chacha20poly1305 = { workspace = true }
metrics = "0.24"
metrics-exporter-prometheus = "0.16"
hex = "0.4"
# The LIVE postgres client for the pg-mirror sink — OPTIONAL, pulled only by the
# `pg-mirror-live` feature. The mirror's load-bearing half (MirrorBatch construction
# from CommitRecords + the RootChain anti-substitution gate) is feature-INDEPENDENT and
# always compiled/tested; only the network shipping to a live pg18 needs this client. The
# node runs unchanged with the feature off (and even on, the sink is opt-in via
# DREGG_PG_MIRROR_URL). `with-serde_json-1` makes a `serde_json::Value` bind as the
# postgres `jsonb` type (the cell's fields_json column), so the kernel writer sends
# real jsonb, not a text-cast string. (node/src/pg_mirror.rs.)
tokio-postgres = { version = "0.7", optional = true, features = ["with-serde_json-1"] }

[features]
# ⚑ `prover` IS DELETED (2026-07-28), and the measurement that retired it is stronger than the
# one recorded here before. It forwarded nothing (`prover = []`): `cargo build -p dregg-node
# --all-targets --unit-graph` resolves to the SAME 718 units under `--features prover` and
# `--no-default-features`, differing only in the feature string on dregg-node's own units.
#
# It was node's OWN gate over 19 local `#[cfg]` sites, and BOTH positions were dead:
#   * 4 POSITIVE sites gated the `exact_fnsp_v3_*` module declarations in `src/lib.rs`. But
#     `blocklace_sync.rs` names `crate::exact_fnsp_v3_{activation,actor_authority,
#     execution_authority,finalization}` at ~20 call sites with NO cfg, so `--no-default-features`
#     DID NOT COMPILE — it was not merely unexercised, it was impossible. Those modules are now
#     unconditional, which is what every build that has ever existed already had.
#   * 14 NEGATIVE (`not(prover)`) sites in `src/mcp/mod.rs` were therefore compiled by NO
#     configuration at all — 10 tests + 4 helper fns. (The "15" the previous comment recorded
#     counted a COMMENT line mentioning `not(feature = "prover")`; there were only ever 14
#     attributes, so this manifest overcounted its own wound by one.) They are DELETED with the
#     v1 lane they described, except one — see the tombstone in `src/mcp/mod.rs`. Nine of the ten
#     assert that the standalone v1 `EffectVmAir` attestation COMMITS, and
#     `try_generate_effect_vm_proof` returns `Err` unconditionally (no cfg), so they could not
#     pass in any configuration; un-gated and RUN, all nine failed. The tenth — the pin that
#     guards the retirement — is now unconditional, and it failed too, on `contains("retired")`
#     against a message that says `is RETIRED`. It is repaired in place.
#
# WHAT BROKE: nothing named this feature. `dreggnet-tavern` is the only consumer of dregg-node and
# takes `features = ["deos-host"]` + defaults. `dregg-tests/prover` and `dregg-perf/prover` were
# retired in the same commit. `scripts/feature-tiers.tsv` loses SIX rows, not three: dropping the
# `default = [...]` key makes cargo stop synthesising a `default` feature at all, so
# `{dregg-node,dregg-perf,dregg-tests}:{default,prover}` all cease to exist (231 → 225 rows).
# `dregg-verifier` leaves node's dev-deps with the tests that were its only consumers.

# THE DEOS-HOST: the node hosts a headless userspace deos-js "private server" program
# (`--deos-program <path.js>`), running fully without gpui. Pulls in `mozjs` via deos-js,
# so it is opt-in (NOT in `default`). With it OFF, the deos-host module is absent and the
# node graph carries no SpiderMonkey.
deos-host = ["dep:deos-js", "dep:tempfile"]

# Off by default: the node ships verified-turn MirrorBatches to a live pg18 ONLY when
# this is on AND DREGG_PG_MIRROR_URL is set. With it off, the pg-mirror module still
# compiles its construction + RootChain core and its in-memory sink (the tested,
# load-bearing path); the live postgres writer is simply absent.
pg-mirror-live = ["dep:tokio-postgres"]

# Dev-deps for future router-level adversarial tests (Stage 0c followup once
# dregg-turn/dregg-cell rebuild lands from Stages 0a/0b). Currently the
# unit-style tests in api.rs / relay_service.rs do not need them, but keeping
# them declared keeps the followup PR trivial.
[dev-dependencies]
# The integration exhibits drive the REAL axum router (`api::router`), which takes a
# `PrometheusHandle`. Regular deps are visible to integration targets, but the recorder
# BUILDER is only used by tests, so it is declared here too rather than left implicit.
metrics-exporter-prometheus = "0.16"
tower = { version = "0.5", features = ["util"] }
tempfile = "3"
# Exposes only explicitly named corruption/legacy-atomicity fixture helpers;
# production builds retain the closed PoA preparation/finalization boundary.
dregg-persist = { path = "../persist", features = ["test-support"] }
# `tests/mldsa_live_verify.rs` generates a GENUINE ML-DSA-65 keypair + signature with the crate and
# proves the node's installed Lean verify core (BRICK 8) is the accept/reject authority routing them —
# same fips204 0.4.x the `dregg-pq` leaf carries, so the sig bytes are byte-identical to production.
fips204 = "0.4"
# `tests/mlkem_live_decaps.rs` generates a GENUINE ML-KEM-768 keypair + encapsulation with the crate and
# proves the node's installed Lean decaps core (BRICK K6) recovers the SAME shared secret and is the
# authority behind `HybridResponder::finish` — same ml-kem 0.2.3 the `dregg-pq` leaf carries, so the
# dk/ct bytes are byte-identical to production.
ml-kem = "0.2.3"
# `rand_core::OsRng` (the getrandom-backed CSPRNG) for the ml-kem keygen/encaps in `mlkem_live_decaps.rs`
# — the same rand_core 0.6 `CryptoRngCore` ml-kem / x25519-dalek consume in production.
rand_core = { version = "0.6", features = ["getrandom"] }
http-body-util = "0.1"
x25519-dalek = { workspace = true }
postcard = { version = "1", features = ["use-std"] }
# ⚑ `dregg-verifier` REMOVED 2026-07-28. Its only consumers in this crate were the
# `not(feature = "prover")` cross-fed helpers and the two `silver_captp_*` tests deleted with
# the v1-floor lane (`src/mcp/mod.rs`); `grep -r dregg_verifier node/` is now zero. A dev-dep
# with no consumer is a dependency edge that reads as coverage and is not.
# `dregg-lean-ffi` is now a regular dependency above (the verified finality gate calls it from
# production code); tests that need it (`lean_producer_mode.rs`, the finality-gate differential)
# inherit it from there — no separate dev-dependency entry required.

[lib]
name = "dregg_node"
path = "src/lib.rs"

[[bin]]
name = "dregg-node"
path = "src/main.rs"

# `dist` opt-in (release management; see root Cargo.toml [workspace.metadata.dist]).
# The workspace default is `dist = false`; this ships the `dregg-node` daemon.
#
# TARGETS ARE NARROWED to the two x86_64 host-native targets. `dregg-node` links
# the verified Lean archive (libdregg_lean.a) UNCONDITIONALLY on native (via
# dregg-turn → dregg-lean-ffi), and that archive is host-native objects produced
# by the Lean compiler — it CANNOT be cross-compiled. dist builds each target on
# a native runner, so x86_64 macOS + Linux are buildable WHERE THE RUNNER ALSO
# HAS THE LEAN TOOLCHAIN (elan/lake + warm mathlib) for build.rs to splice the
# archive. aarch64 (no historical native runner + no aarch64 Lean archive build
# here) and Windows (Lean link unproven) are BLOCKED for node; the CLI carries
# those platforms instead.
[package.metadata.dist]
dist = true
targets = ["x86_64-apple-darwin", "x86_64-unknown-linux-gnu"]

[lints]
workspace = true
