name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Manually re-runnable. Also the escape hatch for a real gap: a workflow that pushes with
  # the default GITHUB_TOKEN (e.g. lean-seed.yml's `pin` job writing lean-seed.pin) does NOT
  # re-trigger workflows — GitHub suppresses it to prevent loops. So the CI-authored pin commit
  # that ARMS the Lean marshal gate cannot, by itself, trigger the CI run that would arm it.
  # `workflow_dispatch` lets that arming run be kicked without waiting for the next human push.
  workflow_dispatch:
  # ⚑ THE SLOW LANE (2026-07-29). Four jobs here cost 107-330 MINUTES and are now guarded by
  # `if: github.event_name != 'push'`, so they run on this schedule, on a PR, or on demand —
  # never on a push to main. That is a CADENCE change, not a coverage cut, and the number that
  # forces it is not a bill: main's median inter-commit gap is 92 SECONDS. A 330-minute job on a
  # 92-second cadence has ~215 copies of itself in flight at steady state; `main` is deliberately
  # NOT `cancel-in-progress`, so they queue rather than supersede, and none of them ever reaches a
  # verdict. Measured over the last 60 runs of this workflow: ZERO succeeded.
  #
  # `metatheory-pq-apex`'s own comment block argues AGAINST a schedule — "a nightly lane detects a
  # regression up to 24h late... This job is a CHECK on every run's checks page instead, so its
  # verdict arrives with the commit that caused it." That argument is right in form and its premise
  # is false in fact: the verdict does not arrive with the commit, or at all. Measured 2026-07-28
  # across five consecutive runs, 29 of 30 jobs in this workflow died inside 90 seconds at
  # `actions/checkout` on an exhausted LFS budget. A nightly verdict a human reads beats a
  # per-push verdict that is structurally unreachable. If that premise changes — if this workflow
  # starts finishing — reconsider the guard rather than leaving it because it is here.
  schedule:
    - cron: '0 6 * * *'

# Explicit least-privilege. The repo default is ALREADY `read`
# (`gh api repos/emberian/dregg/actions/permissions/workflow`), so this is
# defense-in-depth, not a hole being closed: every job here runs `cargo build`/
# `cargo test`, i.e. executes the PR-under-test's `build.rs`, so if the repo
# default is ever flipped to read/write this lane must not inherit it.
permissions:
  contents: read

# Cancel superseded PR runs: once a new push lands on a PR, the older run's verdict
# is about code nobody will merge. Each run here is a FULL workspace compile on two
# OSes, so this is the single biggest CI-minute saving available.
# main is deliberately NOT cancelled: a per-commit verdict is what tells you WHICH
# commit broke it, and this repo's main takes rapid pushes from several terminals.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

# ══════════════════════════════════════════════════════════════════════════════════════════
# ⚑ THE LFS BLOCK — the repo's ONLY real Actions bill, and what was killing every job here.
#
# THIS REPOSITORY IS PUBLIC. GitHub Actions minutes on standard hosted runners are FREE for
# public repositories, and this is measured, not assumed: `gh api .../actions/runs/<id>/timing`
# returns `billable.UBUNTU.total_ms = 0` for all 29 ubuntu jobs and `MACOS.total_ms = 0` for the
# macOS leg, on every run sampled. A minute spent here costs nothing. Wall-clock is a LATENCY
# budget and a signal-to-noise budget; it is not an invoice.
#
# GIT LFS IS BILLED REGARDLESS OF VISIBILITY, and it is EXHAUSTED. From the checkout log of
# every job in run 30398984470:
#
#     batch response: This repository exceeded its LFS budget. The account responsible for the
#     budget should increase it to restore access.
#     ##[error]error: failed to fetch some objects from '.../dregg.git/info/lfs'
#
# WHAT THAT COST, and it is not what the standing story says. This was not one dead nightly
# workflow. Measured across five consecutive runs of THIS file (30406814498, 30398984470,
# 30389054636, 30385967614, 30379515052): **29 of 30 jobs died inside 90 seconds**, at
# `actions/checkout`, before running a single step. The one survivor each time was
# `mina-attestation` — the only job in the file whose checkout had no `lfs: true`. So every
# `failure` this workflow reported was a checkout failure wearing a gate's name, and the "0 of
# 60 runs green" number was measuring the LFS allowance, not the tree.
#
# THE ARITHMETIC. `.gitattributes` puts exactly seven files in LFS —
# `circuit/descriptors/*staged*.tsv`, 22.5 MB in total. `actions/checkout` with `lfs: true`
# pulls all of them, per job, per run. This file alone carried 24 such checkouts (29 after
# matrix expansion), i.e. ~650 MB of LFS bandwidth PER PUSH, against a 1 GB/month free
# allowance — one push burning most of a month.
#
# WHAT WAS DONE HERE: `lfs: true` now appears only on jobs that COMPILE a crate in the
# `dregg-circuit` reverse-dependency cone, plus `descriptor-drift` which regenerates those TSVs
# and diffs them. The cone was computed from `cargo metadata --no-deps` (184 of 225 workspace
# members reach `dregg-circuit`); the files are `include_str!`d at
# `circuit/src/effect_vm_descriptors.rs:833,851,903,1198,1219,1275`, so a pointer file instead
# of the real bytes fails LOUDLY there — each has a committed `*_FP` sha256 beside it — rather
# than passing vacuously. Eight jobs keep it; seven had it removed with the reason stated at the
# site. Per-push LFS from this file: 29 checkouts -> 12 (8 job keys; `excluded-workspaces`
# expands to 5 legs and `test` to 2, and `descriptor-drift` — the 9th key that keeps it —
# is guarded off the push path entirely).
#
# ⚠ NECESSARY, NOT SUFFICIENT — SAY SO PLAINLY. Twelve checkouts is still ~270 MB per push, and
# at a 92-second commit cadence ANY per-push LFS pull exhausts a 1 GB monthly allowance in a few
# hours. Pruning workflows cannot fix this; it only slows the burn. The fix that actually works
# is to take those seven TSVs OUT of LFS — 22.5 MB of regenerated, line-oriented text that gains
# nothing from LFS and would be unremarkable as ordinary git blobs. That is deliberately NOT
# done here: it edits `circuit/`, and it changes the storage shape of a public repository.
# ember's call.
# ══════════════════════════════════════════════════════════════════════════════════════════

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          lfs: true
      - run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev libfontconfig1-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libxcb1-dev libgl1-mesa-dev libegl-dev libgles-dev libharfbuzz-dev libfreetype-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libx11-dev libxext-dev libxrandr-dev libxi-dev libxcursor-dev libxinerama-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev gperf libunwind-dev
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: nightly-2026-06-21
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # `--keep-going` (2026-07-25): without it cargo stops scheduling new units at
      # the first failure ("warning: build failed, waiting for other jobs to
      # finish...") and the log ends there. So this step reported ONE broken crate
      # per run out of ~196, and the next push's log showed the next one — which is
      # how a whole directory of rotted examples stayed covered-but-unseen, and how
      # a genuinely NEW break was indistinguishable from the standing red. One flag,
      # no new job, no coverage change: every independent failure now surfaces in
      # the SAME run, and the step still exits non-zero. It is the same reason
      # `clippy-correctness` below already passes `--keep-going`, and it is spelled
      # out in `.github/dark-targets.txt`'s header ("a plain --all-targets run
      # ABORTS at the first broken target and shows you nothing past it").
      # ⚠ NOT sufficient on its own, for the reason that header also gives: a red
      # LIBRARY still prunes its whole downstream cone, so a count taken while any
      # lib is red is a LOWER BOUND. Fix libs first, re-read.
      - run: cargo check --workspace --all-targets --keep-going
      # FEATURE-MATRIX GATES (2026-07-16, Lane 2 config-space audit): `dregg-chain`
      # has NO default features, so the workspace check above compiles NEITHER of
      # its real configurations. Before this gate, the `mock` config's tests had
      # never been compiled by any automated step, and the `on-chain` config (the
      # REAL alloy contract-call verifier) had never been compiled ANYWHERE — a
      # type error in `real_verify_on_chain` was invisible. Both are cheap:
      # mock adds no deps; alloy is already in the lockfile.
      - run: cargo test -p dregg-chain --features mock
      - run: cargo check -p dregg-chain --features on-chain
      # starbridge-polis default features are EMPTY (the pure cell-program library),
      # so `cargo test --workspace` compiles NEITHER the deos surface (src/deos.rs)
      # NOR the AX3 service (src/service.rs) / AX5 reactor (src/reactor.rs) — all three
      # ride a `#[path]`-into-test-binaries dance gated on the `deos` feature to dodge a
      # package-graph cycle (see the crate's [features] note). Their tests
      # (tests/{deos_seam,service,reactor,reexpress_deos_app}.rs) were built by nothing.
      # The feature adds NO new dep to the graph (it only flips the test #[cfg]s; the
      # app-framework/turn/sdk it pulls are dev-deps already built by --workspace), so
      # this reuses the warm target dir above. Mirrors the dregg-chain matrix directly.
      - run: cargo test -p starbridge-polis --features deos
      # dregg-doc has NO `default` key in [features], so — exactly like dregg-chain
      # above — `cargo test --workspace` compiles it FEATURELESS: its 3 ungated test
      # files run, and the 35 tests behind `substrate` compile NOWHERE. That population
      # is the economic-safety surface: tests/staked_bond_slash.rs (a conviction slashes
      # exactly the bond, conservingly; a second slash is refused one-shot; the slash
      # conserves the total across all parties), tests/conviction_unforgeable.rs (the
      # unforgeability gate — Conviction's fields are private and ConvictionEvidence is
      # #[non_exhaustive], so a SlashOutcome can only come from a genuine
      # CiAssurance::evaluate detection), tests/nullifier_root_federation.rs,
      # tests/literate_executor_weld.rs, plus 22 in-src unit tests (pull_request.rs
      # mod landing/required_checks/ci_run_checks, review.rs mod thread).
      # CHEAP: every dep the feature turns on (dregg-turn, dregg-commit, dregg-circuit,
      # dregg-blocklace, ed25519-dalek, serde) is an in-workspace path dep the
      # --workspace lane already builds. No prover, no network, no service.
      # ⚠ NOT compile-verified locally when landed (the local cargo target lock was held
      # by a co-tenant build); the evidence is manifest+source read, same basis as the
      # dregg-chain matrix. If this reds on a compile error, that IS the finding — a test
      # population that had never been built. Fix the drift; do not delete the step.
      - run: cargo test -p dregg-doc --features substrate
      # ⚑ THE SHIPPED SUBMITTER, ARMED (2026-08-08 — one of the eight rows the execution sweep
      # was carrying unlisted). `dreggnet-catalog`'s `private_bazaar_submit_binary` spawns the
      # REAL `dregg-private-bazaar-submit` executable over a real pipe and checks what it left
      # behind: exit codes, no secret in the operator's scrollback, and a durably chained record
      # whose reopen re-validates schema, checksum, scope, sequence, predecessor link, the
      # proved-family type gate and the roster. It exists because
      # `PrivateBazaarSealedIngressQueue::submit` documented itself "THE PRODUCTION INGRESS"
      # while having 0 production callers and 11 test callers (measured 2026-07-28) — and the
      # test that closes that had itself never run.
      #
      # WHY THIS IS AN ARM AND NOT A `never-run ` ROW, decided per target rather than by class:
      # its three `private-bazaar-live` SIBLINGS are allowlisted with "needs a pinned
      # roster/reward/executor policy + a durable authority directory", and that reason is FALSE
      # for this one — read the file: it SYNTHESIZES the whole deployment (a fixed 3-member
      # `GuildRoster`, a fixed `GuildReward`, both commitments derived the way the deployment
      # derives them, a `tempfile` authority dir) and never opens a signing seed. No network, no
      # daemon, no key, no prover — its own header says "transport wiring only, and it mints no
      # proof at all". Copying the siblings' sentence onto it would have been the bulk-add.
      # COST is measured, not guessed: `dreggnet-catalog:private-bazaar-live` is a T3 pair in
      # scripts/feature-tiers.tsv and is NOT in feature-t3-known-red.tsv, so the nightly sweep
      # already compiles it clean; the T3 sweep's own measurement is a ~20s mean per pair. What
      # was missing was EXECUTION, which T3 explicitly does not provide.
      # `--test` SCOPE IS DELIBERATE: a bare `-p dreggnet-catalog --features private-bazaar-live`
      # would also run `private_bazaar_production_relation`, whose `never-run ` row IS accurate
      # (it wants real deployment config) — arming it by accident is how an allowlist row goes
      # stale and a job goes red for a reason nobody chose.
      # The bin is built by cargo because the test names it with
      # `env!("CARGO_BIN_EXE_dregg-private-bazaar-submit")`.
      # ⚠ NOT verified green locally when landed (the shared cargo target lock was held by a
      # co-tenant build) — same basis as the `dregg-doc --features substrate` row above. If this
      # reds, THAT IS THE FINDING: a shipped ingress whose only caller was a test that no job
      # ran. Fix the drift; do not delete the step.
      - run: cargo test -p dreggnet-catalog --features private-bazaar-live --test private_bazaar_submit_binary

  # solana-lock is a DELIBERATE standalone workspace (keeps the Solana/SBF dep
  # tree out of the main one — see solana-lock/Cargo.toml). That isolation also
  # kept its lock/unlock/escrow BanksClient integration tests out of every CI
  # job: they only ran when someone invoked them locally. This job closes that
  # hole; the program tests run natively (solana-program-test, no validator).
  solana-lock:
    name: solana-lock (standalone workspace)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        # NO `lfs: true` (2026-07-29): this job never reads circuit/descriptors/*staged*.tsv.
        # solana-lock/Cargo.toml declares NO path dependency — it is a sealed workspace.
        # The LFS allowance is the repo's only real Actions bill and it is EXHAUSTED; a job
        # that pulls 22.5 MB it never opens is pure bill. See the LFS block at the top.
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: nightly-2026-06-21
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: solana-lock
      - run: cargo test
        working-directory: solana-lock

  # solana-settlement is the SAME standalone-workspace class as solana-lock, and
  # it had the SAME hole: its settle_flow.rs integration test — the both-polarity
  # gate that VERIFIES the real dregg Groth16 apex proof on-chain via alt_bn128
  # (the identical ark-bn254 arithmetic the sol_alt_bn128_* syscalls use) and
  # REJECTS a forged proof — ran in no CI job. The prior exclude-list note claimed
  # this workspace "needs the SBF toolchain"; that conflated DEPLOYMENT (cargo
  # build-sbf) with TESTING. The tests use solana-program-test's native BanksClient
  # (no validator, no SBF, no build-sbf), exactly like solana-lock — verified green
  # locally: 11 unit + 2 settle_flow integration tests, ~2s. This closes the hole
  # the note itself flagged as "a candidate for a solana-lock-style job later".
  solana-settlement:
    name: solana-settlement (standalone workspace)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        # NO `lfs: true` (2026-07-29): this job never reads circuit/descriptors/*staged*.tsv.
        # solana-settlement/Cargo.toml declares NO path dependency — sealed workspace.
        # The LFS allowance is the repo's only real Actions bill and it is EXHAUSTED; a job
        # that pulls 22.5 MB it never opens is pure bill. See the LFS block at the top.
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: nightly-2026-06-21
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: solana-settlement
      - run: cargo test --locked
        working-directory: solana-settlement

  # wasm/ is a DELIBERATE standalone workspace, for reasons that are still good:
  # its `[patch]` path-points plonky3-recursion at a sibling checkout, and it
  # force-enables wasm32-only features (getrandom's `wasm_js`, the `no-lean-link`
  # platform gate) that feature-unification would push onto every native crate if
  # it were folded into the root workspace. So it stays standalone — and the
  # SAME isolation that protects the root workspace kept wasm out of every CI
  # job: nothing built it, so nothing could tell you it had rotted.
  #
  # It had. `wasm-bindgen-test` was a stray key inside `[dependencies.web-sys]`'s
  # spec with no `[dev-dependencies]` section at all, so the crate's ~78 tests
  # were UNBUILDABLE — invisible, because no CI job ever compiled them. That
  # manifest bug is fixed; THIS JOB is what keeps it fixed. Mirrors the
  # `solana-lock` job above, which exists for the identical reason.
  #
  # ⚠ THE SIBLING CHECKOUT IS NOT OPTIONAL. `wasm/Cargo.toml`'s `[patch]`
  # path-points `../../plonky3-recursion` (cargo forbids re-pointing a git source
  # to a different rev of the same URL, so the override must be a path patch).
  # Without the clone, cargo cannot even RESOLVE this workspace — the job fails
  # before it compiles a line. REV is the pushed `update-plonky3-rev` tip and is
  # kept in lockstep with wasm/Cargo.toml's comment, pages.yml, extension.yml,
  # and publish-sdk-ts.yml — they must be the SAME circuit or the VK forks.
  wasm:
    name: wasm (standalone workspace)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          lfs: true   # include_str!'d staged registries live in LFS (.gitattributes)
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: nightly-2026-06-21
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: wasm
      - name: Fetch the plonky3-recursion fork as a sibling (wasm/ patch target)
        run: |
          set -euo pipefail
          REV=fc3c6dfac26e2082653d2a617a1740446ce33f05
          if [ ! -d ../plonky3-recursion/.git ]; then
            git clone --no-checkout https://github.com/emberian/plonky3-recursion ../plonky3-recursion
            git -C ../plonky3-recursion fetch --depth 1 origin "$REV"
            git -C ../plonky3-recursion checkout "$REV"
          fi

      # ⚑ THIS RUNS FIRST, DELIBERATELY (2026-07-25). It used to be the LAST step
      # in this job, behind `cargo test` — and that test step hard-aborts (SIGABRT
      # at harness start, the known no-lean-link verified-PQ-core guard named in
      # 870e82ce9e's own message). So this job has been `failure` on EVERY
      # non-cancelled run since at least 07-22, and the wasm32 build never ran.
      #
      # What that cost: the browser bundle stopped building entirely when two
      # crates pulled `zstd` into the wasm32 graph (compiling x86-64 assembly for
      # wasm32), and nobody learned for five days. The served artifact stayed at
      # `PORTABLE_VERSION = 1` while the server moved to 3 and hard-refuses it,
      # and `NativeDescentWorld.fromBeacon` — which descent_play.rs:703 calls on
      # every live-beacon day — did not exist in it. The hero "Play" CTA threw a
      # TypeError before the game opened.
      #
      # A GATE BEHIND A RED GATE IS NOT A GATE. This step depends on nothing the
      # steps below it establish, so ordering it first costs nothing and means a
      # broken wasm32 build is reported even while something else in this job is
      # red. If you add a step here, ask whether it must precede this one; the
      # default answer is no.
      # ⚑ AND ITS TOOL MUST PRECEDE IT. The 2026-07-25 reorder above moved the build to the front
      # of the job and left `Install wasm-pack` where it was — three steps LATER, next to the
      # `wasm-pack test` it was originally written for. So from that commit the job died on
      # `wasm-pack: command not found`, exit 127, before compiling anything: the reorder that
      # existed to stop a gate hiding behind a red gate put this gate in front of its own
      # installer. Measured on run 31132306053 (2026-08-06) and on every run since the reorder.
      # A step promoted to first must bring its prerequisites with it.
      - name: Install wasm-pack (BEFORE the build below — it is what runs it)
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - name: Build the wasm32 bundle (the oracle + the pages artifact)
        run: |
          set -euo pipefail
          RUSTFLAGS="-C link-arg=-zstack-size=33554432" \
            wasm-pack build wasm --target web --out-dir pkg --release
          test -s wasm/pkg/dregg_wasm.d.ts

      # THE GATE. The ~78 `#[test]`s (68 in src/, 10 in tests/) are ordinary
      # native tests — they are the ones the manifest bug hid, and they run here.
      - name: cargo test (the ~78 native tests the manifest bug hid)
        working-directory: wasm
        run: cargo test

      # The 8 `#[wasm_bindgen_test]`s are a different population: two files carry
      # `wasm_bindgen_test_configure!(run_in_browser)`, so they need a real
      # browser, not node. ubuntu-latest ships Chrome; wasm-pack drives it
      # headless. This is the only place the in-browser surface (the card-in-the-
      # tab loop, the light-client-in-the-tab) is exercised at all.
      - name: wasm-pack test (the in-browser wasm_bindgen_test surface)
        working-directory: wasm
        run: wasm-pack test --headless --chrome


  # EXCLUDED-WORKSPACES GATE (2026-07-17, CI-meaningfulness audit Track A2).
  # The repo-root `Cargo.toml` `exclude` list carries eleven DELIBERATE standalone
  # workspaces (each its own `[workspace]` + Cargo.lock), kept out of the root
  # resolution for `links =` / version-pin conflicts. The isolation is correct —
  # and it is the SAME failure mode every time: `cargo check --workspace` never
  # touches them, so nothing can say they have rotted. discord-bot sat silently
  # uncompilable at HEAD until 2026-07-16; wasm's ~78 tests were unbuildable for
  # the identical reason (see the wasm job above). solana-lock and wasm have their
  # dedicated jobs above; sdk-py is compile+test-gated by publish-sdk-py.yml;
  # solana-settlement has its own solana-lock-style job above (its native
  # BanksClient tests need no SBF). This matrix closes the hole for the remaining
  # buildable five. Still ungated: pg-dregg (cargo-pgrx cdylib — wants a
  # pgrx-managed postgres, not a bare runner) and deos-zed-full (the vendored
  # full-Zed recon spike: gpui/display-bound, same reason the root test job
  # excludes deos-zed).
  #
  # `--locked` is deliberate: these workspaces path-dep into the main tree, so a
  # manifest edit anywhere upstream silently invalidates their committed locks —
  # exactly the drift class that goes unnoticed when nothing builds them. A red
  # here that says "stale Cargo.lock" is fixed by regenerating the lock in that
  # directory (cd <dir> && cargo update -w — or any cargo build there without
  # --locked) and committing it.
  #
  # Toolchains: dtolnay/rust-toolchain exports RUSTUP_TOOLCHAIN, which overrides
  # each directory's rust-toolchain.toml — that is what keeps this lane on the
  # repo's date-pinned nightly instead of the crates' local ROLLING `nightly`
  # pins (deliberately non-reproducible in CI). deos-homeserver is the exception:
  # it pins stable 1.96.1 to match its embedded continuwuity upstream, so its
  # matrix leg carries that toolchain instead.
  excluded-workspaces:
    name: Excluded workspace (${{ matrix.dir }})
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # check-only: its lock resolves dregg-lean-ffi WITHOUT no-lean-link, so
          # test binaries would need the Lean seed archive at link time; `cargo
          # check --all-targets` compiles every target (tests included) without
          # linking, which is the honest hosted-runner gate.
          - dir: discord-bot
            toolchain: nightly-2026-06-21
            timeout: 60
          # no-lean-link end to end — test binaries link clean, so run them.
          - dir: dregg-tui
            toolchain: nightly-2026-06-21
            timeout: 45
            test: true
          # self-contained (vendored sqlite via duroxide; no path deps on the
          # default features) — the full suite runs in seconds. `--features deploy`
          # ALSO compiles tests/deploy.rs (`#![cfg(feature = "deploy")]`), the
          # launchpad seam: it pins a content-addressed microsite + token metadata
          # and re-witnesses each asset against its CID. That test is fully hermetic
          # (dregg_ipfs::MockIpfs + tempdir — no daemon, no network) and was compiled
          # by NOTHING before (default features are `sqlite` only, so plain `cargo
          # test` skipped the whole file). The `pg` feature's tests/pg_weld.rs stays
          # out: it needs a live Postgres, same reason pg-dregg is ungated. Verified
          # green locally: 21+ tests incl. the deploy re-witness, ~2s.
          - dir: durable-workflow
            toolchain: nightly-2026-06-21
            timeout: 30
            test: true
            testflags: '--features deploy'
          # stable 1.96.1 = continuwuity's pin (rust-toolchain.toml there);
          # check-only: the embed is a full Matrix homeserver over a from-source
          # rocksdb — the long pole is the compile, and compiling it is the gate.
          # Its conduwuit dep is a git dep on forgejo.ellis.link (an external
          # forge) — if that host is down this leg fails at fetch, not at build.
          - dir: deos-homeserver
            toolchain: '1.96.1'
            timeout: 90
          # The dregg-doc API drift this leg was introduced to expose (2026-07-17:
          # src/materialize.rs on the OLD `AtomContent::as_bytes()` / `d.string()?`)
          # was HEALED the same day by bf8f7ee7b, and the leg has been genuinely
          # green since — last observed at run 30697013645 (2026-08-01). It is now
          # an ordinary gate on a compiling crate: `cargo check --all-targets
          # --locked` is warnings-only as of 2026-08-06.
          #
          # ⚠ What it actually catches now is LOCK DRIFT, and that is not a lesser
          # tooth. This is a SEPARATE workspace with its OWN Cargo.lock, and it
          # path-deps into the main tree (dregg-doc -> dregg-turn -> dregg-circuit).
          # A dependency edge added anywhere in that chain does not reach this lock,
          # so `--locked` refuses to resolve and the leg dies WITHOUT COMPILING A
          # LINE — which is exactly how it failed on 2026-08-06 (`dregg-codec`
          # promoted dev-dep -> dep in circuit/Cargo.toml by 1f1962946). If this leg
          # reds with "cannot update the lock file … because --locked was passed",
          # the fix is `cd forge-ci-runner && cargo update -w`, not a source change.
          # ⚑ And read the error before believing any expected-red note above it: a
          # resolution failure never reaches the source the note is about.
          - dir: forge-ci-runner
            toolchain: nightly-2026-06-21
            timeout: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          lfs: true   # include_str!'d staged registries live in LFS (.gitattributes)
      # Same system-dep set as the Check job: these workspaces path-dep deep into
      # the main tree (discord-bot alone pulls deos-view + starbridge surfaces),
      # so give every leg the same floor rather than bisecting -sys probes per leg.
      # ...plus ONE package the Check job does not need: `liburing-dev`, for
      # deos-homeserver. Its `conduwuit` git dep is taken with DEFAULT features, and
      # upstream's `default` = `standard` = `[... io_uring, jemalloc, journald,
      # systemd ...]` (src/main/Cargo.toml at the pinned rev 4454e540), so the
      # rust-librocksdb-sys fork builds with `io-uring` on and its build script
      # pkg-config-probes `liburing`, failing the leg before a single crate compiles:
      # "the `io-uring` feature was requested but pkg-config probe for `liburing`
      # failed ... apt-get install liburing-dev". NOTE that deos-homeserver's own
      # Cargo.toml comment claims "Default features = standard + ring (NO
      # jemalloc/io_uring/sentry/systemd)" — that is WRONG as written, because it
      # never sets `default-features = false`; this leg is what makes the actual
      # feature set observable. Installing the dep keeps the gate honest about the
      # graph as it RESOLVES; narrowing the features is a build-behaviour change and
      # belongs to whoever owns that embed.
      - run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev libfontconfig1-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libxcb1-dev libgl1-mesa-dev libegl-dev libgles-dev libharfbuzz-dev libfreetype-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libx11-dev libxext-dev libxrandr-dev libxi-dev libxcursor-dev libxinerama-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev gperf libunwind-dev liburing-dev
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: ${{ matrix.toolchain }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ${{ matrix.dir }}
      # forge-ci-runner's `[patch]` path-points ../../plonky3-recursion (same
      # sibling-checkout requirement as the wasm job above, same REV — they must
      # stay in lockstep or the VK forks; see the wasm job's warning block).
      - name: Fetch the plonky3-recursion fork as a sibling (forge-ci-runner patch target)
        if: matrix.dir == 'forge-ci-runner'
        run: |
          set -euo pipefail
          REV=fc3c6dfac26e2082653d2a617a1740446ce33f05
          if [ ! -d ../plonky3-recursion/.git ]; then
            git clone --no-checkout https://github.com/emberian/plonky3-recursion ../plonky3-recursion
            git -C ../plonky3-recursion fetch --depth 1 origin "$REV"
            git -C ../plonky3-recursion checkout "$REV"
          fi
      - name: cargo check --all-targets --locked (the gate)
        working-directory: ${{ matrix.dir }}
        run: cargo check --all-targets --locked
      - name: cargo test --locked (legs whose test binaries link honestly on a hosted runner)
        if: matrix.test
        working-directory: ${{ matrix.dir }}
        # matrix.testflags is the per-leg feature selection (e.g. durable-workflow's
        # `--features deploy`, which turns on the otherwise-never-compiled deploy.rs
        # launchpad test). Empty for legs that only need default features.
        run: cargo test --locked ${{ matrix.testflags }}

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          lfs: true
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev libfontconfig1-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libxcb1-dev libgl1-mesa-dev libegl-dev libgles-dev libharfbuzz-dev libfreetype-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libx11-dev libxext-dev libxrandr-dev libxi-dev libxcursor-dev libxinerama-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev gperf libunwind-dev
      # Reclaim the ~25 GB of preinstalled toolchains we never use. The hosted
      # ubuntu runner ships with only ~14 GB free on /, which the full debug-build
      # `target/` of this workspace overruns — see the root-cause note on the test
      # step below. Freed BEFORE the cache restore + build so they have headroom.
      - if: runner.os == 'Linux'
        name: Reclaim runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /usr/local/lib/android /opt/hostedtoolcache/CodeQL \
            /usr/local/share/powershell /usr/share/swift
          sudo docker image prune --all --force || true
          df -h /
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: nightly-2026-06-21
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # ─────────────────────────────────────────────────────────────────────────
      # ARM THIS LANE AGAINST THE VACUOUS GREEN (docs/ASSESS-cold-build-silent-export.md).
      #
      # dregg-lean-ffi/libdregg_lean.a is gitignored and has NEVER been tracked, so every
      # hosted runner checks out a tree with no Lean archive. dregg-lean-ffi/build.rs then
      # emits a `cargo:warning=` (which cargo HIDES for dependency crates) and returns
      # BEFORE all 23 `cargo:rustc-cfg=dregg_*_present` emissions — so every
      # `#[cfg(all(test, dregg_*_present))]` module ceased to exist and `cargo test`
      # below reported the SURVIVORS as green. Nine test functions vanished that way,
      # including the ONLY automated falsifier for the ~2^31-grind R3 width forgery, and
      # the crate reported `11 passed` rather than `0` — which reads as a healthy crate.
      # The release lanes (armed-teeth, federation-node-*, intent-service, demos) were
      # never affected: `require_lean_native` defaults ON under --release, so they fail
      # loud. This debug `cargo test --workspace` job was the single lane in the one
      # profile where the fail-loud tier was disarmed — and it is the highest-signal job
      # in the repo.
      #
      # DREGG_TEST_REQUIRE_LEAN=1 now arms the gate at BUILD time too (build.rs's
      # `require_lean_native`), so an absent or un-spliced archive is a hard build FAILURE
      # naming the missing exports instead of a smaller, quieter, green test run. It is
      # the SAME variable `demand_lean` already reads to turn a runtime self-skip into a
      # panic, so both halves arm together.
      #
      # SELF-ARMING, exactly like the `lean-marshal-gate` job below: it keys on
      # dregg-lean-ffi/lean-seed.pin. If a seed is pinned we fetch it and arm; if the pin
      # is empty the lane declares itself unarmed rather than silently pretending. The
      # ONLY sanctioned way to stay unarmed WITH a pinned seed is to commit
      # `LEAN_GATE_INTENTIONALLY_UNARMED=1` to the pin — visible in review, never silent.
      - name: Fetch the CI-published Lean seed (arms the test gate below)
        id: seed
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="$(sed -n 's/^TAG=//p' dregg-lean-ffi/lean-seed.pin | head -1)"
          if [ -z "$tag" ]; then
            echo "::warning::lean-seed.pin has an EMPTY TAG — no seed to fetch."
            exit 1
          fi
          if [ "$RUNNER_OS" = "Linux" ]; then sudo apt-get update && sudo apt-get install -y zstd; else brew install zstd || true; fi
          curl -sSf https://elan.lean-lang.org/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          bash scripts/fetch-lean-seed.sh

      - name: Arm the Lean test gate, or declare the lane unarmed (no silent vacuous green)
        id: arm
        run: |
          set -euo pipefail
          if [ -f dregg-lean-ffi/libdregg_lean.a ]; then
            echo "armed=1" >> "$GITHUB_OUTPUT"
            echo "::notice::Lean archive present ($(du -h dregg-lean-ffi/libdregg_lean.a | cut -f1)) — DREGG_TEST_REQUIRE_LEAN=1. Every @[export]-backed test must now actually RUN."
            exit 0
          fi
          intentional="$(sed -n 's/^LEAN_GATE_INTENTIONALLY_UNARMED=//p' dregg-lean-ffi/lean-seed.pin | head -1)"
          if [ "$intentional" = "1" ]; then
            echo "armed=0" >> "$GITHUB_OUTPUT"
            echo "::warning::no Lean archive AND lean-seed.pin declares LEAN_GATE_INTENTIONALLY_UNARMED=1 — every #[cfg(dregg_*_present)] test in this run compiles out and asserts NOTHING. This is a DECLARED, reviewable disarm, not a silent one."
            exit 0
          fi
          echo "::error::no dregg-lean-ffi/libdregg_lean.a after the seed fetch. Without it dregg-lean-ffi/build.rs emits NO cargo:rustc-cfg, every #[cfg(dregg_*_present)] test module compiles out, and this job goes green having asserted nothing about the verified executor, the PQ cores, the R3 anti-forgery teeth, conservation, admission, finality or bridge trust (docs/ASSESS-cold-build-silent-export.md). Fix the seed pipeline (the 'Publish Lean seed' workflow must cut an asset for THIS platform + this commit's key — scripts/lean-seed-key.sh), or — for a deliberate pre-seed bootstrap — commit LEAN_GATE_INTENTIONALLY_UNARMED=1 to dregg-lean-ffi/lean-seed.pin so the disarm is visible in review."
          exit 1

      # ═════════════════════════════════════════════════════════════════════════
      # THE RUNNER IS cargo-nextest, AND THE REASON IS ATTRIBUTABILITY.
      #
      # `cargo test` runs every test in a target IN ONE PROCESS. Measured on the
      # first complete workspace run (2026-07-26, /tmp/ws-srot2.log on persvati):
      # **31 test binaries died on a signal — 19 SIGABRT, 8 SIGSEGV, 4 SIGKILL —
      # and emitted NO `test result:` line at all.** Not one failing test name
      # between them. The 19 SIGABRTs are a single cause (the fail-closed abort on
      # an uninstalled verified PQ core), and each one took its whole binary's
      # test population down with it, unnamed and uncounted. So the headline
      # "256 failed" was a LOWER BOUND with no way to say by how much: a crash in
      # test #3 of 200 is indistinguishable, in that output, from a crate with
      # three tests.
      #
      # nextest runs ONE PROCESS PER TEST. A signal death is then attributable to
      # the test that caused it, and its siblings still run and still report. The
      # failure count is EXPECTED TO RISE on this migration, and a rise is the win
      # being bought — it is previously-hidden failures becoming visible, not new
      # breakage.
      #
      # It also bounds the hangs. Three classes of test in this tree hang forever
      # (a real deadlock in dregg-zkoracle-live, servo-render waiting on a display
      # a headless runner does not have, a starbridge-tussle spin loop). That first
      # workspace run needed an external watchdog to complete at all. `.config/
      # nextest.toml` now gives every profile a `terminate-after`, so a hang is a
      # named TIMEOUT failure instead of a job that burns its 150 minutes and tells
      # you nothing. ⚠ Those root causes are owned work and a timeout is NOT their
      # fix — see THE TIMEOUT DOCTRINE in that file.
      #
      # ⚠ WHY `--profile full` AND NOT `--profile ci`. `[profile.ci]` segregates the
      # minute-scale recursion/fold/proptest suites out of its `default-filter`, and
      # the `cargo test --workspace` this replaces RAN THEM (they are config-
      # segregated, not `#[ignore]`d). Pointing this job at `ci` would have silently
      # dropped ~18 of the most expensive adversarial suites in the repo while every
      # number on the summary line went UP. `full` is `default-filter = 'all()'`,
      # which is what keeps this a faithful migration rather than a narrowing.
      # `[profile.ci]` remains the fail-fast profile for a human wanting quick
      # feedback (`scripts/test-gauntlet.sh ci`); it is deliberately not this gate.
      #
      # ⚠ nextest DOES NOT RUN DOCTESTS — it cannot, there is no libtest harness for
      # them. That is 210 doctest targets here, carrying 54 passing and 4 REAL
      # FAILING doc examples in the reference run. They are recovered by the
      # `cargo test --doc` step below, which is NOT optional and must stay adjacent
      # to this one.
      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest
      # macOS links the full workspace (incl. deos-zed's windowed gpui editor) via
      # ld64 — green, so keep it whole.
      - if: runner.os == 'macOS'
        name: Test workspace (nextest, process-per-test)
        env:
          DREGG_TEST_REQUIRE_LEAN: ${{ steps.arm.outputs.armed }}
        run: cargo nextest run --profile full --workspace --no-fail-fast
      # THE DOCTEST LEG — nextest runs no doctests, so without this the migration
      # above would silently drop 210 targets. `--doc` implies the lib targets only,
      # and it is the ONLY thing in this file that executes a doc example.
      - if: runner.os == 'macOS'
        name: Doctests (the 210 targets nextest structurally cannot run)
        env:
          DREGG_TEST_REQUIRE_LEAN: ${{ steps.arm.outputs.armed }}
        run: cargo test --workspace --doc
      # Linux SIGBUS root cause: it is NOT one heavy crate. The full debug-build
      # `target/` of the WHOLE workspace overruns the hosted runner's small disk,
      # and whichever link steps are running when / hits zero ALL die at once as
      # `collect2: ld terminated with signal 7 [Bus error]` — a write into GNU ld's
      # mmap'd output faults when the file can't be extended (disk full). The proof:
      # the crash hits SIMULTANEOUSLY across unrelated, LIGHT protocol crates
      # (starbridge-agent-orchestration / starbridge-tool-access-delegation — no
      # gpui/servo in their graph), and a sibling run surfaces the identical root
      # cause as a plain `No space left on device (os error 28)`. Fixed at the root
      # WITHOUT dropping any crate: (1) the disk-reclaim step above, and (2) build
      # the tests with debuginfo OFF (CARGO_PROFILE_*_DEBUG=0), which slashes both
      # the on-disk object footprint AND GNU ld's link-time memory so the link fits.
      # Every crate — incl. all starbridge-apps — still LINKS and TESTS here.
      #
      # deos-zed alone stays off this gate (the vendored full Zed/IDE fork: its
      # windowed gpui screenshot targets link the entire desktop/accessibility
      # static graph and want a display at runtime); its protocol-relevant gpui-free
      # core is covered by the firmament lane just below.
      #
      # ⚠ TWO MORE MEMBERS CANNOT LINK ON ELF AT ALL, AND THIS LINE NAMES THEM.
      # `grain-verify-wasm` and `starbridge-web` declare `crate-type = ["cdylib", "rlib"]`
      # for their wasm32 browser bundles, and BOTH reach `dregg-lean-ffi` unconditionally on
      # native (grain-verify's Lean-proven R3 verify core; starbridge-v2's
      # `embedded-executor` -> dregg-sdk, by three separate edges — checked with
      # `cargo tree -i`, not assumed). Cargo builds a lib target with ALL its declared crate
      # types whenever any bin / integration test / doctest of that package needs the plain
      # lib, so `cargo test` links a HOST cdylib nothing ever loads — and on ELF that link
      # cannot succeed. MEASURED on persvati 2026-07-26, `cargo build -p <either>` exits 101:
      #     rust-lld: error: relocation R_X86_64_TPOFF32 against _mi_heap_default
      #               cannot be used with -shared
      #     >>> defined in libdregg_lean_ffi-*.rlib(static.c.o)
      #     >>> referenced by static.c.o:(mi_zalloc_small) ...
      # rustc BUNDLES `static=`-linked native libs into the rlib, so `libleanrt.a`'s mimalloc
      # members — Lean 4.30.0's bundled mimalloc, compiled local-exec TLS, which is legal
      # only in a main executable — ride INSIDE dregg-lean-ffi's rlib and are pulled in to
      # satisfy the `+whole-archive` FFI shim. `-Wl,--gc-sections` is already on that link
      # line and cannot help: the relocation is rejected during symbol resolution, before any
      # section could be dropped. The same two crates LINK on macOS (Mach-O has no equivalent
      # rule), which is exactly why the macOS `cargo test --workspace` above is whole and
      # only this leg could never complete.
      #
      # There is NO per-crate opt-out inside one workspace resolve. dregg-lean-ffi's
      # `no-lean-link` feature UNIFIES onto every native crate (the reason `wasm/` is not a
      # workspace member at all), and `DREGG_LEAN_LINK=shared` — the knob written for exactly
      # this ELF rule — is an env var, i.e. whole-build, and propagates no rpath downstream.
      # Dropping `cdylib` from the two manifests WOULD fix it and cost no test, but wasm-pack
      # refuses a crate without it, and wasm-pack is what builds all three shipped browser
      # bundles (pages-wasm.yml, scripts/build-pages-dist.sh, grain-verify-wasm/build-web.sh).
      # That trades a shipped-artifact pipeline for a test-runner fix, so it is not taken
      # here. Nor is manifest surgery that merely stops cargo from SELECTING the plain lib
      # (`doctest = false` + `required-features`): it would leave `cargo build --workspace`
      # — repro-gate.yml's `repro-gate-full-workspace` — broken anyway, and it hides the
      # constraint behind an invariant the next `tests/foo.rs` silently breaks.
      #
      # WHAT THE EXCLUSION COSTS, EXACTLY — and it is NOT the tests: the step right below
      # runs them. `--lib` selects only the lib-as-test target, which rustc builds with
      # `--test` into an EXECUTABLE, never a cdylib, so all 9 native tests still run on this
      # runner (verified: `cargo test -p <either> --lib --no-run` exits 0 and emits
      # `Executable unittests src/lib.rs` on the same box where the cdylib link exits 101).
      # The residue is four targets, and each is already covered or already empty:
      #   * the two libs' DOCTESTS — measured zero doc examples in either crate;
      #   * `grain-verify-wasm`'s `gen-fixture` bin — zero #[test];
      #   * `starbridge-web`'s `pty_ws_e2e` and `web_panes_wasm` — both already `never-run`
      #     rows in .github/dark-targets.txt, and both `#![cfg(...)]`-empty under a plain
      #     `cargo test` (they need `pty-ws-server` + a real PTY, and wasm32 respectively).
      # All four are still COMPILED by the `cargo check --workspace --all-targets` job above
      # (check does not link), and all four are still LINKED AND RUN by the whole macOS
      # `cargo test --workspace` above.
      - if: runner.os == 'Linux'
        name: Test workspace (nextest; debuginfo off; deos-zed + the two ELF-unlinkable cdylibs split out)
        env:
          CARGO_PROFILE_DEV_DEBUG: "0"
          CARGO_PROFILE_TEST_DEBUG: "0"
          DREGG_TEST_REQUIRE_LEAN: ${{ steps.arm.outputs.armed }}
        run: cargo nextest run --profile full --workspace --exclude deos-zed --exclude grain-verify-wasm --exclude starbridge-web --no-fail-fast
      # THE DOCTEST LEG — see the block above the macOS step. nextest structurally
      # cannot run doctests; this is the only step on this runner that does. It
      # carries the same excludes for the same ELF-link reason.
      - if: runner.os == 'Linux'
        name: Doctests (the 210 targets nextest structurally cannot run)
        env:
          CARGO_PROFILE_DEV_DEBUG: "0"
          CARGO_PROFILE_TEST_DEBUG: "0"
          DREGG_TEST_REQUIRE_LEAN: ${{ steps.arm.outputs.armed }}
        run: cargo test --workspace --exclude deos-zed --exclude grain-verify-wasm --exclude starbridge-web --doc
      # THE RECOVERY STEP — this is what makes the exclusion above cost zero tests rather
      # than nine. It must stay adjacent to it: an exclusion whose recovery drifts away is
      # the silent narrowing this repo keeps paying for.
      # ⚠ THIS STEP AND THE `deos-zed` ONE BELOW STAY ON `cargo test`, DELIBERATELY.
      # They are the two NARROW legs, and nextest cannot express them. `.config/
      # nextest.toml` names test binaries workspace-wide (`binary(proptest_invariants)`
      # lives in dregg-turn, `binary(private_book_bfv_zk)` in fhegg-fhe, …) and nextest
      # validates EVERY profile's filterset against the binaries IN SCOPE on every
      # invocation. Narrowing scope with `-p` therefore makes the out-of-scope names
      # unresolvable and nextest hard-errors (exit 96) and runs NOTHING — regardless of
      # which profile you asked for. `scripts/test-gauntlet.sh`'s header records the same
      # rule and the same reason. So: whole-workspace legs get nextest and its
      # process-per-test attribution; per-package legs keep `cargo test`. Do not
      # "finish the migration" by adding `-p` to a nextest line — that is how this
      # step comes to run zero tests while reporting success at the job level.
      - if: runner.os == 'Linux'
        name: Test the two cdylib crates' libs (recovers every test the exclusion above would cost)
        env:
          CARGO_PROFILE_DEV_DEBUG: "0"
          CARGO_PROFILE_TEST_DEBUG: "0"
          DREGG_TEST_REQUIRE_LEAN: ${{ steps.arm.outputs.armed }}
        run: cargo test -p grain-verify-wasm -p starbridge-web --lib
      # ...still test deos-zed's gpui-FREE core on Linux: the FirmamentFs seam
      # (a file is a cell, a save is a receipted turn) links only the light executor
      # spine, so it links cleanly. This keeps the protocol-relevant half covered.
      - if: runner.os == 'Linux'
        name: Test deos-zed gpui-free firmament core
        env:
          CARGO_PROFILE_DEV_DEBUG: "0"
          CARGO_PROFILE_TEST_DEBUG: "0"
        run: cargo test -p deos-zed --no-default-features --features firmament

  # ════════════════════════════════════════════════════════════════════════════════════
  # THE EXECUTION GATE — the one job that can tell "the tests passed" from "the tests
  # never ran". docs/WOUND-ci-gates-dead-since-2026-07-20.md.
  #
  # THE INCIDENT. On 2026-07-20 a commit about ML-KEM deleted a Lean→Rust FFI binding two
  # committed `dregg-circuit-prove` tests still imported. `cargo test --workspace` COMPILES
  # EVERY TARGET BEFORE RUNNING ANY, so one un-compilable test file meant ZERO tests ran in
  # that crate — for five days. The law-1 ratchet (AIR is AUTHORED IN LEAN, never
  # hand-written in Rust) and all 23 Lean↔Rust `*_emit_gate` equality gates were dark the
  # whole time, and NOTHING SAID SO: absence of execution satisfied every signal we had.
  #
  # WHY IT IS A SEPARATE JOB, NOT A STEP IN `test` ABOVE. A step appended to the workspace
  # test job inherits the workspace's compile fate — the exact coupling that produced the
  # blackout. `armed-teeth.yml` survived those five days for one reason: it names its
  # binaries with `--test`, so it does not. This job takes that shape and adds the half
  # armed-teeth does not have — it PARSES what libtest reported and matches it against a set
  # RECORDED IN THE REPO (scripts/gates-executed.tsv, 24 binaries / 191 tests), with the two
  # floors (`law1_enforcement_gate` by name, ≥23 emit gates) hardcoded in the checker so
  # emptying the manifest is not a way to go green.
  #
  # It is deliberately NOT `continue-on-error` and deliberately NOT gated on the Lean seed:
  # these gates do not need an archive, and a gate that can only run when infrastructure is
  # healthy is a gate that is off exactly when you need it.
  #
  # The checker runs its own `--self-test` first, on EVERY invocation — synthetic fixtures
  # for a deleted gate, an unarmed new gate, a trimmed manifest, a compile-error log, a
  # filtered-to-zero run (cargo exit 0!), a silenced test, a red test, plus a positive
  # control. Shipping an unfalsifiable guard against unfalsifiable guards would be a joke
  # telling itself, so the guard proves it can go red before it says anything about the tree.
  gates-executed:
    name: Execution gate (the law-1 ratchet + 23 emit gates actually RAN)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          lfs: true   # include_str!'d staged registries live in LFS (.gitattributes)

      # Same disk reclaim as the test job: the hosted runner ships ~14 GB free on /.
      - name: Reclaim runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /usr/local/lib/android /opt/hostedtoolcache/CodeQL \
            /usr/local/share/powershell /usr/share/swift
          sudo docker image prune --all --force || true
          df -h /

      # STATIC-ONLY SELF-PROOF, BEFORE ANY TOOLCHAIN. If the Rust setup below ever breaks,
      # this step has already run and the log already shows the guard biting — the failure
      # mode of a guard must not be silence.
      - name: Prove the execution gate can go RED (self-test; no cargo, no toolchain)
        run: python3 scripts/check-gates-executed.py --self-test

      # No apt step on purpose: `dregg-circuit-prove`'s graph is plonky3 + wgpu, none of which
      # needs the gpui/servo system headers the `test` job installs, and the armed set contains
      # no GPU binary. If a link here ever fails for a missing system library, copy the `test`
      # job's apt line rather than narrowing the armed set.
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: nightly-2026-06-21
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Every named gate EXECUTED (parsed from libtest, not inferred from an exit code)
        env:
          CARGO_PROFILE_DEV_DEBUG: "0"
          CARGO_PROFILE_TEST_DEBUG: "0"
        run: python3 scripts/check-gates-executed.py

  # The LIVE agent-brain transport lane. The default build is 100% the recorded
  # `RecordedOpenAICaller`; the REAL `reqwest`-over-TCP transport
  # (`LiveOpenAICompatCaller`) is exercised only under `--features live-brain`, so it
  # never ran in the `cargo test --workspace` gate above (the audit's F4/G3). This
  # lane runs the hermetic mock-server tests (`dregg-agent/src/brain.rs`
  # `mock_server_tests`) — a real localhost OpenAI-compatible server over real TCP:
  # the configured base URL is honored, the API key rides ONLY the Authorization
  # header (never the body), and a dead endpoint fail-closes. Hermetic (no external
  # network), so it runs on every push. dregg-agent is std+reqwest — no gpui/system
  # deps needed.
  live-brain:
    name: Live brain (hermetic HTTP)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        # NO `lfs: true` (2026-07-29): this job never reads circuit/descriptors/*staged*.tsv.
        # dregg-agent is NOT in dregg-circuit reverse-dep cone (cargo metadata, 184 of 225 members are; this is one of the 41 that are not).
        # The LFS allowance is the repo's only real Actions bill and it is EXHAUSTED; a job
        # that pulls 22.5 MB it never opens is pure bill. See the LFS block at the top.
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: nightly-2026-06-21
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: cargo test (dregg-agent, live-brain)
        run: cargo test -p dregg-agent --features live-brain

  # ══════════════════════════════════════════════════════════════════════════════════════
  # WHAT WAS CUT FROM THIS FILE ON 2026-07-29, AND WHERE THE QUESTION IS ANSWERED NOW.
  #
  # Nine jobs were deleted. Eight of them ran a command that is character-for-character a row
  # in `scripts/local-gates.sh`; the ninth could not fail. None of the eight compiles anything,
  # links anything, or touches the network — each is a static text scan over the checked-out
  # source, so a hosted runner and a developer's laptop compute the SAME function of the SAME
  # bytes. GitHub was not adding a second opinion; it was adding ~90 minutes of latency to a
  # verdict a laptop reaches in about a second.
  #
  #   deleted job                  the local row that answers it (scripts/local-gates.sh)
  #   ───────────────────────────  ─────────────────────────────────────────────────────────
  #   no-unchecked-auth            no-unchecked-auth   (bash scripts/no-unchecked-auth.sh)
  #   independence-controls        independence-controls
  #   p3-rev-lockstep              p3-rev              (bash scripts/check-p3-rev.sh)
  #   lean-orphans                 lean-orphans + forcing-gadget-tie + forcing-gadget-tie-red
  #                                (all three of this job's commands, all three present)
  #   ratchet-darkness             ratchet-darkness
  #   no-degraded-felt             no-degraded-felt
  #   descriptor-by-name-routing   descriptor-drift — `check-descriptor-drift.sh:169` runs
  #                                `emit_descriptors.py --verify-by-name-routing` as its own
  #                                static preflight, i.e. the identical invocation.
  #                                ⚑ 2026-08-06: that preflight no longer ABORTS the drift run
  #                                (it used to `exit 1` and hide the byte comparison behind a
  #                                question that is not drift). It still runs, still fails the
  #                                gate — so this coverage claim is unchanged — it just no
  #                                longer suppresses the other leg's verdict.
  #   opentheory-importer          opentheory-importer + opentheory-importer-red. This job ran
  #                                ONLY `--self-test`; that flag is checked at
  #                                check-opentheory-importer.sh:108, AFTER the headline run, so
  #                                the local pair is the same work and not less.
  #   clippy (advisory)            nothing, and nothing is what it asserted: it carried
  #                                `continue-on-error: true`, so it could not fail. Its own
  #                                comment recorded that it IS red (~50 unused-import warnings
  #                                promoted by `-D warnings`). A job that cannot go red is not a
  #                                gate — and the half of clippy that IS a gate,
  #                                `clippy-correctness` below, is untouched and still hard-fails.
  #
  # ⚠ SAY THE RESIDUAL OUT LOUD. `scripts/local-gates.sh` is invoked BY HAND. The pre-push hook
  # (`scripts/git-hooks/pre-push`) blocks on exactly two things — `check-doc-refs.sh` and
  # `check-workspace-closure.py --rev <tip>` — and on nothing else in that table. So these eight
  # checks are now gated by a human choosing to run a script. If that is not acceptable, the fix
  # is one line in the pre-push hook, not nine jobs here.
  #
  # WHAT WAS NOT CUT, and why the distinction matters more than the list: `fmt` stays. The
  # pre-commit hook does rustfmt staged files, but it is best-effort by construction — it exits 0
  # when rustfmt is absent and skips files that do not parse, and its own header says "CI's
  # `cargo fmt --check` remains the hard gate". There is no `fmt` row in local-gates.sh. Deleting
  # it would have dropped the only place format drift is refused.
  # ══════════════════════════════════════════════════════════════════════════════════════


  # ── The half of clippy that is a REAL gate ───────────────────────────────────
  # The advisory job above cannot fail, and its ~4000 lines of style warnings are
  # where a guard-that-cannot-fire goes to hide. Concretely: `dreggnet-party`'s
  # Scout `UnsafeStrike` preflight was `hp > FINISH_THRESHOLD && hp <= ATTACK_DIE`
  # with both constants `8` — UNSATISFIABLE, a check that could never refuse
  # anything — and `impossible_comparisons` had been printing it, at warn level,
  # in every build, unread.
  #
  # `clippy::correctness` is deny-by-default upstream; `[workspace.lints.clippy]`
  # now restores that (`all` was silently downgrading it). This job is the CI half:
  # it runs the group over EVERY target (the advisory job omits `--all-targets`, so
  # all test code is invisible to it) and it does NOT continue-on-error.
  #
  # `--keep-going` + the diagnostic grep, rather than the exit code, on purpose: a
  # handful of test targets do not compile at HEAD (see the "dark targets" note in
  # docs/), and `--keep-going` lets the correctness sweep still cover everything
  # that DOES compile instead of stopping at the first broken target. Those targets
  # are a separate, named debt — not a reason for this gate to be advisory too.
  clippy-correctness:
    name: Clippy (correctness — HARD GATE)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          lfs: true
      - run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev libfontconfig1-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libxcb1-dev libgl1-mesa-dev libegl-dev libgles-dev libharfbuzz-dev libfreetype-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libx11-dev libxext-dev libxrandr-dev libxi-dev libxcursor-dev libxinerama-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev gperf libunwind-dev
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: nightly-2026-06-21
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: correctness sweep over every target
        env:
          CARGO_PROFILE_DEV_DEBUG: "0"
          # ⚑ THIS GATE COULD NOT FIRE, and had not been able to since it was written
          # (found 2026-07-25). The workflow sets `CARGO_TERM_COLOR: always` at the top
          # level, which cargo honours even when its output is REDIRECTED TO A FILE. So
          # every line in `clippy-correctness.log` carries SGR escapes around the word
          # `error`, and both readers below are anchored on that literal:
          #
          #   raw:   src/main.rs:1:25: ESC[1mESC[91merrorESC[0m[E0308]: mismatched types
          #   raw:   ESC[1mESC[91merrorESC[0m: could not compile `p` (bin "p") due to 1 …
          #
          # Measured, not reasoned: on a probe crate with one type error,
          # `grep -c '^error: could not compile'` returns 0 and the correctness pattern
          # returns nothing. Consequences, both bad in the "reports GREEN" direction:
          #   * `correctness: clean.` was a VACUOUS pass — a denied correctness lint,
          #     the thing this HARD GATE exists to refuse, was unmatchable.
          #   * the dark-target ratchet's `dark-now.txt` was ALWAYS EMPTY, so NEW dark
          #     targets could never be detected, and every row in
          #     `.github/dark-targets.txt` was reported as "NO LONGER DARK" on every
          #     run — the job's standing red, and a claim it had no evidence for.
          # `never` here, not a sed pipeline: this log is read by machines only.
          CARGO_TERM_COLOR: never
        run: |
          # `set +e` is load-bearing, exactly as in `lean-marshal-gate`'s probe step below:
          # GitHub runs `run:` under `bash -e {0}`, so without it a non-zero cargo aborts the
          # step and every floor below becomes unreachable code. The old line ended `|| true`,
          # which had the same effect and THREW THE STATUS AWAY; this keeps it.
          set +e
          set -uo pipefail
          cargo clippy --workspace --all-targets --keep-going --message-format=short \
            > clippy-correctness.log 2>&1
          cargo_status=$?

          # ══ THE FLOOR — AN EMPTY LOG MUST NOT READ AS CLEAN (2026-08-08) ══════════════
          # The line above used to end `|| true`, and the ONLY reader was the `grep` below.
          # A `grep` that matches nothing exits 1, the `if` takes its else branch, and the
          # step prints `correctness: clean.` and exits 0 — so EVERY way for clippy to die
          # before emitting a diagnostic reported this HARD GATE as passing: `cargo: command
          # not found` (127), a toolchain without the clippy component ("error: no such
          # command: `clippy`"), an OOM kill, a full disk. Nothing distinguished them from a
          # clean workspace, and the three darkness sweeps below inherit the same log.
          #
          # It is the same shape as the `CARGO_TERM_COLOR` wound this step's own comment
          # records — a reader anchored on text that was not there — one layer out: there
          # the pattern could not match, here there was nothing to match against. Every
          # other floored gate in this file already carries one (`lean-marshal-gate`'s
          # `-lt 18` assertion-count floor, `gates-executed`'s recorded manifest); this leg
          # was the outlier.
          #
          # THREE CHEAP FACTS, and each one is a thing cargo ITSELF produces:
          #   1. the status is one cargo can return: 0 (clean) or 101 (it compiled and
          #      something failed). 127/126/>128 mean the process never was cargo.
          #   2. the log carries a TERMINAL MARKER — cargo's `Finished` line, or at least
          #      one `could not compile`. Either proves the invocation reached its end.
          #      An early death has neither.
          #   3. the log is not trivially short.
          # Deliberately NOT a floor on `Checking`/`Compiling` counts: a warm
          # `Swatinem/rust-cache` restore makes cargo print nothing at all for fresh units,
          # so such a floor would red on exactly the runs it should be quietest on.
          lines=$(wc -l < clippy-correctness.log | tr -d ' ')
          finished=$(grep -cE '^\s*Finished ' clippy-correctness.log)
          could_not=$(grep -cE 'could not compile' clippy-correctness.log)
          echo "clippy sweep: exit=$cargo_status · ${lines} log line(s) · ${finished} Finished · ${could_not} could-not-compile"
          if [ "$cargo_status" != 0 ] && [ "$cargo_status" != 101 ]; then
            echo "::error::cargo clippy exited $cargo_status — that is not a status cargo produces for a"
            echo "::error::compile outcome (0 = clean, 101 = it ran and something failed). The process"
            echo "::error::was not cargo, or it was killed. NOTHING below this line measured the tree."
            tail -40 clippy-correctness.log
            exit 1
          fi
          if [ "$finished" -eq 0 ] && [ "$could_not" -eq 0 ]; then
            echo "::error::cargo clippy emitted NEITHER a \`Finished\` line NOR a \`could not compile\`"
            echo "::error::in ${lines} line(s) of output, so the invocation never reached its end. A"
            echo "::error::log with no terminal marker cannot distinguish a clean workspace from a"
            echo "::error::clippy that died before its first diagnostic — and the two darkness sweeps"
            echo "::error::below read THIS SAME LOG, so they would have gone quiet with it."
            tail -40 clippy-correctness.log
            exit 1
          fi
          if [ "$lines" -lt 10 ]; then
            echo "::error::clippy-correctness.log is ${lines} line(s). A sweep over ~225 workspace"
            echo "::error::members cannot be that quiet; the reader has nothing to read."
            cat clippy-correctness.log
            exit 1
          fi

          # A correctness lint is `deny` via [workspace.lints.clippy], so it lands as
          # `error: <message>` on a source line. Compile errors (E0xxx) are the separate
          # dark-target debt and are reported, not gated, here.
          if grep -E '^[^ ].*\.rs:[0-9]+:[0-9]+: error: ' clippy-correctness.log \
               | grep -v 'error\[E[0-9]' > correctness-hits.txt; then
            echo "::error::clippy::correctness fired — a check that cannot refuse anything, or worse."
            cat correctness-hits.txt
            echo
            echo "Fix it, or — if the shape is deliberate — annotate the SITE with"
            echo "  #[expect(clippy::<lint>, reason = \"...\")]"
            echo "(expect, not allow: it self-retires when the shape changes)."
            exit 1
          fi
          echo "correctness: clean."
      # ── THE DARK-TARGET RATCHET ────────────────────────────────────────────
      # A target that does not compile is a guard that CANNOT FIRE, and it is
      # indistinguishable from a guard that always passes. On 2026-07-25 there
      # were TWELVE of them; six had never compiled once since the commit that
      # introduced them, and two of those commits' subjects asserted exactly the
      # property the dark test checked. None announced itself — a `::warning::`
      # annotation (what this step used to emit) is a DOCUMENTED wound, not a
      # DETECTED one.
      #
      # So: the known-dark set is enumerated, with a reason per row, in
      # `.github/dark-targets.txt`. A target that goes dark and is NOT on that
      # list FAILS THIS JOB. Fix it, or add the row and say why.
      #
      # ⚑ `if: !cancelled()` IS THE WHOLE POINT OF THIS STEP EXISTING (2026-08-03).
      # This was step 7 of 9, behind the correctness sweep, and GitHub Actions stops
      # a job at the first FAILED step. So one standing `clippy::correctness` hit
      # anywhere in the workspace silently disarmed ALL THREE darkness sweeps, and
      # the job's red said "correctness" while saying nothing about darkness.
      # MEASURED over every run of this file 2026-08-01..08-03 (34 runs): this step
      # EXECUTED 3 TIMES AND WAS SKIPPED 31. Two `this operation will always return
      # zero` hits (dreggnet-game-board/tests/multi_round_fold.rs:533,
      # dregg-automatafl/src/legc_witness.rs:768) held it shut.
      # WHAT THAT COST: 522b9c763 widened `content_commit` to `[CommitLane; 8]` and
      # missed `commons-arbiter` + `confined-swarm`; both libs went dark, neither is
      # allowlisted, five runs covered the window, and all five read `skipped`. A
      # human found it ~11h later from a build error. The wasm job above already
      # carries this exact lesson — "A GATE BEHIND A RED GATE IS NOT A GATE" — for
      # the same reason, one job over. These three steps depend on nothing the
      # correctness sweep establishes except the LOG, which it always writes.
      #
      # ⚑ AND THE LOGIC MOVED OUT OF YAML, because two more holes were only visible
      # once it was code you could run (`scripts/check-dark-targets.py`):
      #   * the inline reader stripped `file ` rows but NOT `never-run ` rows, so
      #     `dark-known.txt` held 66 rows from the THIRD sweep and every one of them
      #     read as "NO LONGER DARK". MEASURED by executing the old snippet against
      #     a clean log: 0 new, 66 stale, exit 1. Its green branch was UNREACHABLE.
      #   * cargo emits NO diagnostic for a target it never attempts, so a red lib
      #     prunes its whole cone invisibly and the allowlist comparison is a lower
      #     bound. The header has warned a human about that since 07-25; the gate
      #     now derives the pruned cone from `cargo metadata` and refuses to render
      #     a verdict over an incomplete measurement.
      # The script red-proves all of it: `python3 scripts/check-dark-targets.py
      # --self-test` (11 legs, ~3s, real cargo over a temp workspace), and it has a
      # row in `scripts/local-gates.sh` so it no longer needs a GitHub runner.
      - name: dark-target ratchet
        if: ${{ !cancelled() }}
        run: python3 scripts/check-dark-targets.py --log clippy-correctness.log
      # ── THE MOD-DECLARATION SWEEP (the ratchet's blind spot) ───────────────
      # The step above catches a target that FAILS TO COMPILE. It cannot catch a
      # file rustc NEVER OPENS — an unreferenced `.rs` is not a target, emits no
      # diagnostic, and `--keep-going` never names it. Both failures leave every
      # `#[test]` in the file unable to fire; only one of them is visible.
      #
      # What the invisible half cost, twice: `eth-lightclient`'s `bridge_lc_ffi`
      # ETH light-client verification bridge had never been compiled, and
      # `cargo test --lib -- bridge_lc_ffi` matched 0 of its 24 tests and reported
      # GREEN. Then `sdk/src/fhegg.rs` — wired and tested on 07-17, un-wired on
      # 07-20 as collateral in a commit about ML-DSA that never mentions it, while
      # the `fhegg` feature stayed in `default` so every consumer kept compiling
      # the dependency for a module that did not exist.
      #
      # Same two-sided ratchet, same allowlist file, `file `-prefixed rows.
      # `if: !cancelled()` for the reason spelled out on the ratchet step above —
      # this sweep was skipped on 31 of 34 runs 08-01..08-03 because an unrelated
      # correctness lint failed step 6 first.
      - name: mod-declaration sweep
        if: ${{ !cancelled() }}
        run: python3 scripts/check-dark-modules.py
      # ── THE EXECUTION SWEEP (the third darkness) ───────────────────────────
      # The two steps above catch a target that FAILS TO COMPILE and a file rustc
      # NEVER OPENS. Neither can see a target that compiles, is wired, and simply
      # NEVER RUNS — and that one is the quietest of the three. Cargo prints
      # *nothing whatsoever* for a target whose `required-features` are off: not
      # `ignored`, not `0 filtered out`, no line at all. A whole-file
      # `#![cfg(feature = "x")]` is worse — the binary builds, runs, and reports
      # `test result: ok. 0 passed`, which reads exactly like a passing suite.
      #
      # MEASURED 2026-07-25: 63 such targets. ⚠ AND A MANIFEST-ONLY COUNT OF THEM
      # IS WRONG IN BOTH DIRECTIONS — the sweep that found this population by
      # grepping `required-features` reported 32, and was off by more than it was
      # right. Cargo UNIFIES features across a `--workspace` resolve THROUGH
      # DEV-DEPENDENCIES: `dreggnet-market` dev-depends on `dreggnet-catalog`
      # with `private-fhegg-game-consequence`, which turns on
      # `dreggnet-market/private-attested-clearing` → `private-clearing` →
      # `fhegg-fhe/amm-input-binding`. Fifteen targets that a manifest reading
      # calls dark are ACTIVE on every `cargo test --workspace`. So this sweep
      # asks CARGO'S OWN RESOLVE (`cargo metadata`), never the manifest.
      #
      # Same two-sided ratchet, same allowlist file, `never-run `-prefixed rows.
      # `if: !cancelled()` for the reason spelled out on the ratchet step above —
      # this sweep was skipped on 31 of 34 runs 08-01..08-03 because an unrelated
      # correctness lint failed step 6 first.
      - name: execution sweep (targets nothing can run)
        if: ${{ !cancelled() }}
        run: python3 scripts/check-never-run-targets.py --summary

  fmt:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        # NO `lfs: true` (2026-07-29): this job never reads circuit/descriptors/*staged*.tsv.
        # rustfmt parses .rs files; it compiles nothing and reads no descriptor.
        # The LFS allowance is the repo's only real Actions bill and it is EXHAUSTED; a job
        # that pulls 22.5 MB it never opens is pure bill. See the LFS block at the top.
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: nightly-2026-06-21
          components: rustfmt
      # If this fails, format-drift landed. The local pre-commit hook formats every staged .rs at
      # its crate's edition so this stays green automatically — install it once with
      # `bash scripts/install-hooks.sh`, and commit WITHOUT `--no-verify` (that skips the hook).
      - run: |
          cargo fmt --all -- --check || { echo '::error::format drift — run `cargo fmt --all` (and install the pre-commit hook: bash scripts/install-hooks.sh)'; exit 1; }

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        # NO `lfs: true` (2026-07-29): this job never reads circuit/descriptors/*staged*.tsv.
        # cargo-audit reads Cargo.lock against the RustSec DB; it compiles nothing.
        # The LFS allowance is the repo's only real Actions bill and it is EXHAUSTED; a job
        # that pulls 22.5 MB it never opens is pure bill. See the LFS block at the top.
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable
      # Run `cargo audit` directly rather than via `rustsec/audit-check@v2`
      # (the action's `ignore` input is silently dropped — it reported an empty
      # ignore set in its own JSON, red-failing the lane on the assessed
      # transitive advisories). `cargo audit` only auto-reads config from
      # `.cargo/audit.toml`, NOT the repo-root `/audit.toml`, so we pass the
      # ignore list explicitly via `--ignore`, sourced FROM `/audit.toml`
      # (the single source of truth — each id carries its chain + reachability
      # reason + the upstream bump that retires it). cargo-audit surfaces
      # informational advisories (unmaintained / yanked) as non-fatal warnings
      # by default, exactly the policy audit.toml documents. Drop a line from
      # audit.toml the moment its upstream ships a graph-compatible patched
      # release — this step picks the change up automatically.
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: cargo audit (ignores sourced from /audit.toml)
        run: |
          set -euo pipefail
          # Extract the RUSTSEC ids from the [advisories].ignore array in
          # audit.toml and turn each into a `--ignore <id>` flag. Match ONLY the
          # QUOTED array elements ("RUSTSEC-…"), never a bare mention in a comment
          # — otherwise a RUSTSEC id typed into a comment silently suppresses a
          # live advisory (the grep-scanned-the-whole-file footgun; audit.toml's
          # own per-entry comments name the ids, and fixed advisories are written
          # prefix-stripped to dodge the old grep — both now moot).
          mapfile -t IDS < <(grep -oE '"RUSTSEC-[0-9]{4}-[0-9]{4}"' audit.toml | tr -d '"' | sort -u)
          IGNORE_ARGS=()
          for id in "${IDS[@]}"; do IGNORE_ARGS+=(--ignore "$id"); done
          echo "Ignoring ${#IDS[@]} assessed advisories: ${IDS[*]}"
          cargo audit "${IGNORE_ARGS[@]}"

  lean-marshal-gate:
    name: Lean marshal gate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # THE FAITHFULNESS GATE, ARMED. This job used to be a checkmark that could not be red: with no
    # libdregg_lean.a on a hosted runner, check-lean-marshal.sh exited 0 having compared the Rust
    # executor against nothing at all. It is now armed by FETCHING a seed.
    #
    # A hosted runner cannot BUILD the seed (the Dregg2 corpus compile — see lean-seed.yml), but it
    # does not need to: ubuntu-latest IS Linux-x86_64, the platform lean-seed.yml publishes on every
    # push to metatheory/**. Consuming a prebuilt archive is a download + a link, which is minutes.
    # That asymmetry — build heavy on self-hosted, consume cheap on hosted — is what un-fakes this.
    #
    # SELF-ARMING: until the first seed release exists, the pin's TAG is empty and fetch cannot
    # resolve anything, so the gate reports its unarmed state loudly instead of failing every PR for
    # infrastructure that has not been stood up yet. lean-seed.yml's `pin` job writes TAG on the
    # first successful publish — at which point this gate arms itself with no further edit here.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          lfs: true
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: nightly-2026-06-21
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Is a seed release published? (reads dregg-lean-ffi/lean-seed.pin)
        id: pin
        run: |
          set -euo pipefail
          tag="$(sed -n 's/^TAG=//p' dregg-lean-ffi/lean-seed.pin | head -1)"
          if [ -n "$tag" ]; then
            echo "armed=1" >> "$GITHUB_OUTPUT"
            echo "::notice::seed release '$tag' is pinned — arming the faithfulness gate."
          else
            echo "armed=0" >> "$GITHUB_OUTPUT"
            # SILENT-DISARM GUARD (gate-vacuity #3). An empty TAG makes
            # check-lean-marshal.sh SKIP — "NOTHING WAS CHECKED" — and exit 0, so a
            # disarmed run is byte-for-byte indistinguishable from a passing one. A
            # published seed EXISTS (lean-seed.pin ships TAG=lean-seed, content-keyed and
            # stable), so on the protected branch `main` there is NO legitimate unarmed
            # state: an empty TAG there is a lost/tampered pin and MUST be a red job, not
            # a green-with-warning. The ONLY sanctioned unarmed state is a deliberate
            # pre-seed bootstrap, and it must be declared IN THE COMMITTED PIN with a
            # `LEAN_GATE_INTENTIONALLY_UNARMED=1` line — visible in review, never silent.
            intentional="$(sed -n 's/^LEAN_GATE_INTENTIONALLY_UNARMED=//p' dregg-lean-ffi/lean-seed.pin | head -1)"
            # Fire on a PUSH to main AND on a PR TARGETING main. The push-only form was a
            # POST-MERGE tripwire: a PR that empties/tampers the pin passed its PR CI green
            # (the marshal gate silently SKIPs), so a reviewer relying on green checks would
            # MERGE the disarm before the red ever showed. For a pull_request event the
            # protected target is GITHUB_BASE_REF (= main), not GITHUB_REF. Blocking both
            # makes the disarm visible in the PR, pre-merge.
            targets_main=0
            if [ "${GITHUB_EVENT_NAME:-}" = "push" ] && [ "${GITHUB_REF:-}" = "refs/heads/main" ]; then
              targets_main=1
            elif [ "${GITHUB_EVENT_NAME:-}" = "pull_request" ] && [ "${GITHUB_BASE_REF:-}" = "main" ]; then
              targets_main=1
            fi
            if [ "$targets_main" = "1" ] && [ "$intentional" != "1" ]; then
              echo "::error::lean-seed.pin has an EMPTY TAG on a change to main (push or PR), with no committed LEAN_GATE_INTENTIONALLY_UNARMED=1 escape. The Lean↔Rust faithfulness gate would SKIP and go green having checked NOTHING. Restore the pin's TAG (run 'Publish Lean seed'), or — for a deliberate pre-seed bootstrap — commit LEAN_GATE_INTENTIONALLY_UNARMED=1 to dregg-lean-ffi/lean-seed.pin so the disarm is visible in review."
              exit 1
            fi
            echo "::warning::lean-seed.pin TAG is EMPTY — no seed release exists yet, so this gate can only SKIP and is asserting NOTHING. Run the 'Publish Lean seed' workflow (needs a registered self-hosted runner with the lean-seed + linux-x86_64 labels); it writes TAG and this gate arms itself automatically."
          fi

      # The seed links against the pinned toolchain's Lean runtime/stdlib, so elan is required even
      # on the fetch path. It installs in ~a minute and does NOT compile mathlib.
      - name: Install elan + the pinned Lean toolchain
        if: steps.pin.outputs.armed == '1'
        run: |
          set -euo pipefail
          curl -sSf https://elan.lean-lang.org/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Fetch the CI-published Lean seed for this checkout
        if: steps.pin.outputs.armed == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          sudo apt-get update && sudo apt-get install -y zstd
          bash scripts/fetch-lean-seed.sh

      - name: Faithfulness gate (Lean↔Rust; armed — an absent seed is now a FAILURE)
        env:
          # Armed only when a seed was actually fetchable. When it was not, this stays 0 and the
          # script prints "NOTHING WAS CHECKED" rather than a green that means nothing.
          DREGG_REQUIRE_LEAN_GATE: ${{ steps.pin.outputs.armed }}
        run: bash scripts/check-lean-marshal.sh

      # ── THE OTHER FOUR PROBES, AND THE ONE THAT RAN EMPTY ──────────────────
      # `dregg-lean-ffi/tests/` holds SIX whole-file `#![cfg(feature = "lean-lib")]`
      # probes. `check-lean-marshal.sh` above names exactly two of them by `--test`
      # (`embeddable_runtime_probe`, `overspend_probe`), and `cargo test --test a --test b`
      # runs ONLY a and b — so the other four have never been compiled by any workflow.
      # This is the job that already has the archive, so it is where they belong.
      #
      # ⚠ AND ONE OF THE TWO ALREADY-NAMED PROBES HAS BEEN REPORTING `ok. 0 passed`
      # SINCE IT WAS WIRED. `embeddable_runtime_probe.rs` carries
      # `#![cfg(target_os = "macos")]` on the line after its feature gate, and this job
      # runs on `ubuntu-latest`. So on every CI run it compiles to an empty crate and
      # reports a passing suite of zero tests, while `embeddable_runtime_probe_linux.rs`
      # — the Linux twin written for exactly this runner — was named by nothing at all.
      # A macOS-only probe on a Linux lane and its unarmed Linux twin: the gate was
      # green, and neither half of the measurement it claims ever happened.
      #
      # The count floor is what keeps this honest. Every one of these targets reports
      # `ok. 0 passed` rather than failing when its cfg is off, so an exit code cannot
      # distinguish "the probes ran" from "the probes compiled away". Assert the number
      # of assertions, not the status.
      # ⚑ SIX MORE PROBES, ARMED (2026-08-08). Six of the eight rows `check-never-run-targets.py`
      # was reporting UNLISTED at HEAD are `dregg-lean-ffi` tests carrying a whole-file
      # `#![cfg(feature = "lean-lib")]`, and every one of them is the same class this step was
      # created for — a probe over a REAL `@[export]` in the archive, written after this list was
      # last touched and named by no workflow since:
      #     poa_dark_bazaar_judge_probe 3 · poa_records_probe 3 · poa_signal_feedback_probe 8
      #     poa_slot_derive_probe 3 · poa_station_daily_probe 6 · trustline_step_oracle_probe 5
      # Two of them exist SPECIFICALLY to occupy the polarity a landed export deletes: the seam's
      # in-module test is `#[cfg(not(all(lean_lib_present, dregg_..._present)))]`, so shipping the
      # export removes the seam's only test, and these assert AVAILABILITY rather than skipping on
      # it. Between the pair one always runs — except that this half ran nowhere.
      # They belong here rather than in an allowlist because THIS is the job that fetches the
      # archive; the alternative arming site (`scripts/test-poa.sh`, via path-of-angels.yml) is
      # `workflow_dispatch`-only on a self-hosted runner, i.e. armed by a human or not at all.
      # ⚠ AND SAY THE STANDING STATE OUT LOUD: this step is currently UNREACHED, because the
      # seed fetch above 404s (`no asset named libdregg_lean-Linux-x86_64-v4.30.0-<key>.a.zst on
      # release 'lean-seed'` — every push, see this job's log). Arming them here is the honest
      # answer to "can any invocation run this target", and the seed pipeline is a separate,
      # separately-red leg that names its own cause. It is not a way to make this one quiet: the
      # floor below is raised to match, so a run that reaches this step and does NOT execute all
      # of them fails.
      # ⚑ TWO MORE, AND THEY WERE DARK FOR A REASON THE LIST ABOVE ALREADY NAMES (2026-08-10).
      # `poa_signal_judge_probe` and `poa_network_genesis_probe` are the same class as the six
      # armed on 08-08 — whole-file `#![cfg(feature = "lean-lib")]` over a real `@[export]` — and
      # they were the only two of the eight NOT added, because `check-never-run-targets.py` sees
      # `scripts/test-poa.sh:112,117` naming them and scores them run. It is right about the text
      # and wrong about the reachability: the only workflow that calls that script is
      # `path-of-angels.yml`, which is `workflow_dispatch:` on a self-hosted runner. That gate has
      # no `push`, no `pull_request` and no `schedule` trigger, so "some invocation names it" and
      # "any automatic run executes it" are different facts and only the first one is measured.
      # The cost of the mistake is on the record: `poa_signal_judge_probe`'s two assertions have
      # been panicking since `059f62db3` re-emitted the fixture without its trailing newline on
      # 08-09, and nothing said so for a day.
      - name: Lean runtime probes nothing else builds (12 probes + the Linux twin)
        if: steps.pin.outputs.armed == '1'
        run: |
          # `set +e` is load-bearing: GitHub runs `run:` under `bash -eo pipefail`, so
          # without it a failing probe aborts the step and the assertion-count floor below
          # — the only thing that can tell "the probes ran" from "the probes compiled
          # away" — becomes unreachable code.
          set +e
          set -uo pipefail
          cargo test -p dregg-lean-ffi --features lean-lib \
            --test handler_cutover_probe \
            --test deployed_constraint_probe \
            --test multiway_tug_oracle_probe \
            --test embeddable_runtime_probe_linux \
            --test poa_dark_bazaar_judge_probe \
            --test poa_records_probe \
            --test poa_signal_feedback_probe \
            --test poa_slot_derive_probe \
            --test poa_station_daily_probe \
            --test trustline_step_oracle_probe \
            --test poa_signal_judge_probe \
            --test poa_network_genesis_probe \
            -- --nocapture 2>&1 | tee lean-probes.log
          status=${PIPESTATUS[0]}
          ran=$(sed -nE 's/^test result:.* ([0-9]+) passed; ([0-9]+) failed.*/\1 \2/p' lean-probes.log \
                 | awk '{s+=$1+$2} END {print s+0}')
          echo "lean runtime probes: $ran assertion(s) executed."
          # RE-MEASURED FROM THE SOURCES 2026-08-08 (`grep -c '^#\[test\]'` per file, and every
          # `#[test]` in all ten is unconditional once `lean-lib` is on — the only `#[cfg]`
          # occurrences in these files are inside doc comments):
          #   deployed_constraint_probe 10 · multiway_tug_oracle_probe 8 · handler_cutover_probe 1
          #   embeddable_runtime_probe_linux 1 (Linux only) · poa_dark_bazaar_judge_probe 3
          #   poa_records_probe 3 · poa_signal_feedback_probe 8 · poa_slot_derive_probe 3
          #   poa_station_daily_probe 6 · trustline_step_oracle_probe 5
          #   poa_signal_judge_probe 2 · poa_network_genesis_probe 3 (added 2026-08-10) = 53
          # ⚠ THE OLD FLOOR OF 18 WAS ALREADY STALE BEFORE THE SIX ARRIVED: it was measured on
          # 2026-07-25 with `deployed_constraint_probe` at 8, and that file now carries 10. A
          # floor that drifts DOWN from the population it floors stops being a floor, so it is
          # re-derived here rather than nudged.
          if [ "$ran" -lt 53 ]; then
            echo "::error::only $ran probe assertion(s) ran, below the measured floor of 53."
            echo "::error::These probes report \`ok. 0 passed\` when their cfg is off, so a green"
            echo "::error::exit code here means nothing on its own. Either \`lean-lib\` did not"
            echo "::error::activate, or a whole-file cfg (platform!) emptied a probe. Do NOT lower"
            echo "::error::this floor to clear it — that is how the macOS-only probe went unnoticed."
            exit 1
          fi
          exit "$status"

  mina-attestation:
    name: Mina↔dregg Poseidon attestation zkApp (runs it, and proves the gate can go red)
    # ⚑ SLOW LANE — see the `schedule:` block at the top of this file. Skipped on a push to
    # main (92-second commit cadence vs a 107-minute job); runs nightly, on a PR, and on demand.
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # `bridge/mina-zkapp/` was in ZERO targets — no workflow, no gate script, no npm
    # workspace — and what was committed did not run (`tsc` failed; the PoC that was
    # reported working had run in a scratch dir at an unpinned o1js). This job runs it
    # from the committed TypeScript: 9 Mina-Poseidon gold digests + the depth-2 Merkle
    # root + the field modulus against the Rust probe's pinned table, a real Pickles
    # compile/prove/verify of an in-circuit Merkle path into that root, two tamper
    # rejections, the `DreggAttestedGate` zkApp deploying on a local chain and
    # consuming the attestation proof recursively, the ANCHOR on `setDreggRoot` (its
    # PROOF OBLIGATION, that the obligation refuses a root with no BabyBear vouch in
    # it, and the polarities of the PLACEHOLDER key that is still the only thing making
    # the anchor unforgeable), and a well-formed proof of another statement failing
    # VERIFICATION (with the identical bytes accepted on their own account update as
    # the control). Then the self-test injects THIRTY-EIGHT faults into a scratch copy
    # and requires each to turn it red.
    #
    # ⚑ Since 2026-07-28 it also runs FOUR RATCHETED MEASUREMENTS against the deployed
    # p3 objects: RUNG 1, a Poseidon2-BabyBear Merkle opening (2,677 rows/level; 58,971
    # for the deployed depth 22); RUNG 2, one FRI query at the deployed geometry
    # (684,726 rows); RUNG 3, the whole Fiat-Shamir transcript (62,637 rows, 23
    # permutations) KAT'd against `p3_challenger::DuplexChallenger` — which is what
    # makes the query indices DERIVED rather than witnessed, and therefore what makes
    # rung 2 a FRI check rather than an existential; and RUNG 4, the 16-layer commit
    # phase as one chain (623,310 rows) KAT'd against p3's own 16-round chain. Rung 2
    # builds a 684k-row constraint system and three ZkPrograms compile, which is why
    # the node heap is raised in the npm scripts and this job's timeout is 120 min.
    #
    # ⚑ Rung 4 found a real defect the moment it existed: the coset descent took the
    # index bit that chose the SLOT where `verify_query` takes the next one. It is
    # right whenever two consecutive index bits agree — on ~half of any chain's rounds
    # and on 100% of the all-zero index every row measurement uses — and the
    # single-round descent check, made deterministic and both-polarity the day before,
    # stayed green through it. Composition needs its own referent. A self-test fault
    # puts it back.
    #
    # ⚑ CARGO IS NOW REQUIRED and the gate FAILS without it. The Rust leg is the
    # DREGG SIDE of this bridge — `circuit-prove/sketches/mina-pasta-hash-probe`, the
    # crate that EMITS the attested root. It was in no target of any kind: its five
    # tests ran only by hand, and the `merkle` subcommand that produces the deployed
    # root ran only inside the ungated `npm run devnet:emit-root`. The probe is its own
    # workspace (`[workspace]` in its Cargo.toml), so no other job reaches it either.
    # It has git dependencies on o1-labs/proof-systems, so this job fetches; RUSTUP_TOOLCHAIN
    # from dtolnay/rust-toolchain overrides the crate directory's inherited pin, as
    # everywhere else here. ~13 min for the headline run; the self-test is much
    # longer (38 faults, several of them re-running the Rung-2/4 measurements). No Lean.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: nightly-2026-06-21
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: circuit-prove/sketches/mina-pasta-hash-probe
      # ⚑ TIERED 2026-07-30. The gate's default is now TIER 0 — out-of-circuit
      # differentials, the recorded-figure census, the npm-coverage check and the
      # injection pre-flight, ~25s, NOTHING COMPILING A CIRCUIT. This job is the
      # SLOW LANE and it already runs nightly, so it takes the full ladder: tier
      # 2 is the old headline and the self-test is the injection suite. A run
      # here is therefore strictly MORE than what it ran before (tier 0 adds
      # three legs that were in no gate at all), not less.
      - run: bash scripts/check-mina-npm-coverage.sh
      - run: bash scripts/check-mina-npm-coverage.sh --self-test
      - run: bash scripts/check-mina-attestation.sh --tier 2
      - run: bash scripts/check-mina-attestation.sh --self-test

  metatheory-no-sorry:
    name: Metatheory zero-sorry guard
    # ⚑ SLOW LANE — see the `schedule:` block at the top of this file. Skipped on a push to
    # main (92-second commit cadence vs a 330-minute job); runs nightly, on a PR, and on demand.
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 330
    # Pin the Lean toolchain via metatheory/lean-toolchain (leanprover/lean4:v4.30.0).
    # mathlib is a PORTABLE `git`+`rev` require (metatheory/lakefile.toml) that lake resolves
    # into `metatheory/.lake/packages/mathlib`; scripts/ci-mathlib-cache.sh pulls mathlib's
    # PREBUILT oleans into that same tree, so this job compiles the dregg2 corpus and never
    # mathlib itself. MATHLIB_REV is not decoration: the script FAILS if it disagrees with the
    # rev in the lakefile.
    env:
      MATHLIB_REV: 1c2b90b13009c65b090d95a83c98e248deafb6f1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        # NO `lfs: true` (2026-07-29): this job never reads circuit/descriptors/*staged*.tsv.
        # lake/Lean only. The staged TSVs are named in metatheory/Emit*.lean COMMENTS as emit TARGETS; no Lean module reads one, and no script this job runs (axiom-hygiene-guard.sh, ci-mathlib-cache.sh, floor_ratchet_check.sh, cone_cutover_textual_check.sh, dregg-multiway-tug/program/regen.sh) mentions circuit/descriptors at all.
        # The LFS allowance is the repo's only real Actions bill and it is EXHAUSTED; a job
        # that pulls 22.5 MB it never opens is pure bill. See the LFS block at the top.

      # Install elan + the toolchain named in metatheory/lean-toolchain.
      - name: Install elan (Lean toolchain manager)
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            -o elan-init.sh
          bash elan-init.sh -y --default-toolchain "$(cat metatheory/lean-toolchain)"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      # ⚑ THE PREBUILT MATHLIB, IN THE DIRECTORY LAKE ACTUALLY READS (fixed 2026-07-25).
      #
      # This step used to clone mathlib to `$GITHUB_WORKSPACE/../../src/mathlib4`
      # (= /home/runner/work/src/mathlib4) and run `lake exe cache get` THERE — correct while the
      # lakefile pinned `path = "../../../src/mathlib4"`, which resolved to exactly that dir.
      # `4ccee5bd71` (2026-07-05) made the require portable `git`+`rev`; lake resolves that into
      # `metatheory/.lake/packages/mathlib` and CLONES MATHLIB ITSELF (visible in this job's own
      # captured build log: "info: mathlib: cloning https://github.com/leanprover-community/
      # mathlib4"). So the 8463-olean download landed in a directory NOTHING READ and lake
      # recompiled the mathlib subset from source on every run. That commit fixed
      # scripts/bootstrap.sh for the new pin and did not touch this file; the waste ran 20 days.
      #
      # MEASURED at the boundary — this job's "Zero-sorry guard" step, GitHub step timings:
      #   five runs before the pin  20.9 / 23.6 / 21.9 / 21.1 / 31.0 min
      #   the pin commit's own run  115.1 min   ← 4ccee5bd71, which touched NO Lean proof
      #   the next day              106.1 / 102.2 / 99.4 / 106.4 / 111.3 min
      # ~84 min per Lean job, against a 330-min step timeout this job has already been killed by.
      #
      # The script runs `cache get` FROM `metatheory/`, so LAKE picks the location and no path is
      # restated here to drift again; and it FAILS on an absent/partial cache or a wrong rev
      # rather than falling through to the from-source compile. All SIX Lean provisioning sites
      # in the repo call this ONE script — this job, metatheory-pq-apex, descriptor-drift,
      # proof-integrity-canary.yml, and both starbridge-v2-installers.yml lanes (whose copies
      # were not merely slow but HARD-RED: they sed'd for the deleted `path = "…"` line) — so no
      # lane can provision differently again.
      - name: Fetch pinned mathlib4 (prebuilt oleans into metatheory/.lake/packages/mathlib)
        id: mathlib
        run: bash scripts/ci-mathlib-cache.sh

      # ══════════════════════════════════════════════════════════════════════════════════════
      # ⚑ SEVEN INDEPENDENT GATES, SEVEN INDEPENDENT VERDICTS (2026-08-08).
      #
      # The seven steps below — zero-sorry, crypto linking seam, cone-cutover post-state,
      # refuted-floor ratchet, the Claims axiom ledger, the orphan gate and the tug artifact
      # drift gate — check SEVEN DIFFERENT THINGS. GitHub Actions stops a job at the first
      # FAILED step, so until now the first of them to bite silenced the other six and this
      # job's red said "zero-sorry" while saying NOTHING about the axiom ledger, the ratchet,
      # the orphans or the deployed tug referee.
      #
      # This is the SAME defect `clippy-correctness` above was repaired for on 2026-08-03,
      # at more than twice the blast radius (three steps there, seven here) — and it is the
      # repo's own recorded lesson from the wasm job: A GATE BEHIND A RED GATE IS NOT A GATE.
      # Measured there: 31 of 34 runs `skipped`, and a real widening went dark for ~11 hours.
      #
      # WHAT THE CONDITION IS, AND WHY IT IS NOT A BARE `!cancelled()`. These seven need
      # `lake` and the pinned mathlib oleans; they do NOT need each other. So the condition
      # is `the PROVISIONING succeeded`, not `the previous gate succeeded`. Without the
      # `steps.mathlib` clause a failed cache fetch would send all seven into a from-source
      # mathlib compile against a 330-minute timeout this job has already been killed by —
      # seven false reds and no verdict, which is worse than the silence it replaces.
      # `!cancelled()` is still required: supplying ANY `if:` drops the implicit `success()`,
      # and without it these would also run while the job is being torn down.
      # ══════════════════════════════════════════════════════════════════════════════════════

      # The guard itself: build the corpus and FAIL on ANY `declaration uses
      # \`sorry\`` warning (covers sorry/admit/sorryAx, since admit & sorryAx
      # emit the same warning). See scripts/axiom-hygiene-guard.sh for the
      # two-layer design (this textual net + the Claims.lean #assert_axioms
      # ledger). The corpus must remain at ZERO sorry forever.
      - name: Zero-sorry guard
        if: ${{ !cancelled() && steps.mathlib.outcome == 'success' }}
        run: bash scripts/axiom-hygiene-guard.sh

      # CRYPTO LINKING-SEAM GAUNTLET (2026-07-17, CI-meaningfulness audit).
      # `Dregg2.Crypto.CryptoVerifyAll` is the aggregator for the from-scratch PQ
      # linking chain. The ML-DSA `SignCoreSpec` (sign =spec), ML-KEM `EncapsCoreSpec`
      # (encaps =spec), and the `AcvpKats` NIST-ACVP-style native_decide KAT batch are
      # imported by NOTHING ELSE in the corpus (verified: `grep -rl import` finds only
      # CryptoVerifyAll) and the module is DELIBERATELY outside the default `Dregg2.lean`
      # aggregator — its heavy KAT `native_decide` chain would bloat every default build.
      # Net effect before this step: NO CI job compiled these PQ floor proofs at all —
      # the sign/encaps `=spec` results and the empirical KAT floor were verified only
      # on a dev laptop, exactly the "green on ember's laptop" class. This runs LAST in
      # this job so it reuses the already-built+warm corpus above: only the incremental
      # crypto-gauntlet closure compiles here (the default corpus is cached from the
      # zero-sorry build). A red here is a rotted PQ floor proof, not infra flake.
      # Routed through axiom-hygiene-guard.sh (NOT a bare `lake build`) so the
      # SAME `declaration uses \`sorry\`` / sorryAx grep the zero-sorry step runs
      # is applied to this out-of-default module too. `sorry`/`admit` are Lean
      # WARNINGS (exit 0, no warningAsError in metatheory/lakefile.toml), so an
      # exit-code-only `lake build <module>` here would GREEN even with a sorry
      # in the module — this closes that hole and keeps the textual net uniform.
      #
      # ⚠ STALE AS OF 1905a9a97b, kept as belt-and-suspenders: that commit added
      # `import Dregg2.Crypto.CryptoVerifyAll` to metatheory/Dregg2.lean, so this
      # aggregator is now IN the default build and the zero-sorry step above already
      # compiled it. "NO CI job compiled these PQ floor proofs at all" was true when
      # written and is no longer. This step is now a warm no-op (0s) that re-applies the
      # same grep to the same modules; the cost of keeping it is nothing and it survives
      # the root losing that import again. Its target list is NOT the apex spine: the
      # five-module ML-DSA `VerifyCore{EqSpecW,UseHint,HashFrame,ArgRows,ArgAssembly}`
      # chain lives in the `metatheory-pq-apex` job below, for the reasons given there.
      - name: Crypto linking-seam gauntlet (SignCoreSpec/EncapsCoreSpec/AcvpKats — now root-reachable; kept as belt-and-suspenders)
        if: ${{ !cancelled() && steps.mathlib.outcome == 'success' }}
        env:
          AXIOM_GUARD_TARGETS: Dregg2.Crypto.CryptoVerifyAll
        run: bash scripts/axiom-hygiene-guard.sh

      # ⚑ THE CONE-CUTOVER TEXTUAL POST-STATE, FORCED FRESH (2026-07-25).
      #
      # `Tools/ConeCutover.assertPostState` verifies that a landed cutover still HOLDS in the
      # source: every pre-cutover fragment absent, every post-cutover fragment present, the retired
      # scaffolding file gone — and, uniquely, that `metatheory/Dregg2.lean` still IMPORTS the
      # cutover's teeth. No Lean module can check the latter from inside itself.
      #
      # It was written as a build-time check and COULD NOT STAND there: it reads the tree through
      # `IO.FS`, and lake's dependency graph is built from IMPORTS, so lake cannot see those reads
      # and replays the module from its cached olean forever. Measured 2026-07-25 on a tree whose
      # root had been truncated out from under the spec (`6b1e156bdf`, then `8a28420ec9`):
      #
      #     lake build Dregg2.Tools.ConeCutoverListCommit           EXIT=0   ← the cache answering
      #     lake env lean Dregg2/Tools/ConeCutoverListCommit.lean   EXIT=1   ← same bytes, fresh
      #       post-state VIOLATED (2): REGRESSED (old text back) / MISSING new text: Dregg2.lean
      #
      # i.e. it neither fired on a real regression nor was honestly green. The build-time tooth is
      # now SEMANTIC (over the environment, which lake DOES track); this step is where the textual
      # half runs, on a `lake env lean` that re-elaborates the file from source by construction.
      # COST: the corpus is already built by the zero-sorry step above, so this is seconds. The
      # script additionally requires the tool's own success line in the output — a run that
      # silently skipped the check fails here rather than passing.
      - name: Cone-cutover textual post-state (the Dregg2.lean WIRING check, no cache can answer it)
        if: ${{ !cancelled() && steps.mathlib.outcome == 'success' }}
        working-directory: metatheory
        run: bash scripts/cone_cutover_textual_check.sh

      # THE REFUTED-FLOOR ACCRUAL GATE, ARMED (2026-07-25).
      # `#floor_ratchet` (end of `metatheory/Dregg2.lean`) fails the build when a NEW declaration
      # takes a hypothesis that is PROVABLY FALSE at deployed BabyBear params — such a theorem is
      # VACUOUS. It reads the elaborated environment + a checked-in baseline through IMPORTS, so
      # lake re-runs it whenever any declaration changes; `lake build Dregg2` IS the gate. It was
      # verified by adversarial probe: 8 deliberate violations across all five evasion classes
      # (plain binder, RENAMED floor, prop-body def, structure field via both `.mk` and the
      # projection, and a section `variable` binder) each turned the build RED.
      #
      # This step exists for the ONE thing the Lean command structurally cannot do: notice that it
      # is GONE. A deleted command raises no error, and that is not hypothetical — `Dregg2.lean`
      # has been silently TRUNCATED twice (`6b1e156bdf` cut 1055+ imports; `8a28420ec9` cut it
      # 1301 -> 217), and this very campaign shipped SIX teeth that never ran because nothing
      # imported them. Until this step existed, `grep -rn floor_ratchet .github/` returned ZERO
      # hits: deleting one line would have disarmed the gate with no signal.
      # Baseline is a RATCHET — it may only ever go DOWN; raising it requires a visible edit.
      - name: Refuted-floor accrual gate (presence + canary + build — a gate that can vanish is not a gate)
        if: ${{ !cancelled() && steps.mathlib.outcome == 'success' }}
        working-directory: metatheory
        run: bash scripts/floor_ratchet_check.sh

      # THE CORPUS-WIDE AXIOM-HYGIENE LEDGER, ARMED (2026-07-17, wiring hunt round 2; counts
      # re-measured 2026-07-25).
      # `Dregg2/Claims.lean` is THE `#assert_axioms` net: 229 per-decl pins +
      # 51 `#assert_namespace_axioms` (~1500 theorems) that each FAIL THE BUILD unless
      # the pinned decl's full axiom set is {propext, Classical.choice, Quot.sound}. That is
      # 280 pins at this commit; the step name below carried "253" and the ledger has GROWN
      # past it (as did Claims.lean's own header, which still says "~190"). Re-count with
      # `grep -cE '^\s*#assert(_namespace)?_axioms' metatheory/Dregg2/Claims.lean` when editing.
      # Its own header calls it "the comprehensive, corpus-wide #assert_axioms net" and
      # names ~190 pins as "the UNIQUE location of those per-keystone kernel-clean
      # certifications" — and NOTHING BUILT IT. It is imported by zero modules (re-verified at
      # this commit: `grep -rl '^import Dregg2.Claims' metatheory` = 0 hits) and is not reachable from the
      # `Dregg2.lean` root, and the `Dregg2` lean_lib has NO globs (lakefile.toml) — so
      # `lake build` never touched it. scripts/axiom-hygiene-guard.sh's header describes a
      # "two-layer" guard whose layer (b) IS this ledger; layer (b) was running NOWHERE.
      # The textual layer (a) above catches a literal `sorry`; ONLY this layer catches a
      # TRANSITIVELY-INHERITED sorryAx or a keystone that silently grew a new axiom.
      #
      # COST: it imports ONLY the root `Dregg2` — already built by the zero-sorry step above
      # — so this elaborates the pins against a warm corpus and nothing else. Measured on a
      # warm tree: ~2m53s wall / ~90s CPU. A red here is a REAL axiom leak in a keystone the
      # corpus advertises as proved: read the named decl, do not delete the pin.
      - name: Corpus-wide axiom-hygiene ledger (Dregg2.Claims — 280 pins, imported by nothing)
        if: ${{ !cancelled() && steps.mathlib.outcome == 'success' }}
        working-directory: metatheory
        run: lake build Dregg2.Claims

      # THE ORPHAN GATE (2026-07-17, wiring hunt round 2; list re-measured 762df3d090, counts
      # reconciled 2026-07-25). The `Dregg2` lean_lib has NO `globs` (metatheory/lakefile.toml),
      # so `lake build` compiles `Dregg2.lean` + its transitive imports ONLY. Modules under
      # metatheory/Dregg2/** that are NOT reachable from that root, NOT named by any CI step, and
      # NOT pulled in by the descriptor-drift gate's emitters are compiled by NOTHING. Same hole
      # class as CryptoVerifyAll above; this is its siblings.
      #
      # THE LIST IS 47, and the number in the step name below is the number of entries — keep
      # them equal when you edit either. It got there by measurement, not by growth:
      # `762df3d090` re-checked the 78 names this block carried (under a step name that said
      # "76") and found 31 of them REACHABLE from the Dregg2 root — the default build already
      # compiled those, so naming them here asserted coverage that was simply the zero-sorry
      # step's — plus 25 stale names that no longer exist. Spot-checked again at this commit
      # (import-closure walk from metatheory/Dregg2.lean): Bridge.LightClientEth,
      # Bridge.ProofOfHoldings, Circuit.AlgoStarkSoundFanoutMemFree and Circuit.AcceptanceDischarge
      # are all REACHABLE now, which is why they are absent below and why the bullets that used
      # to advertise "Bridge/* — the light clients" and "Circuit/AlgoStarkSound*, Fri* — the
      # STARK/FRI soundness tower" are gone: that content moved into the default build.
      #
      # ⚑ 47 -> 42 (2026-07-25, B5). Five entries left this list because they got ROOTED into
      # metatheory/Dregg2.lean: Circuit.{FinBindsKernel,FinInjectivityCollapse,
      # KernelConfigSoundness,KernelConfigSoundnessAvail} and Circuit.Emit.
      # MembershipDepthGeneralRung2. They were the exact shape this block's own header warns
      # about — named here, so COMPILED and sorry-grepped by CI, while sitting outside the
      # `Dregg2.lean` closure that `#floor_ratchet` reads. Between them they carried 51
      # refuted-floor mentions that no census, no baseline and no ratchet counted: compiled is
      # not counted. Now that they are in the default build, naming them here would assert
      # coverage that is simply the zero-sorry step's. The standing gate for that distinction is
      # the `ratchet-darkness` job above.
      #
      # WHAT THE 42 ACTUALLY ARE (counted from the list, this commit):
      #   ⚑ 42 -> 39 in the same commit, second pass: `Circuit.Fri{CorrelatedAgreementSharp,
      #   LdtJohnsonList,ProximityGapListDecoding,ProximityGapWitness}` became ROOT-REACHABLE as
      #   transitive imports of `Dregg2.Circuit.FriIncidenceDesign`, which B5b rooted. By this
      #   block's own rule they must leave: naming a reachable module here asserts coverage that is
      #   simply the zero-sorry step's. (One entry, `Games.MultiwayTugProgram`, arrived from another
      #   lane in the same window and is counted in the 39.)
      #
      #   * 30 Circuit/*   — 25 Circuit/Emit/{*Refine,*Rung2,*Emit} (the emit refinement ladder)
      #                      plus 5 Circuit/{FriVerifierOracle,PresentationBindingFromFold,
      #                      RotatedKernelRefinementAvailWideNarrow,WrapSafetyStaticAnalyzer,
      #                      CustomLeafEncoding}.
      #   * 4 Games/*      — AutomataflAir, MultiwayTug, MultiwayTugAir, MultiwayTugProgram (the DEPLOYED games'
      #                      move-legality proofs).
      #   * 3 Verify/LoadBearing* — the @[load_bearing] linter. NOTE: proof-integrity-canary.yml's
      #                      header claims this linter "runs every push in ci.yml's
      #                      metatheory-no-sorry job". That was FALSE — it ran only inside the
      #                      DAILY canary (LoadBearingAuditBroad is a mutation target), and
      #                      LoadBearingAuditKey ran nowhere at all. This step makes the
      #                      canary's claim TRUE.
      #   * Bridge.HoldingWeightedTally + Apps.ColonistJob — the two singletons.
      #
      # ⚠ THIS STEP IS NOT THE COVERAGE LEDGER — the `lean-orphans` job is (it walks the whole
      # tree and reds on any Dregg2 module that is neither reachable nor allowlisted). Measured
      # at this commit by scripts/check-lean-orphans.sh: 1798 Dregg2/**.lean files, 1694
      # reachable, 104 orphan (74 allowlisted, 30 UNLISTED) — i.e. that job is RED at HEAD and
      # this list does not and cannot cover for it. Modules that are RED rather than merely dark
      # (the Circuit.*Proto de-risk prototypes, the drifted Emit refinements) are DELIBERATELY
      # absent here: fix the module, then add its name.
      #
      # COST: every module here is a LEAF on the corpus the zero-sorry step already built, so
      # this runs last and reuses that warm build. The only wall-clock measurement taken was on
      # the 76-name list of 2026-07-17 (~7 min; its 18 non-Circuit entries 32s warm) — with 47
      # names that stands only as an UPPER BOUND, not as this step's current cost.
      # A red here is a rotted proof, not infra flake. Routed through axiom-hygiene-guard.sh
      # (NOT a bare `lake build`) so the SAME `declaration uses \`sorry\`` / sorryAx grep runs on
      # all 47. `sorry`/`admit` are WARNINGS (exit 0, no warningAsError in
      # metatheory/lakefile.toml), so an exit-code-only `lake build <list>` would GREEN even with
      # a sorry in any of them. The folded AXIOM_GUARD_TARGETS becomes the space-separated build
      # list; the guard applies the identical textual net, closing the coverage hole.
      - name: Orphan gate (39 modules reachable from no CI target — the CryptoVerifyAll siblings)
        if: ${{ !cancelled() && steps.mathlib.outcome == 'success' }}
        env:
          AXIOM_GUARD_TARGETS: >-
            Dregg2.Apps.ColonistJob
            Dregg2.Bridge.HoldingWeightedTally
            Dregg2.Circuit.CustomLeafEncoding
            Dregg2.Circuit.Emit.AdjacencyMembershipRefine
            Dregg2.Circuit.Emit.AdjacencyMembershipRefineAudit
            Dregg2.Circuit.Emit.AdjacencyMembershipRung2
            Dregg2.Circuit.Emit.AvailWideMembersNarrow
            Dregg2.Circuit.Emit.BoundPresentationRefine
            Dregg2.Circuit.Emit.BoundPresentationRung2
            Dregg2.Circuit.Emit.CommittedThresholdEmit
            Dregg2.Circuit.Emit.CommittedThresholdRefine
            Dregg2.Circuit.Emit.DerivationRefine
            Dregg2.Circuit.Emit.DfaRoutingGeneralEmit
            Dregg2.Circuit.Emit.DfaRoutingRefine
            Dregg2.Circuit.Emit.DfaRoutingRung2
            Dregg2.Circuit.Emit.EffectActionBindingEmit
            Dregg2.Circuit.Emit.EffectActionBindingRefine
            Dregg2.Circuit.Emit.EffectVmEmitIvcStateTransition
            Dregg2.Circuit.Emit.EffectVmEmitIvcStateTransitionRefine
            Dregg2.Circuit.Emit.EffectVmEmitIvcStateTransitionRung2
            Dregg2.Circuit.Emit.EffectVmEmitIvcStateTransitionRung2Full
            Dregg2.Circuit.Emit.EmitGraduate
            Dregg2.Circuit.Emit.FoldEmit
            Dregg2.Circuit.Emit.FoldRefine
            Dregg2.Circuit.Emit.FoldRung2
            Dregg2.Circuit.Emit.MembershipAuthRootEdge
            Dregg2.Circuit.Emit.MultiStepChainEmit
            Dregg2.Circuit.Emit.RotatedLayoutBridge
            Dregg2.Circuit.FriVerifierOracle
            Dregg2.Circuit.PresentationBindingFromFold
            Dregg2.Circuit.RotatedKernelRefinementAvailWideNarrow
            Dregg2.Circuit.WrapSafetyStaticAnalyzer
            Dregg2.Games.AutomataflAir
            Dregg2.Games.MultiwayTug
            Dregg2.Games.MultiwayTugAir
            Dregg2.Games.MultiwayTugProgram
            Dregg2.Verify.LoadBearingAuditBroad
            Dregg2.Verify.LoadBearingAuditKey
            Dregg2.Verify.LoadBearingLint
        run: bash scripts/axiom-hygiene-guard.sh

      # ⚑ THE TUG PROGRAM ARTIFACT DRIFT GATE (2026-07-25).
      #
      # `dregg-multiway-tug/program/multiway_tug_program.json` is a CACHE of the Lean emission
      # (`Dregg2.Games.MultiwayTugProgram :: multiwayTugProgram`), `include_str!`d into the crate
      # and LOADED as the deployed referee. `program/regen.sh --check` re-emits and diffs it.
      #
      # It ran NOWHERE until now — not in any workflow, not in the git hooks. That is exactly how
      # the file it guards ended up RED at HEAD: `372b79e375` widened `DInput` by five fields and
      # `MultiwayTugProgram.lean` stopped compiling, so `program_admits_legal_play_deployed` was
      # silently unproven and nothing went red, because NO CI TARGET COMPILED THE MODULE. The
      # module is now in AXIOM_GUARD_TARGETS above (which fixes the compile half); this step fixes
      # the artifact half. Without it a rules edit lands in Lean while the deployed JSON keeps
      # shipping the OLD teeth — a green build serving a different game than the one proved.
      #
      # Cheap by construction: the oleans are already built by the step above, so this is a
      # re-run of one emit plus a diff.
      - name: Tug program artifact matches its Lean source (drift gate)
        if: ${{ !cancelled() && steps.mathlib.outcome == 'success' }}
        run: bash dregg-multiway-tug/program/regen.sh --check

  # ── THE ML-DSA VERIFY-CORE APEX SPINE, IN ITS OWN LANE (2026-07-25) ─────────────────
  # `ebb0b9f9ae` rooted 16 never-compiled PQ modules into the default build with one import
  # (`Dregg2.Crypto.VerifyCoreArgAssembly`) and that rooting is RIGHT — 601 declarations, 453
  # theorems, zero sorryAx, 132 #assert_axioms that previously ran nowhere. Then it MEASURED
  # what it cost, and one module carries essentially all of it:
  #
  #     VerifyCoreEqSpecW   2664s = 44.4 min, exit 0   ← INTRINSIC, not contention
  #                                                      (degree-256 `AdjoinRoot` power basis,
  #                                                       `maxRecDepth 8000`)
  #     the whole Keccak/FIPS-202 stack   ~160s (9-52s each)
  #     VerifyCoreEqSpec 27s · NttFaithful 181s · Fips204BitPack 33s
  #
  # And `EqSpecW` is NOT a leaf: the chain is Spec → EqSpec → EqSpecW → UseHint → HashFrame →
  # ArgRows → ArgAssembly, one linear import spine, so four more modules SERIALIZE behind it and
  # no amount of runner parallelism hides it. Measured fresh here on 07-25 (contended box,
  # `lake env lean`, LEAN_NUM_THREADS=3): ArgAssembly 54s, ArgRows 496s, HashFrame 37s.
  #
  # WHY IT HAD TO MOVE, in CI's own numbers rather than a laptop's. The `metatheory-no-sorry`
  # job's "Zero-sorry guard" step is the verdict people actually read, and it is AT ITS OWN
  # TIMEOUT WALL:
  #     run 30148956262   Zero-sorry step 233 min      (job 279 min)
  #     run 30146325284   Zero-sorry step 315.6 min    (job killed at 335 min vs timeout 330)
  # 46 serial minutes is 15-20% of a step that has already been cancelled for length once. A
  # gate nobody waits for is on its way to being a gate nobody believes.
  #
  # WHY A PUSH-TRIGGERED JOB AND NOT A SCHEDULED "SLOW LANE" — the recommendation this deviates
  # from, with the number that justifies the deviation: `lake build
  # Dregg2.Crypto.VerifyCoreArgAssembly` compiles a **34-module in-tree closure**, not the
  # 1788-module corpus. Set-subtracting `Fips204ChallengeHash`'s closure (the 29 cheap modules
  # the default build keeps) leaves EXACTLY the five spine modules. So this lane is ~1h, not
  # ~5h, and it does not need a schedule to be affordable. That matters for coverage, not
  # tidiness: a nightly lane detects a regression up to 24h late and — as
  # proof-integrity-canary.yml's own header records, after its ⛔ lines sat unread in a
  # scheduled log for three days — needs a page-on-red job wired to it before anyone sees a
  # thing. This job is a CHECK on every run's checks page instead, next to the other Lean
  # gates, so its verdict arrives with the commit that caused it and needs no notification
  # machinery to reach a human. (lean-seed.yml, the repo's other long Lean lane, is scheduled
  # AND has no notify job — do not add a third of those.)
  #
  # Routed through axiom-hygiene-guard.sh, never a bare `lake build`: `sorry`/`admit` are Lean
  # WARNINGS (exit 0, no warningAsError in metatheory/lakefile.toml), so an exit-code-only step
  # would green with a sorry in the apex refinement. Same net as every other Lean job here.
  #
  # A RED HERE IS THE ML-DSA-65 VERIFY-CORE REFINEMENT ROTTING — `verifyCore_eq_specVerifyB_
  # noArg_deployed`, the deployed `MlDsaVerifyReal.verifyCore` ⟺ FIPS-204 `specVerifyB` apex —
  # not infra flake. Do NOT "fix" it by dropping the target.
  metatheory-pq-apex:
    name: ML-DSA verify-core apex spine (the 44-min serial tail, off the critical path)
    # ⚑ SLOW LANE — see the `schedule:` block at the top of this file. Skipped on a push to
    # main (92-second commit cadence vs a 150-minute job); runs nightly, on a PR, and on demand.
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    # Generous but far below the corpus jobs' 330: the closure is 34 modules and the tail is
    # ~50 min of it. If this ever approaches 150, the spine grew a second expensive module —
    # measure it, do not raise the number.
    timeout-minutes: 150
    env:
      MATHLIB_REV: 1c2b90b13009c65b090d95a83c98e248deafb6f1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        # NO `lfs: true` (2026-07-29): this job never reads circuit/descriptors/*staged*.tsv.
        # lake/Lean only, same as metatheory-no-sorry.
        # The LFS allowance is the repo's only real Actions bill and it is EXHAUSTED; a job
        # that pulls 22.5 MB it never opens is pure bill. See the LFS block at the top.

      # Identical toolchain + mathlib setup to metatheory-no-sorry. That was originally a
      # deliberate verbatim COPY — "if that job's mathlib provisioning is wrong, this lane must
      # be wrong the SAME way rather than differ in a way that hides it" — and it was indeed
      # wrong: see the ⚑ block on that job's fetch step. It is now the SAME SCRIPT rather than
      # the same text, so the two lanes cannot diverge at all.
      - name: Install elan (Lean toolchain manager)
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            -o elan-init.sh
          bash elan-init.sh -y --default-toolchain "$(cat metatheory/lean-toolchain)"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Fetch pinned mathlib4 (prebuilt oleans into metatheory/.lake/packages/mathlib)
        id: mathlib
        run: bash scripts/ci-mathlib-cache.sh

      # Same two-independent-verdicts condition as `metatheory-no-sorry` above, for the same
      # reason at a smaller blast radius: the apex spine and the two expensive orphans share
      # only their PROVISIONING. A red spine must not delete the orphans' verdict.
      # The five spine modules ride in as ArgAssembly's transitive imports; naming the apex
      # rather than the five keeps this target honest if the chain grows another rung.
      - name: The apex spine (VerifyCore{EqSpecW,UseHint,HashFrame,ArgRows,ArgAssembly})
        if: ${{ !cancelled() && steps.mathlib.outcome == 'success' }}
        env:
          AXIOM_GUARD_TARGETS: Dregg2.Crypto.VerifyCoreArgAssembly
        run: bash scripts/axiom-hygiene-guard.sh

      # ⚑ THE ML-KEM KEYGEN REFINEMENT, GIVEN A HOME (2026-07-25, B5 orphan sweep).
      # `Dregg2.Crypto.MlKemKeygenRefine` was an UNLISTED orphan: reachable from nothing, named by
      # no CI step, compiled by NO target at all — its `#assert_axioms` had never run anywhere.
      # It is GREEN (verified: fresh `lake env lean`, exit 0, no `sorry`), so the only question was
      # where to pay for it, and that was MEASURED rather than guessed: 1882s = 31 min on one fresh
      # elaboration, and a TIMEOUT at 2400s on another. That is the `VerifyCoreEqSpecW` situation
      # (44 min) this whole job exists for, so it goes HERE and not into the default build or the
      # `metatheory-no-sorry` Orphan-gate step — both of which run in a job that has already been
      # cancelled once for length (315.6 min against `timeout-minutes: 330`).
      # ⚠ WHAT THIS BUYS AND WHAT IT DOES NOT: compilation + the zero-sorry/axiom net. NOT ratchet
      # visibility — it stays outside `Dregg2.lean`'s closure, so `#floor_ratchet` still cannot see
      # its declarations. That is acceptable ONLY because it mentions ZERO refuted floors (measured,
      # comments stripped), and `scripts/check-ratchet-darkness.sh` RULE 1 turns red the moment that
      # stops being true. `Dregg2.Circuit.Emit.AutomataflNGenGolden` rides along for the same
      # reason with a different cost story: it is a 2.98 MB byte-pinned wire golden, and the
      # "separate leaf so the refinement surface does not pay for the golden" posture is already
      # the documented precedent in `Dregg2.lean`'s `ParamComposeGolden` line.
      - name: The two orphans too expensive for the default build (MlKemKeygenRefine 31 min, AutomataflNGenGolden 2.98 MB golden)
        if: ${{ !cancelled() && steps.mathlib.outcome == 'success' }}
        env:
          AXIOM_GUARD_TARGETS: >-
            Dregg2.Crypto.MlKemKeygenRefine
            Dregg2.Circuit.Emit.AutomataflNGenGolden
        run: bash scripts/axiom-hygiene-guard.sh

  # ══════════════════════════════════════════════════════════════════════════════════════
  # ⚑ THE GNARK LANE — `chain/gnark` was in NO WORKFLOW AT ALL until 2026-08-08.
  #
  # It is the only Go module in this repository (`chain/gnark/go.mod`, 174 tests) and it holds
  # the BN254 settlement wrap: the Lean-emitted R1CS templates under `chain/gnark/emitted/`,
  # the apex-VK governance pin the `SettlementCircuit` bakes, and the replay drivers that run
  # the Lean emissions against the real apex-shrink proof fixture. Nothing in
  # `.github/workflows/` mentioned `go`, `gnark` or `chain/` — measured by grep, 2026-08-08 —
  # so ALL of it was executed by nothing. When the fixture was re-minted at `94fc8e161` the
  # emitted twin went stale and EIGHT tests went red; that red sat in the tree unseen because
  # no lane could report it.
  #
  # ⚠ WHAT THIS JOB IS AND IS NOT — read before trusting a green here.
  #
  # A DIFFERENTIAL between two committed artifacts detects DISAGREEMENT, never STALENESS: a
  # self-consistent pair that HEAD does not produce, shifted identically in both files, is
  # GREEN. `TestApexPinFixtureMatchesDerivedDeployedIdentity` is exactly that shape — it
  # compares `fixtures/apex_shrink_fri_real.json` against `fixtures/apex_vk_identity.json`,
  # and both move together when someone re-mints them.
  #
  # So this lane is deliberately NOT the whole instrument. It carries the half that is cheap
  # and hosted-runnable — a `go build` + the full suite, with a FLOOR on what executed — and
  # the FRESHNESS half lives where the derivation actually is:
  #
  #   * `armed-teeth.yml` `dark-binding-teeth` runs
  #     `derive_deployed_apex_vk_identity_and_check_fixture` (route `armed-dark`,
  #     `.github/ignored-test-routes.txt`), which folds a FRESH apex at HEAD, asserts the
  #     governance-pinned `DREGG_APEX_RECURSION_VK` anchor, and asserts BOTH committed
  #     artifacts equal that derivation. That is the only thing in this tree that can see a
  #     stale-but-self-consistent pair, and it was routed `fixture-mint` (i.e. armed by
  #     nothing) until 2026-08-08 because it also REWROTE the artifact it checked.
  #   * `TestEmittedDescriptorShapeIsDerivedFromTheFixture` (this suite) re-derives the
  #     emitted descriptor's height classes / per-class widths / merkle depths FROM the
  #     fixture's own `input_rounds` and `fri` block rather than comparing two committed
  #     shape literals. It is what turns "the templates agree with each other" into "the
  #     templates agree with the proof they are supposed to open".
  #
  # If you add an artifact under `chain/gnark/emitted/`, add its derivation here — not a
  # second committed copy to diff it against.
  #
  # NO `lfs: true`: `git check-attr filter` reports `unspecified` for everything under
  # `chain/gnark/` (measured 2026-08-08). The LFS allowance is this repo's only real Actions
  # bill; see the LFS block at the top of this file.
  # ══════════════════════════════════════════════════════════════════════════════════════
  gnark:
    name: gnark settlement wrap (Go)
    # ⚑ SLOW LANE — see the `schedule:` block at the top of this file, and this is a MEASUREMENT,
    # not a guess. The full suite is **2399 s (40 min)**, measured 2026-08-08 on an M-series laptop
    # after the apex-shrink fixture's shape grew (FRI rounds 15 → 16, log-height 18 → 19). This
    # file's own header records that main's median inter-commit gap is **92 SECONDS**, so a
    # 40-minute job on a push trigger has ~26 copies of itself in flight at steady state; `main` is
    # deliberately NOT `cancel-in-progress`, so they queue rather than supersede and none reaches a
    # verdict. That is the exact pathology the header measured as "ZERO succeeded" over 60 runs.
    # So: nightly, on a PR, or on demand — never on a push to main. A per-push verdict that is
    # structurally unreachable is worth less than a nightly one a human reads.
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    # 90, not 45: the suite is 40 min on a laptop and a hosted 4-vCPU runner is slower. Raise this
    # with the measurement, never to make a timing red go away.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: chain/gnark/go.mod
          cache-dependency-path: chain/gnark/go.sum

      - name: go vet
        working-directory: chain/gnark
        run: go vet ./...

      - name: go test (whole module, with a floor on what actually ran)
        working-directory: chain/gnark
        run: |
          # ⚠ `set +e` is load-bearing, same argument as armed-teeth.yml's arming steps:
          # GitHub runs `run:` under `bash --noprofile --norc -eo pipefail`, so `-e` is
          # ALREADY ON and the floor check after a red `go test` would be unreachable code.
          set +e
          set -uo pipefail
          # THE FLOOR. `go test` exits 0 for a package whose filter matched nothing, and a
          # build-tag mistake that compiles away every test file reports `[no tests to run]`
          # and exits 0 too. Measured at HEAD 2026-08-08: `go test -list '.*' .` enumerates
          # 174 top-level tests. Floor at 150 to leave room for honest churn — RAISE it when
          # the suite grows; never lower it to make a red lane green.
          FLOOR_TESTS=150
          # ⚠ `-timeout` IS LOAD-BEARING AND THE DEFAULT IS NOT ENOUGH. Go's default is 10m for the
          # WHOLE binary, and it is a PANIC, not a failure: the run dies with a goroutine dump and
          # no per-test verdict for anything that had not finished. MEASURED 2026-08-08, right after
          # the apex-shrink fixture's shape moved (FRI rounds 15 → 16, log-height 18 → 19, wider
          # opened rows): `TestEmittedVerifierFullTranscriptLinkIsLoadBearing` alone took 9m21s and
          # tripped the 10m wall — `panic: test timed out after 10m0s`. Everything before it had
          # passed; the suite still reported FAIL. A wall-clock wall reported as a red is the worst
          # kind of red, because it looks like the code.
          # Raise this when a shape grows; the job's own `timeout-minutes` is the real budget.
          go test -timeout 70m -v ./... 2>&1 | tee gnark-test.log
          status=${PIPESTATUS[0]}
          ran=$(grep -cE '^(--- )?(PASS|FAIL): Test' gnark-test.log || true)
          echo "gnark: $ran top-level test result line(s) observed (floor $FLOOR_TESTS)."
          if [ "${ran:-0}" -lt "$FLOOR_TESTS" ]; then
            echo "::error::only ${ran:-0} gnark test(s) reported a result, below the floor of $FLOOR_TESTS."
            echo "::error::An exit code cannot tell 'the suite passed' from 'nothing was built'."
            exit 1
          fi
          exit "$status"

  descriptor-drift:
    name: Descriptor Lean↔JSON drift gate
    # ⚑ SLOW LANE — see the `schedule:` block at the top of this file. Skipped on a push to
    # main (92-second commit cadence vs a 330-minute job); runs nightly, on a PR, and on demand.
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 330
    # The circuit descriptor JSONs (circuit/descriptors/*.json) and their *_FP
    # sha256 constants are MACHINE-GENERATED from the verified Lean emit (the
    # source of truth). This gate regenerates them via scripts/emit-descriptors.sh
    # and fails if the result differs from what is checked in — catching the
    # Lean→JSON drift the in-Rust sha256 round-trip test cannot (a stale JSON whose
    # self-consistent FP passes the round-trip while the Lean emission has moved).
    # Same elan + pinned-mathlib setup as the zero-sorry job (it needs `lake`).
    env:
      MATHLIB_REV: 1c2b90b13009c65b090d95a83c98e248deafb6f1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          lfs: true

      # ══════════════════════════════════════════════════════════════════════════════════════
      # ⚑ THE TWO STATIC GATES RUN FIRST, AND THEY NEED NO LEAN (2026-08-08).
      #
      # This job carries THREE independent gates. Two of them — the provenance stamp and the
      # emit-gate weld — are python + git, take about five seconds between them, and touch
      # neither `lake` nor `cargo`. They used to sit at the BOTTOM, behind elan, behind a
      # mathlib cache fetch, behind a rustfmt install and behind a ~1h Lean re-derivation, so:
      #   * a failed `ci-mathlib-cache.sh` took both of them dark with it, and
      #   * a bite from the ~1h drift gate silenced the emit-gate weld entirely.
      # Neither depends on anything those steps establish. This is the wasm job's own recorded
      # rule — "A GATE BEHIND A RED GATE IS NOT A GATE ... ask whether it must precede this
      # one; the default answer is no" — applied to the two steps in this file that could
      # answer with no toolchain at all.
      #
      # `!cancelled()` on each so the three verdicts stay independent, and the Lean-dependent
      # one additionally requires its PROVISIONING (see the same block in metatheory-no-sorry).
      # ══════════════════════════════════════════════════════════════════════════════════════

      # ⚑ THE STAMP, before the ~1h re-derivation below. `--verify-provenance` checks every
      # committed descriptor byte against `circuit/descriptors/PROVENANCE.json` — and until
      # 2026-08-02 it was invoked by NO script, NO workflow and NO test: thirteen references in
      # the tree, every one of them prose. Measured at `ca0970378` with the row now in
      # `scripts/local-gates.sh`: EIGHT of the shared table AIRs did not match their stamped
      # sha256 and TWO (the Poseidon2 chip AIRs every descriptor's hash sites lower into) had no
      # stamp row at all. Ten of ten, in HEAD, nothing red.
      # `--rev HEAD` grades the COMMIT in a detached clean worktree rather than the checkout,
      # which is what makes it answerable at all in the shared dev tree (see the row's comment in
      # local-gates.sh). ~5s: python + git, no Lean, no cargo. Deliberately BEFORE the drift gate
      # — it is the cheap half of the same question.
      - name: Descriptor provenance stamp (bytes match the stamp)
        if: ${{ !cancelled() }}
        run: python3 scripts/emit_descriptors.py --verify-provenance --rev HEAD

      # The emit-gate CROSS-LANGUAGE weld: every GOLDEN_JSON literal in
      # circuit-prove/tests/*_emit_gate.rs must be byte-identical to a Lean
      # #guard pin or a drift-gated descriptor artifact. Each side's own gate
      # (the Lean #guard at lake-build time, the Rust assert at cargo-test time)
      # is blind to the PAIR drifting — this is the check that compares them.
      # Static (no lake/cargo), <1s. Found 3 committed drifted pairs on arrival
      # (fold/derivation/garbled-eval, 2026-07-16 — see TESTQALOG.md).
      - name: Emit-gate weld (Rust golden == Lean pin)
        if: ${{ !cancelled() }}
        run: python3 scripts/check-emit-gate-weld.py

      # ⚑ `!cancelled()` ON THE PROVISIONING, NOT ONLY ON THE GATES (2026-08-08, second pass).
      # The block above moved the two static gates in FRONT of these three steps and gave each
      # gate `!cancelled()` so their verdicts stay independent. It did not give the PROVISIONING
      # a condition, and a step with no `if:` defaults to `success()` — so a red from either
      # ~5-second python gate now SKIPPED elan, mathlib, rustfmt and, behind them, the only
      # descriptor gate in this repo that re-derives from Lean.
      #
      # That is not a hypothetical. MEASURED on run 31245338107, the 2026-08-08 nightly:
      # `Descriptor provenance stamp` exited 1 on a self-declared COVERAGE GAP
      # (verify_workflow_refs does not scan the new composite action), the emit-gate weld
      # exited 1 on a real drifted pair (`dregg-effectvm-transfer-v1`), and steps 5-8 all read
      # `skipped`. The drift gate did not run, on the one event class allowed to run it.
      #
      # The reorder cited this file's own rule — "A GATE BEHIND A RED GATE IS NOT A GATE ...
      # ask whether it must precede this one; the default answer is no" — and then re-created
      # exactly that shape for the expensive gate, pointing the other way. Nothing these three
      # steps establish depends on either static gate's verdict.
      - name: Install elan (Lean toolchain manager)
        if: ${{ !cancelled() }}
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            -o elan-init.sh
          bash elan-init.sh -y --default-toolchain "$(cat metatheory/lean-toolchain)"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      # Same shared provisioning script as the two metatheory jobs — see the ⚑ block on
      # metatheory-no-sorry's fetch step for what it replaced and what that cost.
      - name: Fetch pinned mathlib4 (prebuilt oleans into metatheory/.lake/packages/mathlib)
        id: mathlib
        if: ${{ !cancelled() }}
        run: bash scripts/ci-mathlib-cache.sh

      # The emit installs three WHOLE Lean-authored Rust modules
      # (circuit/src/effect_vm/*_generated.rs) and normalizes them through rustfmt, so the
      # generator's bytes equal what the pre-commit hook and `cargo fmt --all -- --check`
      # produce. Materialize the PINNED rustfmt up front: relying on the runner image's stable
      # rustfmt (or on rustup's implicit toolchain-file auto-install) would let a different
      # rustfmt decide the generated bytes, and this gate would then report a fake drift.
      - name: Install the pinned rustfmt (generated-Rust normalization)
        id: rustfmt
        if: ${{ !cancelled() }}
        run: |
          channel="$(grep -m1 '^channel' rust-toolchain.toml | cut -d'"' -f2)"
          rustup toolchain install "$channel" --profile minimal --component rustfmt
          rustfmt --version

      # Regenerates from Lean and `git diff --exit-code`s the descriptors + the
      # *_FP constants. On drift: prints the offending diff + the fix command and
      # exits nonzero. See docs/DESCRIPTOR-EMIT.md.
      # Both of its inputs are named in the condition: without the mathlib cache this
      # re-derivation compiles mathlib from source against a 330-minute timeout, and without
      # the PINNED rustfmt it reports a FAKE drift (the normalization is what the diff is
      # taken over) — so a green from either absence would be a lie in a different direction.
      - name: Descriptor drift gate
        if: ${{ !cancelled() && steps.mathlib.outcome == 'success' && steps.rustfmt.outcome == 'success' }}
        run: bash scripts/check-descriptor-drift.sh

  # ══════════════════════════════════════════════════════════════════════════════════════════
  # ⚑ THE ABSENCE OF A VERDICT IS NOT A PASS (2026-08-08).
  #
  # `descriptor-drift` is the ONLY gate in this repo that re-derives the 125 committed
  # `circuit/descriptors/by-name/*.json` from Lean and diffs. The other four compare an artifact
  # against a stamp sitting beside it and stay GREEN on a wholly stale set
  # (`scripts/check-descriptor-drift.sh:6-10` says so itself).
  #
  # MEASURED over every non-push run of this workflow, 2026-07-29 → 2026-08-08 (12 runs, the
  # complete set: `gh run list --workflow=ci.yml --event=schedule`), THE DRIFT STEP HAS NEVER
  # PRODUCED A VERDICT:
  #   07-29, 07-30, 07-31, 08-01, 08-03  static preflight aborted on a WORKFLOW-GHOST /
  #                                      LEAN-IMPORT-GHOST (a reference gap, not drift)
  #   08-04, 08-05                       the provenance stamp failed and the drift step was
  #                                      SKIPPED behind it (the same shape fixed above)
  #   08-02 (69 min), 08-06 (62 min)     the runner was SIGTERM'd mid-corpus-build — `##[error]
  #                                      The runner has received a shutdown signal`, exit 143, at
  #                                      module ~10,100 of ~10,300, i.e. ~98% done
  #   08-07                              CANCELLED at 37 min
  #   08-08                              SKIPPED (the defect fixed above)
  # and it is `if: github.event_name != 'push'`, so it never runs on a push either. Meanwhile
  # `metatheory/Dregg2/Circuit/Emit/` has taken 13 commits (37 files, +6248/-658) since the last
  # recorded re-emit (`docs/VK-REGEN-LOG.md`, f7bc7d351).
  #
  # Two of those eleven non-verdicts are `cancelled`, and NOTHING IN THIS REPO CAN SEE A
  # `cancelled`: every notifier in `.github/workflows/` tests `needs.<job>.result == 'failure'`
  # (armed-teeth:1076-1080, federation-node-{1,2,3}, intent-service, mirror-gates,
  # proof-integrity-canary), and a cancelled job's `result` is `cancelled`. So a gate killed
  # mid-run pages nobody and leaves a checks page with no red on it. `descriptor-drift` had no
  # notifier at all.
  #
  # This job is the missing distinction: it treats `cancelled` and `skipped` as WORSE than a red,
  # because a red is a verdict and those are the absence of one. It carries the same
  # `!= 'push'` guard as the gate itself, so the deliberate push-skip is not reported as darkness.
  # ══════════════════════════════════════════════════════════════════════════════════════════
  descriptor-drift-verdict:
    name: The descriptor drift gate produced a VERDICT
    needs: [descriptor-drift]
    if: ${{ always() && github.event_name != 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Classify — a verdict, a red verdict, or no verdict at all
        id: classify
        env:
          RESULT: ${{ needs.descriptor-drift.result }}
        run: |
          set -euo pipefail
          case "$RESULT" in
            success)
              echo "descriptor-drift produced a verdict and it is GREEN."
              echo "page=0" >> "$GITHUB_OUTPUT"; exit 0 ;;
            failure)
              echo "kind=RED VERDICT" >> "$GITHUB_OUTPUT"
              echo "page=1" >> "$GITHUB_OUTPUT"
              echo "::error::descriptor-drift is RED. That is a VERDICT — the Lean emission and the checked-in circuit/descriptors/ disagree, or a static leg found a reference gap. Read the job log for which. Fix per docs/VK-REGEN-CONTROLS.md; do NOT re-stamp by hand."
              exit 1 ;;
            cancelled|skipped|'')
              echo "kind=NO VERDICT ($RESULT)" >> "$GITHUB_OUTPUT"
              echo "page=1" >> "$GITHUB_OUTPUT"
              echo "::error::descriptor-drift produced NO VERDICT (result='$RESULT'). This is not a pass and it is not a red: the only gate that re-derives the deployed descriptor bytes from Lean did not answer. A cancelled or skipped job matches no 'result == failure' notifier in this repo, so without this step it is completely silent. Re-run with 'gh workflow run ci.yml', or run it locally: scripts/check-descriptor-drift.sh --rev HEAD."
              exit 1 ;;
            *)
              echo "kind=UNKNOWN ($RESULT)" >> "$GITHUB_OUTPUT"
              echo "page=1" >> "$GITHUB_OUTPUT"
              echo "::error::descriptor-drift returned an unrecognised result '$RESULT'. Refusing to read it as a pass."
              exit 1 ;;
          esac

      # A red on a nightly is read by nobody — mirror-gates' own page-on-red block makes that
      # argument and it applies here with more force, because this gate's nightly is its ONLY
      # trigger. `pull_request` is excluded: the author already sees the check, and a fork PR
      # has no issues:write token.
      - name: Page a human (standing issue)
        if: ${{ always() && steps.classify.outputs.page == '1' && github.event_name != 'pull_request' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
          KIND: ${{ steps.classify.outputs.kind }}
          RESULT: ${{ needs.descriptor-drift.result }}
        run: |
          set -euo pipefail
          TITLE='descriptor-drift: the Lean<->JSON re-derivation is not reaching a verdict'
          {
            printf '%s\n\n' "**${KIND}** — \`descriptor-drift\` result \`${RESULT}\` at \`${SHA}\`: ${RUN_URL}"
            printf '%s\n' 'This is the only gate that RE-DERIVES `circuit/descriptors/**` from the Lean emitters.'
            printf '%s\n' 'The four sibling gates compare a committed artifact against a stamp committed beside it,'
            printf '%s\n\n' 'so they stay GREEN on a wholly stale set.'
            printf '%s\n' '- `NO VERDICT (cancelled|skipped)` — the gate did not answer. Not a pass. Every other'
            printf '%s\n' '  notifier in this repo tests `result == '"'"'failure'"'"'` and cannot see this state.'
            printf '%s\n\n' '- `RED VERDICT` — it answered, and the answer is drift or a reference gap.'
            printf '%s\n' 'Run it yourself (no CI needed): `scripts/check-descriptor-drift.sh --rev HEAD`.'
            printf '%s\n' 'It needs `lake`, the PINNED rustfmt from `rust-toolchain.toml`, and about an hour of'
            printf '%s\n' 'Lean; a 4-vCPU hosted runner has twice failed to hold that build to completion.'
          } > /tmp/body.md
          EXISTING="$(gh issue list --state open --search "${TITLE} in:title" --json number --jq '.[0].number // empty')"
          if [ -n "${EXISTING}" ]; then
            gh issue comment "${EXISTING}" --body-file /tmp/body.md
            echo "refreshed existing issue #${EXISTING}"
          else
            gh issue create --title "${TITLE}" --body-file /tmp/body.md
          fi
