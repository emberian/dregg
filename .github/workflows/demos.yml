name: Run demos and publish results

# Produces site/demos/results.json as an artifact for pages.yml to consume.
# This workflow no longer deploys to GitHub Pages directly — pages.yml owns
# the single deploy path, triggered on completion of this workflow.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: demos
  cancel-in-progress: false

jobs:
  run-demos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          lfs: true   # include_str!'d staged registries live in LFS (.gitattributes)

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: nightly-2026-01-01

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true

      # `--examples` is the gate that `demo-agent/examples/` never had.
      #
      # Without it this step built only the lib+bins, and the run loop below only ever touched a
      # HARDCODED subset — so an example outside that subset could stop compiling and no job in the
      # repo would notice. That is exactly how six examples came to be broken for weeks by a single
      # unswept API retirement (the hand-STARK `prove_X`/`verify_X` deletion).
      #
      # `cargo check --workspace --all-targets` in ci.yml's Check job does technically cover these
      # targets, but it is a whole-workspace job that dies on the FIRST crate to break and has been
      # red for unrelated reasons — a break here was indistinguishable from the standing noise.
      # This step is the narrow, legible one: if it goes red, demo-agent examples do not compile.
      #
      # Cost: near zero. Every dependency is already compiled by this same step for the lib+bins;
      # `--examples` adds only the per-example codegen (~40 small binaries, ~1-3 min on a warm
      # rust-cache), and it runs in a job that already builds this crate.
      # `--bins` is NOT redundant: cargo target-selection flags are RESTRICTIVE, so a bare
      # `--examples` would build ONLY examples and stop producing the `dregg-demo` binary the next
      # step runs. Both flags together = the original lib+bins, plus every example.
      # ⚑ THE VERIFIED LEAN RUNTIME. This lane builds --release, which arms
      # dregg-lean-ffi's require_lean_native gate; without a Lean toolchain + a
      # key-matched seed the build PANICS at build.rs's sysroot arm and nothing
      # below this line has ever executed. See .github/actions/lean-seed for the
      # measurement and for why DREGG_REQUIRE_LEAN=0 is not an option here.
      - uses: ./.github/actions/lean-seed

      - name: Build demo crates (examples INCLUDED — the compile gate)
        run: cargo build --release -p dregg-demo -p dregg-demo-agent --bins --examples

      - name: Run main demo binary
        id: main_demo
        run: |
          START=$(date +%s%3N)
          set +e
          cargo run --release -p dregg-demo 2>&1 | tee /tmp/demo_main.txt
          EXIT_CODE=${PIPESTATUS[0]}
          set -e
          END=$(date +%s%3N)
          DURATION=$((END - START))
          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"
          echo "duration=$DURATION" >> "$GITHUB_OUTPUT"

      - name: Run all demo-agent examples
        id: examples
        run: |
          # NOTE: this list is the RUN set, not the COMPILE set — the build step above compiles
          # ALL examples via `--examples`, so an example missing from this list can no longer rot
          # unnoticed. Names here must exist; `federation_bootstrap`, `offline_verification` and
          # `wallet_lifecycle` were removed 2026-07-25 because they had no `[[example]]` entry (the
          # first two retired with the hand-STARK engine) and so could only ever have exited
          # non-zero — stale entries in a gate are the gate lying to you.
          EXAMPLES=(
            multi_org_delegation
            sub_agent_spawn
            private_orderbook
            payment_channel
            rbac_datalog
            token_revocation
            progressive_disclosure
            note_privacy
            programmable_cell
            web_auth_flow
            multi_silo_budget
            causal_ordering
            nft_demo
            escrow_demo
            auction_demo
            atomic_swap_demo
            # Ported 2026-07-25 off the retired hand-STARK prove/verify onto the bridge
            # descriptor-prover API. Each carries real assertions (honest pole + adversarial
            # poles), so running them here is a genuine check, not a print.
            anonymous_credit_check
            garbled_ot_auction
          )

          mkdir -p /tmp/demo_results

          # Track whether ANY example returned non-zero. The `set +e` below keeps the loop going so
          # every demo's result lands in the report (that is the report's whole value), but a demo
          # that panics is a FAILURE, not a data point — this flag is what makes the lane able to go
          # red at all. It is checked in the final step, after the report is written and uploaded.
          FAILED_EXAMPLES=""

          for example in "${EXAMPLES[@]}"; do
            echo "::group::Running $example"
            START=$(date +%s%3N)
            set +e
            cargo run --release -p dregg-demo-agent --example "$example" 2>&1 | tee "/tmp/demo_${example}.txt"
            EXIT_CODE=${PIPESTATUS[0]}
            set -e
            END=$(date +%s%3N)
            DURATION=$((END - START))

            # Write individual result JSON
            OUTPUT=$(cat "/tmp/demo_${example}.txt" | jq -Rs .)
            cat > "/tmp/demo_results/${example}.json" <<ENDJSON
          {
            "name": "${example}",
            "output": ${OUTPUT},
            "exit_code": ${EXIT_CODE},
            "duration_ms": ${DURATION}
          }
          ENDJSON
            echo "::endgroup::"

            if [ $EXIT_CODE -ne 0 ]; then
              echo "::warning::Example $example exited with code $EXIT_CODE"
              FAILED_EXAMPLES="${FAILED_EXAMPLES} ${example}(${EXIT_CODE})"
            fi
          done

          # Surface the tally for the final gate step. Trimmed of the leading space.
          echo "failed_examples=${FAILED_EXAMPLES# }" >> "$GITHUB_OUTPUT"

          # Also add main demo result
          MAIN_OUTPUT=$(cat /tmp/demo_main.txt | jq -Rs .)
          cat > "/tmp/demo_results/_main.json" <<ENDJSON
          {
            "name": "dregg-demo (main binary)",
            "output": ${MAIN_OUTPUT},
            "exit_code": ${{ steps.main_demo.outputs.exit_code }},
            "duration_ms": ${{ steps.main_demo.outputs.duration }}
          }
          ENDJSON

      - name: Assemble results.json
        run: |
          COMMIT_SHA="${{ github.sha }}"
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          # The output dir is not tracked in the repo (results.json is a built
          # artifact, never committed), so create it before writing into it.
          mkdir -p site/demos

          # Combine all individual results into one array (use find to avoid ARG_MAX)
          find /tmp/demo_results -name '*.json' -print0 | xargs -0 cat | jq -s '.' > /tmp/all_results.json

          # Build final document
          jq -n \
            --arg sha "$COMMIT_SHA" \
            --arg ts "$TIMESTAMP" \
            --slurpfile results /tmp/all_results.json \
            '{
              "commit": $sha,
              "timestamp": $ts,
              "results": $results[0]
            }' > site/demos/results.json

      - name: Upload demo results artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: demo-results
          path: site/demos/results.json
          retention-days: 30

      # THE GATE THIS LANE NEVER HAD. Everything above uses `set +e` and captures each demo's exit
      # code into the report as DATA — nothing ever compared it to zero, so every demo could panic
      # on every push and this lane stayed green, reporting the panics as content. The report is the
      # valuable part and is fully written and uploaded above; this step only decides pass/fail from
      # the exit codes already captured. It runs LAST and with `always()` so the report ships even
      # when a demo failed — the failure is surfaced, not swallowed.
      - name: Fail if any demo exited non-zero
        if: always()
        env:
          MAIN_EXIT: ${{ steps.main_demo.outputs.exit_code }}
          FAILED_EXAMPLES: ${{ steps.examples.outputs.failed_examples }}
        run: |
          rc=0
          if [ "${MAIN_EXIT:-0}" != "0" ]; then
            echo "::error::dregg-demo (main binary) exited with code ${MAIN_EXIT}"
            rc=1
          fi
          if [ -n "${FAILED_EXAMPLES}" ]; then
            echo "::error::demo-agent examples failed (name(exit_code)):${FAILED_EXAMPLES:+ }${FAILED_EXAMPLES}"
            rc=1
          fi
          if [ "$rc" -eq 0 ]; then
            echo "All demos exited 0."
          fi
          exit "$rc"
