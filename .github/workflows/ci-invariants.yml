# ci-invariants.yml — THE ENFORCING GATE for the twin-deletion + megaswarm-fix campaign.
#
# Recommendation ① of the twin-deletion campaign: make the campaign's gains un-regressable.
# It runs scripts/ci-invariants.sh, which enforces SIX invariants (see docs/CI-INVARIANTS.md):
#
#   1  THE TREE BUILDS         — cargo check --workspace --all-targets --keep-going, zero
#                                non-compiling members (the dregg-analyzer / PlayerWorlds class).
#   2  EVERY FALSIFIER RUNS    — every row of scripts/ci-invariants/falsifiers.tsv EXECUTES and
#      AND PASSES                passes (missing / #[ignore]'d / setup-panic all count as FAILED).
#   3  NO SILENCED FALSIFIER   — no falsifier-class test carries #[ignore].
#   4  NO RUST TWIN OF A LEAN  — every live decider still routes through its proven @[export]; the
#      @[export]                 native/rust/mirror siblings stay #[cfg(test)]-only.
#   5  ONE MATHLIB PROVISIONING— every CI mathlib provisioning routes through
#      PATH                      scripts/ci-mathlib-cache.sh and the lakefile keeps its git+rev pin.
#                                Added after five sites spent 20 days fetching mathlib's prebuilt
#                                oleans into a directory lake does not read: a from-source mathlib
#                                build is indistinguishable from a slow one in a green log.
#   6  NO ACCEPTING FALLTHROUGH— the DATAFLOW half of invariant 4: at every registered decision
#      ON A MISSING GATE         site, when the verified gate is ABSENT, control cannot reach an
#                                ACCEPTING verdict. Invariant 4 greps for a SYMBOL and was green the
#                                whole time turn/src/executor/atomic.rs fell through from a missing
#                                conservation oracle into the unverified Rust BlockConservation twin
#                                on NATIVE — the asset-inflation boundary. Carries its own
#                                --self-test, so it proves it can go red on every run.
#
# The `structural` job (invariants 3+4+5+6, NO build) is the fast always-on check. `tree-builds`
# (invariant 1) and `falsifiers` (invariant 2) are the heavy jobs — they mirror ci.yml's toolchain /
# system-deps / disk-reclaim / LFS setup. `tree-builds` overlaps ci.yml's `check` job but adds
# --keep-going (enumerate EVERY failing crate, not just the first) and is the campaign's named gate.
name: CI invariants

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-invariants-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  # ── the fast, always-on check: invariants 3 + 4 + 5 + 6; bash/grep/awk + python3, no build ──
  structural:
    name: Structural invariants (no build — #[ignore] + Rust-twin + one-mathlib-path + gate-dataflow guards)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: ci-invariants.sh structural
        run: bash scripts/ci-invariants.sh structural

  # ══════════════════════════════════════════════════════════════════════════════════════════
  # ⚑ THE TWO GATES ONLY A PER-CLONE HOOK RAN (2026-08-08).
  #
  # `scripts/check-dangling-imports.sh` and `scripts/check-floor-baseline-preflight.sh` were
  # invoked from EXACTLY ONE place in the repository: `scripts/git-hooks/pre-commit`. That is
  # per-clone opt-in — `scripts/install-hooks.sh` is called by neither `scripts/bootstrap.sh`
  # nor any workflow — and `--no-verify` turns it off for anyone who has it. So the strongest
  # gate in the tree for two real, repeatedly-paid wounds had NO READER IN CI AT ALL, and
  # `grep -rn check-dangling-imports .github/` returned zero hits.
  #
  # THE WOUNDS, both measured and both recent:
  #   * DANGLING IMPORT — four times on 2026-08-03 (`a0a7da66f`, `ad0e55b57` twice, and the
  #     revert `1feb6210f` half-repaired) HEAD carried an `import Dregg2.Foo` with no committed
  #     `metatheory/Dregg2/Foo.lean`. Every clean build of HEAD then died in ~2 seconds at
  #     `[0/0] Running job computation`, before elaborating anything — and it died for the OTHER
  #     lanes, never for the one that broke it. `git commit --only` is PATH-granular and
  #     `metatheory/Dregg2.lean` is the hottest file in the tree; the mechanism is structural.
  #   * UNBASELINED FLOOR CARRIER — `915437862f` landed five declarations taking floors this
  #     tree PROVES FALSE at deployed BabyBear parameters with no `FloorRatchetBaseline` entry.
  #     Green on its own files; `lake build Dregg2` red for every other lane until a stranger
  #     bisected it.
  #
  # THE HOOK STAYS THE PRIMARY: only it can PREVENT the commit, and prevention is the point
  # (CI's detection is what we already had, twice). This job is the BACKSTOP for the two states
  # the hook cannot cover — an uninstalled clone and `--no-verify` — and it is the reader that
  # makes the gates visible on the checks page at all.
  #
  # NEITHER NEEDS A TOOLCHAIN. Both are bash + git + python3 and finish in about a second, which
  # is why they are their own tiny job rather than steps appended to a heavy one: nothing here
  # can be silenced by a build. `!cancelled()` on each so the two verdicts stay independent.
  # ══════════════════════════════════════════════════════════════════════════════════════════
  commit-hygiene:
    name: Commit hygiene (dangling imports + floor-baseline preflight — the hook-only gates)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # depth 2: `check-floor-baseline-preflight.sh --rev HEAD` judges a commit against its
      # OWN PARENT (that is what makes "INTRODUCED by this commit" meaningful, and what stops
      # the demonstration passing the moment a carrier is anywhere in HEAD). A depth-1 checkout
      # has no parent and the script cannot answer.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 2

      # ⚠ THIS ONE IS COMPLETE, and it is the one that matters most. `--ref HEAD` asks the
      # WHOLE-TREE question — { every `^import Dregg2…` } MINUS { every metatheory .lean } must
      # be empty — so it catches a dangling import no matter which commit introduced it, and it
      # fails closed on a degenerate scan (under 600 modules or 600 imports = exit 3, because a
      # checker that silently finds nothing to check passes forever).
      - name: No commit may name a Lean module it does not contain
        if: ${{ !cancelled() }}
        run: bash scripts/check-dangling-imports.sh --ref HEAD

      # ⚠ AND THIS ONE IS PER-COMMIT, so say what it does NOT cover: `--rev HEAD` grades the
      # TIP of the push against its parent. A push of several commits has its middle commits
      # graded by the hook (which sees each one) and not here. That is the honest split — the
      # hook is the per-commit gate, this is the backstop — and it is stated rather than implied.
      # A commit touching no `metatheory/**.lean` prints "no files to scan" and exits 0.
      - name: A new refuted-floor carrier must arrive with its baseline entry
        if: ${{ !cancelled() }}
        run: bash scripts/check-floor-baseline-preflight.sh --rev HEAD

      # ⚑ THE THIRD HOOK-ONLY GATE, and it is about the ARMING of every other gate (2026-08-08).
      #
      # `grep -rn check-lean-seed .github/` returned hits in ONE file — `dark-targets.txt`, i.e.
      # prose. All three Lean-seed gates lived solely in `scripts/local-gates.sh`, hand-invoked.
      #
      # WHAT THE SUBJECT IS. `dregg-lean-ffi/libdregg_lean.a` is what makes `#[cfg(dregg_*_present)]`
      # compile at all. Without a key-matched seed, build.rs emits no cfgs, every gated module
      # compiles out, and ~43 verified-gate tests print `ok` having asserted nothing — the exact
      # mechanism behind `deployed_constraint_probe` printing `8 passed` daily 07-30 → 08-06 with
      # six of eight assertions false. So this is not one gate among many; it is the question of
      # whether the others ran.
      #
      # ONLY THIS ONE OF THE THREE IS HOSTED-RUNNABLE, and saying which and why is the point:
      #   * THIS gate is two strings — the `DREGG_CLOSURE_HASH` typed into
      #     `dregg-lean-ffi/lean-seed.pin` vs the one `scripts/lean-seed-key.sh` computes by
      #     hashing the `Dregg2.FFI` closure FILES on disk. No network, no `lake`, no cargo, no
      #     mtimes, ~2s, and the closure hash is platform-independent (the platform enters the
      #     asset KEY, not the closure hash), so a runner and a laptop must agree.
      #   * `check-lean-seed-closure.sh` needs the archive present; it is already reached in CI
      #     indirectly, from `scripts/fetch-lean-seed.sh` (ci.yml:573, :1291 and the
      #     `.github/actions/lean-seed` composite), where it grades the freshly downloaded
      #     candidate before install.
      #   * `check-lean-seed-member-freshness.py` compares `ar` member mtimes against `.lean`
      #     mtimes. `actions/checkout` does not preserve mtimes, so on a hosted runner every
      #     member reads stale by construction and the gate is a wall, not a gate. It stays a
      #     local-gates row — the same reason `.github/dark-targets.txt` accepts its Rust twin
      #     `linked_archive_freshness` as dark. Do NOT wire it here.
      #
      # ⚠ EXPECTED RED AT THE COMMIT THAT WIRED IT, and the fix is an OUTWARD act, not a code
      # change: `lean-seed.pin` carries an EMPTY `DREGG_CLOSURE_HASH` after the 2026-08-07
      # closure-key flag day, which the gate treats as MAXIMAL drift and fails outright (it
      # refuses to read "no pin" as "no drift" — that is how eleven days of a stale seed stayed
      # invisible). Clearing it means cutting a seed:
      #     gh workflow run lean-seed.yml -f platforms=linux-x86_64
      # Owner: ember (publishing a release asset). Do NOT clear this by relaxing the gate, by
      # dropping this step, or by hand-editing the pin.
      - name: The published Lean seed matches the tree it claims to arm
        if: ${{ !cancelled() }}
        run: bash scripts/check-lean-seed-freshness.sh

  # ── invariant 1: the whole tree compiles (every member) ─────────────────────────────────
  tree-builds:
    name: Invariant 1 — THE TREE BUILDS (cargo check --keep-going)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          lfs: true
      # Same disk reclaim as ci.yml / armed-teeth: the hosted runner ships ~14 GB free on /,
      # which this workspace's target/ overruns.
      - name: Reclaim runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /usr/local/lib/android /opt/hostedtoolcache/CodeQL \
            /usr/local/share/powershell /usr/share/swift
          sudo docker image prune --all --force || true
          df -h /
      - run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev libfontconfig1-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libxcb1-dev libgl1-mesa-dev libegl-dev libgles-dev libharfbuzz-dev libfreetype-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libx11-dev libxext-dev libxrandr-dev libxi-dev libxcursor-dev libxinerama-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev gperf libunwind-dev
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: nightly-2026-06-21
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: ci-invariants.sh build
        run: bash scripts/ci-invariants.sh build

  # ── invariant 2: every registered falsifier runs green ──────────────────────────────────
  falsifiers:
    name: Invariant 2 — EVERY FALSIFIER RUNS AND PASSES
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          lfs: true
      - name: Reclaim runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /usr/local/lib/android /opt/hostedtoolcache/CodeQL \
            /usr/local/share/powershell /usr/share/swift
          sudo docker image prune --all --force || true
          df -h /
      - run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev libfontconfig1-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libxcb1-dev libgl1-mesa-dev libegl-dev libgles-dev libharfbuzz-dev libfreetype-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libx11-dev libxext-dev libxrandr-dev libxi-dev libxcursor-dev libxinerama-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev gperf libunwind-dev
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: nightly-2026-06-21
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: ci-invariants.sh falsifiers
        run: bash scripts/ci-invariants.sh falsifiers
