# Documentation reference-integrity check.
# Runs scripts/check-doc-refs.sh, which fails when docs reference files that
# no longer exist.
#
# ARMED on pull_request as of 2026-07-17. The previous manual-only rationale
# cited "~468 pre-existing dead refs" -- that figure was an ARTIFACT of the
# linter's extraction regex, which matched a PREFIX of a longer extension
# (`.ts` inside `.tsv`, `.js` inside `.json`) and invented ~250 fake DEAD refs.
# The word-boundary guard fixed that. The REAL non-excluded dead-ref set was
# then 60 (stale code refs after moves/deletes: crate-relative prose qualified
# to repo-rooted paths, the ZkHandlebars -> SlotConfinement rehome repointed,
# deleted AIRs repointed to their successors or reworded, and proposed-but-
# unbuilt files reworded so they no longer read as live citations). All 60 are
# fixed; this runs green on main, so the gate ratchets from green.
#
# WHY THE EXPLICIT FILE LIST (not a bare invocation):
#   docs/audit/** and docs/SUPERSEDED/** are deliberate CHURN RECORDS -- they
#   describe a tree that has since moved on, and their dead refs are the point of
#   the document, not rot to fix. The linter has no exclude flag, so the
#   exclusion lives here, in the caller. Everything else (445 files, ~5900
#   resolvable refs) is gated.
#
# WHY LC_ALL=C IS PINNED:
#   The extractor is a single awk pass. Under a UTF-8 locale, BSD awk (and any
#   awk that decodes multibyte) hits a `towc` conversion failure on em-dash
#   prose punctuation and TRUNCATES the scan mid-stream -- silently
#   under-reporting (locally this dropped 8073 real refs to ~1300 and hid dead
#   refs). The extraction regex is pure ASCII and needs no multibyte awareness,
#   so LC_ALL=C forces byte-mode: the FULL, correct scan, identical on the mac
#   dev box and on ubuntu CI (mawk/gawk). Do not remove this pin -- an unpinned
#   UTF-8 run can green vacuously by scanning only part of the corpus.
name: docs-refs

# ⚑ IT HAD NEVER RUN, AND THE TRIGGER IS WHY (2026-08-08). `gh run list --workflow=docs-refs.yml`
# returns an EMPTY LIST: not one run, ever. Two reasons compounding, and the second is the
# instructive one:
#   * this repository pushes straight to `main` and opens few PRs, so a `pull_request`-only
#     workflow is a workflow that mostly does not exist here; and
#   * the `paths:` filter was `docs/** | site/** | …` — i.e. it asked to be woken when the PROSE
#     changes. But `scripts/check-doc-refs.sh`'s own pre-push message states the mechanism:
#     "A reference dies when the CODE moves, so this fires on commits that touch no markdown."
#     A path filter over `docs/**` is therefore precisely inverted: the commit that KILLS a
#     reference is the one that deletes or moves the .rs, and that commit could never trigger
#     this job. Measured today: `3ec27de26` (delete the Rust-authored shielded-spend tower) left
#     99 dead references across 14 targets, and the only thing in the repository that noticed was
#     a PER-CLONE pre-push hook — opt-in via scripts/install-hooks.sh, which neither
#     scripts/bootstrap.sh nor any workflow calls. Same class as the two gates the
#     `commit-hygiene` job in ci-invariants.yml was added for on the same day.
# So: `push` to main, and NO path filter. Cost is find + one awk pass over ~450 files, seconds.
# ⚠ EXPECTED RED ON ARRIVAL, with a named owner: those 99 refs are `3ec27de26`'s to repair or to
# reword (docs/SUPERSEDED/** and docs/audit/** are already excluded below as deliberate churn
# records). The hook has been refusing every push in the tree since, so this is a wound already
# being paid for at the push boundary — this makes it VISIBLE on the checks page instead of only
# to whoever happens to have hooks installed.
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check-doc-refs:
    runs-on: ubuntu-latest
    env:
      LC_ALL: C
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Check documentation references
        run: |
          set -o pipefail
          mapfile -t docs < <(
            find docs site -type f -name '*.md' \
              -not -path 'docs/SUPERSEDED/*' \
              -not -path 'docs/audit/*' \
              2>/dev/null | sort
          )
          if [ "${#docs[@]}" -eq 0 ]; then
            echo "no markdown files matched -- the exclusion globs or doc tree moved" >&2
            exit 1
          fi
          echo "scanning ${#docs[@]} markdown files (docs/audit + docs/SUPERSEDED excluded)"
          # ⚑ `metatheory` IS NOT DECORATION — WITHOUT IT THIS JOB COULD NOT PASS (2026-08-08).
          # `check-doc-refs.sh` has TWO passes: markdown prose, and path-shaped tokens in LEAN
          # COMMENTS (gated against scripts/doc-refs-lean-baseline.tsv). The lean pass carries its
          # own non-vacuity floor — under 2000 lean refs scanned is a FAIL, because a scanner that
          # harvests nothing reports no findings forever. This job handed it a MARKDOWN-ONLY file
          # list, so the lean pass scanned zero files and the floor fired by construction:
          #     check-doc-refs: FAIL — only 0 lean refs scanned (floor 2000).
          # measured on run 31231048428, the FIRST run this workflow has ever had (see the trigger
          # block at the top of this file for why it had never run). Arming the trigger is what
          # made the degenerate invocation visible; a gate that cannot pass in the shape CI calls
          # it is not a stricter gate, it is a wall, and the escape hatch would become routine.
          # Passing `metatheory` makes CI ask the SAME question `scripts/git-hooks/pre-push` asks
          # — the two must not diverge, or the hook and the checks page grade different trees.
          bash scripts/check-doc-refs.sh "${docs[@]}" metatheory
