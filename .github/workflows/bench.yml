name: Benchmarks

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

permissions:
  contents: read

jobs:
  bench:
    name: Run benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: nightly-2026-01-01
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # Run criterion benchmarks for each crate that has them.
      # NOTE: hints benchmarks are excluded — they require large fixture files
      # (committee*.json, *.bincode) that are gitignored and not available in CI.
      - name: Bench circuit (mock backend)
        run: cargo bench -p dregg-circuit

      - name: Bench bridge
        run: cargo bench -p dregg-bridge

      - name: Bench token
        run: cargo bench -p token

      - name: Bench federation
        run: cargo bench -p dregg-federation

      - name: Bench wire
        run: cargo bench -p dregg-wire

      - name: Bench macaroon
        run: cargo bench -p macaroon

      - name: Bench tokenizer
        run: cargo bench -p tokenizer

      - name: Upload benchmark results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: criterion-reports
          path: target/criterion/
          retention-days: 30
