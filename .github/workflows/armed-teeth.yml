# armed-teeth.yml — RUN the adversarial tests that were written, correct, and never executed.
#
# THE HOLE THIS CLOSES. `#[ignore]` in this tree does not mean "broken" — it means "a real
# recursion fold that takes minutes". But nothing ran the ignored set: `ci.yml` runs
# `cargo test --workspace` (which by definition never runs ignored tests) and no script passed
# `--ignored`. So EVERY `circuit-prove/tests/*_binding_deployed_tooth.rs` file — the DEPLOYED
# light-client binding teeth, each of which builds a SPECIFIC forged witness (a claim no leg's
# published teeth back) and requires the deployed recursion fold to refuse it — provided ZERO
# assurance. They were documentation that compiled.
#
# "Expensive" must mean "runs nightly", never "runs never". That is all this workflow is.
#
# ── THE SECOND AXIS: EXPENSIVE-SO-FEATURE-GATED (added 2026-07-26) ─────────────────────
# The paragraph above closed ONE axis — expensive, therefore `#[ignore]`d. There is another,
# and it is strictly worse, because an `#[ignore]`d test at least COMPILES on every push (so
# API drift reds ci.yml the day it lands) while a feature-gated one does not exist at all.
#
# MEASURED 2026-07-26: `grep -rn -- '--features\|--all-features' .github/workflows/` — no
# workflow in this repository enables `--features prove`, `--features prover`, or
# `--all-features`. Three crates put their real-fold adversarial test behind an off-by-default
# `prove` feature and wrote the invocation in a Cargo.toml comment:
#
#   dregg-entity-compose  "cargo test -p dregg-entity-compose --features prove --test leaf_prove -- --ignored"
#   dregg-braid-hook      "cargo test -p dregg-braid-hook --features prove --test weld_canary -- --ignored --nocapture"
#   dreggnet-companion    "cargo test -p dreggnet-companion --features prove --test wing_weld -- --ignored --nocapture"
#
# "Documented as run by hand" is how a test comes to run never. And the feature axis hides
# itself better than `#[ignore]` does: with the feature off, a `#![cfg(feature = "prove")]`
# file compiles to an EMPTY test crate that reports `0 passed; 0 failed` and EXITS 0. There is
# no skip line, no `ignored` count, nothing in any log. That is why the job below floors what
# actually EXECUTED rather than trusting an exit code — the same argument as `binding-teeth`,
# only here the silent-zero is the default state rather than a filter accident.
#
# The features stay OFF by default and that is correct: they pull the plonky3 recursion prover,
# and keeping it out of the bare dev loop is the whole reason the gate exists. The fix is not
# to make them default; it is to arm them in the lane that already means "expensive, so nightly".
#
# THESE ARE NOT SPECULATIVE TEETH. `braid_outcome_weld_bites` was run by hand for the first time
# on 2026-07-25 and bit on both poles in 473.95s: the honest composition folded, and the forged
# one — the committed outcome octet perturbed by EXACTLY 1 (1262052436 vs 1262052435) — had no
# satisfying assignment and was refused with a `WitnessConflict`. A genuine forgery canary that
# ran nowhere.
#
# WHY A SEPARATE WORKFLOW rather than a step in ci.yml: these are minute-scale folds. Putting them
# on the per-push gate would make every push wait on them, and the first slow week would end with
# someone deleting the step. A schedule is the honest home for a lane whose cost is real.
#
# WHAT IS NOT HERE (named, not hidden):
#
#   * THE GPU TEETH. They now fail CLOSED on a missing adapter (they assert `adapter_available()`)
#     and are `#[ignore]`d, so a GPU-less runner skips them EXPLICITLY — that is the one GPU law.
#     A GitHub-hosted runner has no usable adapter, so running them here would be a guaranteed red
#     that says nothing about the code. They run via `scripts/test-gauntlet.sh gpu` on a GPU box.
#     There is no hosted GPU lane to add them to; wiring one needs a self-hosted GPU runner.
#
#   * THE LEAN HARD-MODE SOAK LANE (`DREGG_TEST_REQUIRE_LEAN=1`). This used to be self-hosted-only
#     and `workflow_dispatch`-gated, i.e. it had never run: the hard mode panics unless
#     `libdregg_lean.a` is linked, that archive is gitignored, and `lean-seed.pin` had `TAG=` EMPTY
#     so `scripts/fetch-lean-seed.sh` died. The premise has changed. `lean-seed.yml` now BUILDS the
#     seed on a self-hosted host and PUBLISHES it as a content-keyed release asset on every push to
#     `metatheory/**`. BUILDING the seed is what a hosted runner is too weak for; FETCHING one is a
#     download and a link. ubuntu-latest is Linux-x86_64 — the platform that lane publishes — so
#     `lean-hard-mode` below now runs HOSTED, on the nightly schedule, fetching the seed. It arms
#     itself off the pin: while `TAG=` is empty it says so loudly instead of failing nightly for
#     infrastructure that does not exist yet; the first publish flips it on with no edit here.
#
#   * THE `prover` FEATURE, EXCEPT ONE TARGET — and the reason is that it is NOT a hole. THREE
#     crates declare a `prover` feature (was ten, then eight, then six; `dregg-cell`'s and
#     `dregg-demo`'s were both `prover = []` gating zero code and are DELETED, 2026-07-27, and
#     `dregg-sdk`'s and `dregg-teasting`'s went the same day — see below; `dregg-node`'s,
#     `dregg-perf`'s and `dregg-tests`'s went 2026-07-28, also below), and the census
#     (`default =` line of every Cargo.toml declaring one) says ALL THREE put it in `default`:
#     grain-turn, dregg-lightclient, dregg-verifier. Default-on means `cargo test
#     --workspace` already COMPILES and RUNS them, so
#     `verifier/tests/integration_rotated_replay_chain.rs` (8) is not gated off CI at all —
#     checked file by file, not one of them carries `#[ignore]`. Arming them here would be a
#     second, slower copy of a lane that already exists.
#     `dregg-sdk`'s is DELETED: it was `prover = []` over 106 local `#[cfg]` sites, forwarding
#     nothing and pulling no dep (measured: ON and OFF resolve to the same 490 units / 325
#     packages), so the 15 whole-file `#![cfg(feature = "prover")]` binaries in `sdk/tests/*`
#     — 95 tests — are now UNCONDITIONAL rather than default-on. `dregg-teasting`'s is DELETED
#     as a second `prover = []` over ZERO cfg sites.
#     `dregg-node`/`dregg-perf`/`dregg-tests` are DELETED (2026-07-28): all three `prover = []`,
#     all three default-on with no `--no-default-features` consumer in the tree. Node's OFF
#     position DID NOT COMPILE AT ALL (22 lib errors — `blocklace_sync.rs` names the
#     `exact_fnsp_v3_*` modules that `lib.rs` gated on the feature), so its 10
#     `#[cfg(not(feature = "prover"))]` tests existed in no configuration; un-gated and run, all
#     nine that assert the retired v1 `EffectVmAir` attestation COMMITS fail, and they are
#     deleted with that lane. `dregg-perf`'s three sites were POSITIVE and gated the rotated
#     full-turn harness the crate exists to measure; they are now unconditional. `dregg-tests`'s
#     two T14 legs are unconditional with their reason substring re-pointed at the live refusal.
#     The one exception, named:
#       - `grain-turn`'s `r3_grain_adapter` IS default-compiled but is `#[ignore]`d, so it ran
#         nowhere — the first axis, missed because it lives outside `circuit-prove/tests/` and
#         so no `*tooth*` glob could ever reach it. It is armed below in `lean-hard-mode`, not
#         in the prove job, because its decision is the extracted Lean `dregg_grain_r3_verify`
#         and it needs the seeded archive. See that job for the fail-open it carries.
name: Armed teeth

#
# ── SHOULD THE TEETH GATE A PR? DECIDED 2026-07-25: NO — AND THAT IS NOT THE SAME AS
#    "INVISIBLE ON A PR". ────────────────────────────────────────────────────────────
# The teeth themselves stay nightly. The reason is the one in the header and it has not
# changed: these are minute-scale REAL recursion folds (the last full measurement took
# the lane to hours), and a per-push gate that slow gets deleted the first slow week.
# Running them on `pull_request` would also mean every PR pays for a fold that is
# CURRENTLY RED for a reason that has nothing to do with that PR (the
# `generate_rotated_transfer_shape_wide` ↔ `transferVmDescriptor2R24` producer/descriptor
# drift, measured 2026-07-15). That is how a lane gets silenced.
#
# But "does not gate" had silently become "does not exist". The `page-on-red` job below
# files an issue, which is real — and is still a place nobody looks during a review. The
# signal a reviewer actually reads is the checkmark, and the checkmark said nothing at all
# while 11 of 17 teeth were failing every single night.
#
# So `nightly-verdict` runs on `pull_request` and mirrors the LAST scheduled run onto the
# PR as a check. It runs no folds and costs seconds. It goes RED on two things:
#
#   1. THE LAST NIGHTLY FAILED. A PR should not be reviewed against a green wall while the
#      deployed binding teeth are known-broken. This is deliberately a merge-blocking red:
#      the escape is to fix the teeth, not to route around the report.
#   2. THE SCHEDULE HAS STOPPED FIRING (no completed run in 48h). This is the failure that
#      no issue and no annotation can ever report, because the thing that would report it
#      is the thing that died. GitHub also disables `schedule` triggers on repositories
#      with no recent activity, entirely silently. A nightly nobody can tell has stopped is
#      worth exactly as much as a tooth nobody runs.
on:
  schedule:
    # Daily, 05:00 UTC — two hours ahead of the proof-integrity canary (07:00) so the two
    # long-running scheduled gates do not contend for runners.
    - cron: '0 5 * * *'
  pull_request:
    # ONLY `nightly-verdict` runs here — every heavy job below is guarded off PRs.
  workflow_dispatch:
    inputs:
      runner:
        description: "Override the lean-hard-mode runner label (e.g. a self-hosted host that already has a seeded libdregg_lean.a). Leave EMPTY to run hosted and fetch the CI-published seed."
        required: false
        default: ""
        type: string
      desktop_runner:
        description: "Override the gpui-gated-desktop-teeth runner. EMPTY uses the self-hosted host (hbox: self-hosted,lean-seed,linux-x86_64) — a hosted runner CANNOT finish this lane (gpui + libservo + the Lean archive exceed its disk)."
        required: false
        default: ""
        type: string

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  binding-teeth:
    name: Deployed light-client binding teeth (--ignored)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Thirteen binaries of real recursion folds. Generous but bounded: a lane that hangs to the
    # 6h ceiling is a lane nobody reads.
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          lfs: true   # include_str!'d staged registries live in LFS (.gitattributes)

      # Same disk reclaim as ci.yml's Linux test job: the hosted runner ships ~14 GB free on /,
      # which this workspace's target/ overruns (ci.yml documents the SIGBUS root cause at length).
      - name: Reclaim runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /usr/local/lib/android /opt/hostedtoolcache/CodeQL \
            /usr/local/share/powershell /usr/share/swift
          sudo docker image prune --all --force || true
          df -h /

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # --release is not a nicety: these are FRI folds, and debug is the dominant cost (the
      # nextest heavy profile documents the same reasoning). A debug run would not finish.
      #
      # The tooth binaries are named EXPLICITLY rather than using a bare
      # `-p dregg-circuit-prove -- --ignored`. That bare form is what the plan prescribed, but it
      # also sweeps in the GPU binaries (guaranteed red here — no adapter, and they now fail
      # closed), whose external prerequisites are a separate question from these teeth. Naming the
      # binaries makes the lane's claim exact: THESE teeth ran, and they either bit or they did not.
      # (The apex-shrink tooth is no longer among the excluded: it is a real `#[ignore]`d wrap-capstone
      # fold with no external prerequisite, and the old glob was the only reason it ran nowhere.)
      # `--no-fail-fast` is load-bearing, not a nicety. `cargo test` aborts the whole run at the
      # first failing test BINARY, so without it this lane reports 1 of 8 and hides the other 7 —
      # measured: the first run stopped at `bridge` and said nothing about the rest. A nightly
      # diagnostic exists to tell you the SHAPE of the damage; a lane that stops at the first red
      # is a lane you have to run eight times.
      #
      # ⚠ THIS LANE IS RED AT LANDING, AND THAT IS THE POINT. Arming is what revealed the break.
      # MEASURED 2026-07-15, all 8 binaries, --release --no-fail-fast -- --ignored:
      #
      #     4 passed / 11 FAILED  of the 17 armed teeth  (8/8 binaries RED)
      #
      # ONE root cause dominates (9 of the failures). Every tooth that mints a wide transfer leg
      # dies in its SETUP — before any fold — with
      #   "row 0: range wire 188 value 1230416006 >= 2^15"
      # raised by `descriptor_ir2.rs:4129`, the prover's witness builder, which refuses a value
      # overflowing a range block the DEPLOYED descriptor declares (wire 188 — a 15-bit
      # availability-weld borrow limb, see `descriptor_ir2.rs:273-277`). It reproduces byte-identically
      # across the plain, membership-edge, and Dfa-carrying transfer legs, so it is one break in the
      # shared `generate_rotated_transfer_shape_wide` ↔ `transferVmDescriptor2R24` pair — NOT the
      # teeth's own witness surgery (wire 188 sits far below the teeth columns at ~1771). Every file
      # on that path is clean at HEAD.
      #
      # Tell-tale: these advertise themselves as minute-scale folds and finish in 0.06s–8.67s. They
      # never reach the recursion at all. The remaining failures are downstream noise: 3 PoisonError
      # cascades (a sibling test's panic poisoning a shared mutex) and 1 `wgpu error: Validation
      # Error` in `factory` — worth noting on its own, since `64dbf9ed9` made the fold auto-select a
      # GPU, so a CPU-shaped tooth can now be dragged onto a GPU path by the host it happens to run on.
      #
      # This is the producer-equals-descriptor drift class the crate's own coverage gate already
      # names (43 Uncovered rows), and the class that bit before at `be732a9dd` — honest turns
      # failing to prove, which the drift gate cannot see. It was invisible for exactly one reason:
      # nothing ran these tests. Do NOT silence this lane to make it green, and do NOT `#[ignore]`
      # them again. Fix the producer/descriptor pair.
      # ⚠ THE GLOB WAS NARROWER THAN THE NOUN, and that cost two teeth (found 2026-07-25).
      # It read `*_binding_deployed_tooth.rs` and matched 8 of the 13 tooth/teeth files in
      # `circuit-prove/tests/`. Five were invisible to it. Three of those five carry no
      # `#[ignore]` at all, so `cargo test --workspace` already runs them and nothing was
      # lost — but the other two are `#[ignore]`d minute-scale folds that ran NOWHERE:
      #
      #   * `apex_shrink_bn254_tooth.rs`            — THE wrap capstone: one real 2-turn
      #                                               fold + a BN254-native-hash shrink prove
      #   * `private_graph_rewrite_deployed_tooth.rs` — real private-graph HidingFri +
      #                                               deployed direct-IR2 whole-chain recursion
      #
      # Both are exactly the shape this lane exists to arm, and both were `#[ignore]`d (so
      # ci.yml skipped them) AND unmatched by the glob (so the nightly skipped them too).
      # The glob now spans the NOUN — any `*tooth*`/`*teeth*` file — because the naming
      # convention is what a new tooth follows, not one particular suffix.
      #
      # AND A DERIVED LIST STILL NEEDS A FLOOR. Deriving instead of transcribing stops the
      # list going STALE; it does not stop it going EMPTY or SHRINKING. A glob that stops
      # matching (a rename, a directory move) yields a green lane that ran nothing, which is
      # the failure mode this whole workflow is a response to. So both counts are floored
      # against a MEASURED baseline, and the run's own libtest output — not its exit code —
      # is what proves the teeth executed.
      #
      # ⚑⚑ AND THE GLOB IS GONE (2026-08-07), BECAUSE WIDENING IT WAS NEVER GOING TO BE
      # ENOUGH. Every fix above widened the PATTERN — `*_binding_deployed_tooth` → the noun
      # `*tooth*`/`*teeth*` — while leaving the SELECTOR a filename. A test earned its
      # nightly by living in a file with the right name, which is not a property of the test.
      #
      # MEASURED AT HEAD 2026-08-07, over every `#[ignore]` attribute in the workspace (282):
      #
      #     armed-nightly (this job, via the glob)     21
      #     DARK — reached by nothing at all           71   ← in `dregg-circuit-prove` alone
      #
      # The 71 include `custom_binding_production_path`'s `production_custom_turn_forged_rejected`
      # and `…forged_root_rejected`, `fold_unfoolability_forge`'s two, `accumulator`'s nine
      # (among them `online_mixed_root_forgery_rejected` and `forged_link_stream_is_rejected`),
      # `membership_binding_mechanism`'s forged pole, `mpt_holding_fold_pilot`'s six, and
      # `recursion_vk_determinism`.
      #
      # ⚠ TWENTY-EIGHT OF THEM COULD NEVER HAVE BEEN REACHED BY ANY GLOB, HOWEVER SPELLED.
      # They are `#[ignore]`d LIB tests in `circuit-prove/src/` (`joint_turn_recursive.rs`'s
      # twelve, `deco_leaf_adapter.rs`'s six, `zkoracle_leaf_adapter.rs`'s five, …), and this
      # job's selector is a list of `--test <binary>` flags, which names integration-test
      # binaries only. `--lib` is a different flag and nothing passed it. So the glob was not
      # merely narrow; for that half it was the wrong KIND of selector.
      #
      # The list now comes from `.github/ignored-test-routes.txt` — a per-test roster in which
      # EVERY `#[ignore]`d test in the workspace carries a route, checked by
      # `scripts/check-ignored-test-routing.py` in the step below. The roster selects by TEST
      # NAME; the script only translates that into the `--lib`/`--test` flags cargo needs. The
      # pair is what stops both rots: a transcribed roster cannot go empty by a rename, and a
      # completeness gate over it cannot go stale, because its ground truth is the tree's own
      # `#[ignore]` attributes re-read on every run.
      #
      # ⚠ WHY THE 71 GO IN A SEPARATE JOB (`dark-binding-teeth`) AND NOT IN THIS ONE. Their
      # aggregate wall clock on a hosted runner has never been measured — same footing
      # `feature-gated-prove-teeth` landed on, and its header says so in as many words. A lane
      # that already works must not be able to time out behind an unmeasured one.
      #
      # ⚠ AND WHY THE WHOLE PACKAGE WAS *NOT* THE ANSWER, even though `[profile.armed]`
      # (`package(dregg-circuit-prove) and not (<gpu>)`) is exactly the non-rotting shape and
      # is already in `.config/nextest.toml`. The tree's own `#[ignore]` reasons refuse it:
      #   * `leaf_wrap_mint_blowup_repricing::the_deployed_mint_is_the_measured_wall` records
      #     "~118 GiB peak footprint (> RAM)"; `mina_accumulator_fold`'s three record
      #     117.8–118.3 GiB. `ubuntu-latest` is 16 GB. That is an OOM, and an OOM here reads
      #     as a failing tooth.
      #   * `production_leaves_mint_at_their_own_engine`'s two say "Run ALONE under
      #     /usr/bin/time -l". `[profile.armed]` is `test-threads = 4`; they would still
      #     produce a number, and it would be wrong.
      #   * Seven are MEASUREMENTS with no adversarial claim — one, `dfa_routing_emit_gate::
      #     perf_prove_verify_breakdown`, says "PERF PROBE with NO assertion" in its own reason.
      #   * Two MINT FIXTURES into the tree.
      # Those get their true routes in the roster instead of a nightly that cannot serve them.
      - name: Every `#[ignore]`d test carries a route
        run: python3 scripts/check-ignored-test-routing.py

      - name: Arm the deployed binding teeth
        run: |
          # ⚠ `set +e` IS LOAD-BEARING. GitHub runs `run:` blocks under
          # `bash --noprofile --norc -eo pipefail`, so `-e` is ALREADY ON and a plain
          # `set -uo pipefail` does not clear it. Under `-e` the `cargo test | tee` below
          # aborts the step the instant a tooth is red — which looks fine, except it means
          # the floor check after it is UNREACHABLE CODE, i.e. a guard on the guard that
          # cannot fire. Turn `-e` off, capture the status, check the floor, then exit with
          # the status we saved.
          set +e
          set -uo pipefail
          # Measured 2026-08-07: the `armed-nightly` route holds 21 teeth. Floors are a
          # RATCHET — raise them when the set grows; never lower one to make a red lane green.
          # (The old FLOOR_FILES is gone with the glob: a count of FILES was only ever a proxy
          # for a count of TESTS, and it is the wrong one — four of the fourteen files the glob
          # matched carry no `#[ignore]` at all, and 28 of the teeth it could not reach are in
          # no `tests/` file.)
          FLOOR_TEETH=21
          # Derived from the ROSTER, not from filenames. `--emit-cargo-targets` fails loudly
          # (exit 2) if the route covers no live test, so an empty selection can never present
          # as a green lane that ran nothing.
          TARGETS=$(python3 scripts/check-ignored-test-routing.py --emit-cargo-targets armed-nightly) || exit 1
          echo "armed-teeth: rostered targets: $TARGETS"
          # shellcheck disable=SC2086
          cargo test -p dregg-circuit-prove --release --no-fail-fast \
            $TARGETS \
            -- --ignored --nocapture 2>&1 | tee armed-teeth.log
          status=${PIPESTATUS[0]}
          # THE FLOOR ON WHAT ACTUALLY RAN. `cargo test` exits 0 for a binary that matched no
          # test, so an exit code cannot tell "17 teeth bit" from "the filter matched nothing".
          # Sum libtest's own report instead; a zero here is a hard failure, not a quiet pass.
          ran=$(sed -nE 's/^test result:.* ([0-9]+) passed; ([0-9]+) failed.*/\1 \2/p' armed-teeth.log \
                 | awk '{s+=$1+$2} END {print s+0}')
          echo "armed-teeth: $ran tooth assertion(s) actually executed (floor $FLOOR_TEETH)."
          if [ "$ran" -lt "$FLOOR_TEETH" ]; then
            echo "::error::only $ran armed tooth(s) executed, below the measured floor of $FLOOR_TEETH."
            echo "::error::A lane that runs fewer teeth than it claims is a lane reporting on tests"
            echo "::error::that did not happen. Do not lower the floor to clear this."
            exit 1
          fi
          exit "$status"

  # ─────────────────────────────────────────────────────────────────────────────
  # THE DARK SET — 71 `#[ignore]`d teeth in `dregg-circuit-prove` that, at HEAD on
  # 2026-08-07, were reached by NOTHING. Not by `ci.yml` (`cargo test` never runs an
  # ignored test), not by `binding-teeth` above (its selector was a filename glob), not by
  # `scripts/test-gauntlet.sh armed` (that is a command a human types, and its own header
  # records that no workflow invokes it).
  #
  # THE LIST IS NOT A GLOB AND NOT A TRANSCRIPTION EITHER — it is the `armed-dark` route of
  # `.github/ignored-test-routes.txt`, over which `scripts/check-ignored-test-routing.py`
  # holds a COMPLETENESS gate: every `#[ignore]`d test in the workspace must carry a route,
  # every route must name a live test, and both armed counts are floored. See the long block
  # above `binding-teeth`'s arming step for why every previous fix widened the pattern and
  # left the selector wrong.
  #
  # ⚠ THIS JOB'S COST HAS NEVER BEEN MEASURED ON A HOSTED RUNNER, AND THAT IS SAID HERE
  # RATHER THAN GUESSED. What IS measured is the per-test cost the teeth themselves record:
  # ~9 of the 71 are "one real leaf wrap (~tens of seconds)", most are "~minutes", and
  # `accumulator`'s and `ivc_turn_chain_rotated`'s are multi-turn folds. The four tests whose
  # own reasons record a 118 GiB peak, the two that demand "Run ALONE", the seven pure
  # measurements and the two fixture-minters are NOT here — they carry `oversized` /
  # `exclusive` / `measurement` / `fixture-mint` routes precisely so that a nightly cannot
  # sweep them up. If this job times out or OOMs anyway, that is a REAL FINDING about the
  # folds' cost and belongs in this header — not a reason to quietly drop targets. It is a
  # SEPARATE JOB from `binding-teeth` for exactly that reason: an unmeasured lane must not be
  # able to time out the one that already works.
  #
  # ⚠ AND IT IS EXPECTED TO BE RED AT LANDING. `binding-teeth`'s own first arming measured
  # 4 passed / 11 FAILED of 17, with one producer/descriptor drift accounting for nine.
  # Arming a test nobody ran is how you find out; a declared red is the product.
  dark-binding-teeth:
    name: Dark binding teeth — the 71 reached by nothing (--ignored)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          lfs: true   # include_str!'d staged registries live in LFS (.gitattributes)

      # Same disk reclaim as `binding-teeth` and ci.yml's Linux test job.
      - name: Reclaim runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /usr/local/lib/android /opt/hostedtoolcache/CodeQL \
            /usr/local/share/powershell /usr/share/swift
          sudo docker image prune --all --force || true
          df -h /

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Every `#[ignore]`d test carries a route
        run: python3 scripts/check-ignored-test-routing.py

      - name: Arm the dark teeth
        run: |
          # `set +e` is load-bearing for the same reason it is in `binding-teeth`: under
          # GitHub's `-eo pipefail` the floor check after a red `cargo test` is unreachable
          # code, i.e. a guard on the guard that cannot fire.
          set +e
          set -uo pipefail
          FLOOR_TEETH=71
          # ⚑ `--lib` IS THE HALF NO GLOB COULD EVER HAVE EXPRESSED. 28 of these teeth are
          # `#[ignore]`d LIB tests in `circuit-prove/src/` — `joint_turn_recursive.rs`'s
          # twelve (four of them `forged_*`/`canary__*` refusal poles), `deco_leaf_adapter`'s
          # six, `zkoracle_leaf_adapter`'s five, `private_preference_cell`'s two. A list of
          # `--test <binary>` flags names integration binaries only; `--lib` is a different
          # flag and nothing in this repository passed it at this package.
          #
          # The emitted `--skip`s are not tidiness either: `--lib` selects the WHOLE lib
          # target, which includes `src/gpu_backend.rs`'s seven adapter-asserting teeth — a
          # guaranteed red on this GPU-less runner, and the exact failure `[profile.armed]`'s
          # GPU exclusion exists to prevent. They are skipped BY NAME.
          TARGETS=$(python3 scripts/check-ignored-test-routing.py --emit-cargo-targets armed-dark) || exit 1
          echo "dark-teeth: rostered targets: $TARGETS"
          # shellcheck disable=SC2086
          cargo test -p dregg-circuit-prove --release --no-fail-fast \
            $TARGETS \
            -- --ignored --nocapture 2>&1 | tee dark-teeth.log
          status=${PIPESTATUS[0]}
          # THE FLOOR ON WHAT ACTUALLY RAN — `cargo test` exits 0 for a binary that matched
          # no test, so the exit code cannot tell "71 teeth bit" from "the filter matched
          # nothing". Sum libtest's own report.
          ran=$(sed -nE 's/^test result:.* ([0-9]+) passed; ([0-9]+) failed.*/\1 \2/p' dark-teeth.log \
                 | awk '{s+=$1+$2} END {print s+0}')
          echo "dark-teeth: $ran tooth assertion(s) actually executed (floor $FLOOR_TEETH)."
          if [ "$ran" -lt "$FLOOR_TEETH" ]; then
            echo "::error::only $ran dark tooth(s) executed, below the roster's floor of $FLOOR_TEETH."
            echo "::error::A lane that runs fewer teeth than it claims is a lane reporting on tests"
            echo "::error::that did not happen. Do not lower the floor to clear this."
            exit 1
          fi
          exit "$status"

      - name: Upload the dark-teeth log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dark-teeth-log
          path: dark-teeth.log
          retention-days: 30

  # ─────────────────────────────────────────────────────────────────────────────
  # THE SECOND AXIS (see the header). `binding-teeth` above arms tests that CI compiles
  # but never RUNS. This job arms tests that CI does not COMPILE — the three real-fold
  # adversarial canaries behind the off-by-default `prove` feature. Before this job,
  # nothing in this repository ever passed `--features prove` to anything; the invocations
  # existed only as prose in three Cargo.toml comments.
  #
  # WHY IT IS A SEPARATE JOB rather than three more steps in `binding-teeth`: a different
  # feature set is a different build fingerprint, so these compile the plonky3 recursion
  # prover a second time under `prove`. Sharing the job would serialise that behind the
  # existing 300-minute fold lane and put both at risk of one timeout.
  #
  # AND THE LOCAL MIRROR DOES NOT COVER THIS EITHER, which is worth knowing before someone
  # concludes they already ran these. `scripts/test-gauntlet.sh armed` is the hand-run twin of
  # `binding-teeth`, and `[profile.armed]` in `.config/nextest.toml` is scoped
  # `default-filter = 'package(dregg-circuit-prove) and not (…gpu…)'` — deliberately, so a
  # workspace-wide `--run-ignored ignored-only` does not sweep in dregg-node's QUIC soak. The
  # side effect is that the gauntlet's "run the ignored set" lane is structurally unable to
  # reach a `prove`-gated test in braid-hook, dreggnet-companion or entity-compose, and it
  # passes no `--features` either. Neither surface covered this axis. This job is the only one.
  #
  # WHAT THIS JOB CANNOT ASSUME. A hosted ubuntu runner has never executed these — the
  # honest measurement is 2026-07-25 on an M-series laptop, where `weld_canary` bit both
  # poles in 473.95s. A hosted runner is slower and much smaller, so the first scheduled
  # run is also the first measurement of whether these fit in a hosted lane at all. If it
  # times out or OOMs, that is a real finding about the folds' cost and belongs in this
  # header — not a reason to quietly drop a target.
  #
  # ⚠ THIS LANE IS PARTLY RED AT LANDING, AND — as with `binding-teeth` — ARMING IS WHAT
  #   REVEALED IT. MEASURED 2026-07-26, all three binaries, --release, each tooth run:
  #
  #     entity-compose/leaf_prove     2 passed / 0 failed    72.96s   GREEN, both teeth bit
  #     braid-hook/weld_canary        1 passed / 0 failed   432.12s   GREEN, both poles bit
  #     dreggnet-companion/wing_weld  0 passed / 1 FAILED    10.44s   RED, dies in SETUP
  #
  #   `wing_weld` never reaches a fold. It dies at `wing_weld.rs:50`, on the FIRST XP-gated
  #   progression turn:
  #
  #     the warden raises: Refused("embedded executor rejected submission: turn error:
  #     program violation on cell 8b43f1da8ef71b10: no constraint oracle installed: this
  #     native node cannot decide a Lean-subset constraint without the verified
  #     dregg_constraint_admits oracle — fail-closed (install it via install_constraint_oracle)")
  #
  #   ROOT CAUSE, and it is NOT bitrot and NOT this test's own logic. `cell/src/program/eval.rs`
  #   fails closed when no constraint oracle is installed, but that gate is
  #   `#[cfg(all(not(debug_assertions), any(unix, windows)))]` — RELEASE-ONLY, by its own comment,
  #   "so debug/test builds across the workspace keep the guest evaluator and stay green". A real
  #   native node arms the oracle at startup (`node/src/lib.rs:638`,
  #   `dregg_exec_lean::register_constraint_oracle()`); a test binary driving the embedded executor
  #   does not. These teeth MUST run `--release` because a debug FRI fold does not finish — which
  #   is exactly the configuration where the fail-closed is armed. So the one test that had to run
  #   in release is the one that found it.
  #
  #   IT IS A CLASS, NOT A ONE-OFF: `grain-turn`'s `r3_grain_adapter` (armed in `lean-hard-mode`
  #   below) dies the same way, at `mint_turn`, in 0.53s, with a byte-identical message. Every
  #   `#[ignore]`d release-run tooth that drives a real executor turn is exposed to it, and no
  #   such tooth had ever run.
  #
  #   THE COROLLARY IS THE BIGGER FINDING, AND IT IS MEASURED BY DIFFERENTIAL, NOT INFERRED.
  #   `dreggnet-companion/tests/wing.rs` is the sibling of `wing_weld.rs`: same `raise_to` calls,
  #   NO feature gate, NO `#[ignore]`, green in ci.yml on every push. Run it in RELEASE
  #   (`cargo test -p dreggnet-companion --release --test wing`, 2026-07-26):
  #
  #     test result: FAILED. 1 passed; 6 failed; 0 ignored  —  finished in 4.46s
  #
  #   All six fail with the identical `no constraint oracle installed` message. So the cause is
  #   NOT the `prove` feature and NOT the teeth: it is DEBUG-vs-RELEASE. ci.yml runs `cargo test`,
  #   which is a debug build, where the fail-closed is `#[cfg]`'d out and the admission decision
  #   falls through to `eval.rs`'s hand-authored Rust `match` — the UNVERIFIED TWIN. The verified
  #   `dregg_constraint_admits` is present in the archive (confirmed with `nm`) and is simply never
  #   consulted by any of it.
  #
  #   Read plainly: a body of green executor tests is green because the verified gate is compiled
  #   out of the configuration they run in, and refuses them in the configuration that ships. That
  #   is not something these teeth broke; it is something arming them was the first thing to SEE.
  #
  #   THE REPAIR is to install the oracle in the tests that model a native node (the node's own
  #   startup call, from a dev-dependency on `dregg-exec-lean`), after which these two teeth need
  #   the seeded archive and move to `lean-hard-mode`. That is a real change to two crates'
  #   dev-dependencies and it is NOT smuggled into this arming pass. Until it lands: do NOT
  #   `#[ignore]` `wing_weld`, do NOT weaken its assertions, and do NOT drop it from the list
  #   above — a declared red is the whole product of arming a test nobody ran.
  feature-gated-prove-teeth:
    name: Feature-gated prove teeth (--features prove, --ignored)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          lfs: true   # include_str!'d staged registries live in LFS (.gitattributes)

      # Same disk reclaim as `binding-teeth` and ci.yml's Linux test job.
      - name: Reclaim runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /usr/local/lib/android /opt/hostedtoolcache/CodeQL \
            /usr/local/share/powershell /usr/share/swift
          sudo docker image prune --all --force || true
          df -h /

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # EXPLICIT TARGETS, PLUS A DISCOVERY FLOOR. `binding-teeth` learned both halves the
      # hard way and this job inherits them:
      #
      #   * EXPLICIT is why armed-teeth survived a five-day blackout that zeroed
      #     `cargo test --workspace`. A named `-p X --test Y` states a claim that can be
      #     read off the file: THESE ran.
      #   * A TRANSCRIBED LIST GOES STALE. So after running, the job re-derives the set from
      #     the tree (`^#![cfg(feature = "prove")]` in any `*/tests/*.rs`) and errors if it
      #     finds a gated test the list does not arm, or if an armed file has vanished. A new
      #     `prove`-gated canary therefore cannot land silently unarmed, and a rename reds the
      #     lane instead of shrinking it. That is the "the glob was narrower than the noun"
      #     lesson, run in the direction that cannot lose a target.
      #
      # `--release` for the same reason as `binding-teeth`: these are FRI folds and debug
      # would not finish. `--no-fail-fast` inside each invocation; `set +e` plus an
      # accumulated status ACROSS invocations, so one red crate cannot hide the other two.
      #
      # ⚠ THE FLOOR IS NOT OPTIONAL HERE, IT IS THE WHOLE POINT — and the premise is MEASURED,
      # not argued. Running the exact same command with the feature dropped, 2026-07-26:
      #
      #   $ cargo test -p dregg-braid-hook --release --no-fail-fast --test weld_canary -- --ignored
      #        Running tests/weld_canary.rs (target/release/deps/weld_canary-dd0b760e771bba83)
      #   test result: ok. 0 passed; 0 failed; 0 ignored; 0 measured; 0 filtered out; finished in 0.00s
      #   MARKER_EXIT=0
      #
      # `ok`. Exit 0. Zero tests, 0.00s, and NO skip line anywhere — the `#![cfg]` made the file
      # an empty crate, so there is nothing left to report being absent. A typo in the feature
      # name, a renamed feature, a `--features` flag lost in an edit: every one of those is
      # indistinguishable from success by exit code. Feeding that log to the `ran=` arithmetic
      # below yields 0, i.e. the floor FIRES on the real failure and passes on the real success.
      # That is the only reason to trust it.
      - name: Arm the feature-gated prove teeth
        run: |
          # `set +e` is load-bearing for the same reason as in `binding-teeth`: GitHub runs
          # `run:` under `bash -eo pipefail`, so without this the first red cargo aborts the
          # step and makes the floor check below unreachable code.
          set +e
          set -uo pipefail

          # Measured 2026-07-26: exactly three `#![cfg(feature = "prove")]` test files exist,
          # carrying 4 `#[ignore]`d tests between them. Floors are a RATCHET — raise them when
          # the set grows; never lower one to make a red lane green.
          FLOOR_PROVE_TESTS=4
          ARMED_FILES="entity-compose/tests/leaf_prove.rs braid-hook/tests/weld_canary.rs dreggnet-companion/tests/wing_weld.rs"

          status=0
          arm() {   # arm <package> <test-target> <logname>
            echo "::group::$1 --features prove --test $2"
            cargo test -p "$1" --features prove --release --no-fail-fast \
              --test "$2" -- --ignored --nocapture 2>&1 | tee "prove-$3.log"
            local rc=${PIPESTATUS[0]}
            echo "armed-teeth(prove): $1/$2 exited $rc"
            [ "$rc" -ne 0 ] && status=1
            echo "::endgroup::"
          }

          # THE COMPOSITION LEAF, entity-bound (2 teeth). The honest composition of a deployed
          # entity mints a foldable leaf whose IN-CIRCUIT commitment byte-matches the host
          # WideHash the `Effect::Custom` row carries; an outcome the ruleset does not license
          # has no satisfying witness and cannot mint a leaf. The relation is the LEAN-authored
          # descriptor (`paramComposeDesc pcRealistic`, byte-pinned in ParamComposeGolden.lean),
          # reached through `include_str!` — no archive needed, which is why this runs hosted.
          arm dregg-entity-compose leaf_prove entity-compose

          # THE OUTCOME→CELL-FIELD WELD (1 tooth). Honest pole first, then the bite: a composed
          # entity whose committed outcome octet disagrees with its published outcome by ONE
          # lane must have no satisfying fold through the deployed app-root node. Measured by
          # hand 2026-07-25: both poles bit, 473.95s, refusal was a `WitnessConflict` on a
          # difference of exactly 1.
          arm dregg-braid-hook weld_canary braid-hook

          # THE WING WELD (1 tooth). The same weld reached from a real in-tree GAME entity —
          # two companions raised on the roost's XP-gated cells — so the property is shown to
          # survive the trip from the substrate to a shipped surface.
          arm dreggnet-companion wing_weld companion

          # ── FLOOR 1: WHAT ACTUALLY EXECUTED ──────────────────────────────────────────
          ran=$(cat prove-*.log \
                 | sed -nE 's/^test result:.* ([0-9]+) passed; ([0-9]+) failed.*/\1 \2/p' \
                 | awk '{s+=$1+$2} END {print s+0}')
          echo "armed-teeth(prove): $ran prove-gated assertion(s) actually executed (floor $FLOOR_PROVE_TESTS)."
          if [ "$ran" -lt "$FLOOR_PROVE_TESTS" ]; then
            echo "::error::only $ran prove-gated tooth(s) executed, below the measured floor of $FLOOR_PROVE_TESTS."
            echo "::error::With the feature OFF these files compile to EMPTY test crates that report"
            echo "::error::0 passed / 0 failed and exit 0 — a green job over tests that do not exist."
            echo "::error::Check that --features prove is still spelled correctly and still enables"
            echo "::error::dep:dregg-circuit-prove. Do not lower the floor to clear this."
            status=1
          fi

          # ── FLOOR 2: DID A NEW GATED TEST LAND UNARMED, OR AN ARMED ONE VANISH? ──────
          for f in $ARMED_FILES; do
            if [ ! -f "$f" ]; then
              echo "::error::armed target $f no longer exists. A rename must RED this lane, never"
              echo "::error::shrink it silently — re-point the arm() call above in the same commit."
              status=1
            fi
          done
          for f in $(git grep -lE '^#!\[cfg\(feature = "prove"\)\]' -- '*/tests/*.rs' | sort); do
            case " $ARMED_FILES " in
              *" $f "*) ;;
              *)
                echo "::error::$f is behind '#![cfg(feature = \"prove\")]' and this job does NOT arm it."
                echo "::error::An unarmed prove-gated test does not merely skip — it does not compile,"
                echo "::error::reports 0 passed, and exits 0. Add an arm() line for it above and raise"
                echo "::error::FLOOR_PROVE_TESTS by its tooth count in the same commit."
                status=1
                ;;
            esac
          done

          exit "$status"

  # THE HARD-MODE LANE. Every load-bearing verified-gate test in `dregg-node` opens with
  # `if !<export>_available() { eprintln!("SKIP"); return; }` — reporting `ok` having asserted
  # NOTHING on an archive-less build. `DREGG_TEST_REQUIRE_LEAN=1` (dregg_lean_ffi::demand_lean)
  # turns every one of those skips into a PANIC, mirroring the DREGG_REQUIRE_LEAN *build* gate.
  # This job is the only thing that makes that hard mode more than an available flag.
  #
  # It requires a seeded `dregg-lean-ffi/libdregg_lean.a`. A hosted runner cannot BUILD one, but it
  # can FETCH the seed lean-seed.yml publishes for Linux-x86_64 — which is what ubuntu-latest is.
  lean-hard-mode:
    name: Verified-gate hard mode (DREGG_TEST_REQUIRE_LEAN=1)
    if: github.event_name != 'pull_request'
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          lfs: true   # include_str!'d staged registries live in LFS (.gitattributes)

      - name: Is a seed release published? (reads dregg-lean-ffi/lean-seed.pin)
        id: pin
        run: |
          set -euo pipefail
          tag="$(sed -n 's/^TAG=//p' dregg-lean-ffi/lean-seed.pin | head -1)"
          if [ -n "$tag" ]; then
            echo "armed=1" >> "$GITHUB_OUTPUT"
            echo "::notice::seed release '$tag' is pinned — arming the verified-gate hard mode."
          else
            echo "armed=0" >> "$GITHUB_OUTPUT"
            echo "::warning::lean-seed.pin TAG is EMPTY — no seed release exists, so the ~43 verified-gate tests behind `if !<x>_available() { SKIP }` CANNOT be armed and this lane is asserting NOTHING about them. Run the 'Publish Lean seed' workflow (needs a self-hosted runner registered with the lean-seed + linux-x86_64 labels); it writes TAG and this lane arms itself."
          fi

      # ⚑ ROUTED THROUGH THE SHARED COMPOSITE (2026-08-07). This used to be four inline lines
      # ending in a bare `bash scripts/fetch-lean-seed.sh` under `set -e`, so a missing asset
      # failed the STEP with the script's own text and nothing else — no owner, no asset name, no
      # command to fix it. Measured 2026-08-07: that is the entire failure of this job on every
      # scheduled run, and the `pin` step above still reports `armed=1` while it happens, because
      # `TAG=lean-seed` is a stable constant and says nothing about whether an asset exists for
      # THIS commit. `.github/actions/lean-seed` names the missing asset, its content key, the
      # owning workflow and the one command that cuts it, in the annotation itself.
      - uses: ./.github/actions/lean-seed
        if: steps.pin.outputs.armed == '1' && !inputs.runner

      # FAIL LOUD, EARLY. Without this the job's first symptom would be a wall of demand_lean
      # panics that read like the gates are broken, when the real cause is a runner with no seed.
      - name: Require a seeded Lean archive (the whole point of this lane)
        if: steps.pin.outputs.armed == '1'
        run: |
          set -euo pipefail
          if [ ! -f dregg-lean-ffi/libdregg_lean.a ]; then
            echo "::error::no dregg-lean-ffi/libdregg_lean.a after fetch. DREGG_TEST_REQUIRE_LEAN=1 asserts the VERIFIED gates actually ran; without the archive every gate would panic for the wrong reason. Check the 'Publish Lean seed' lane cut a Linux-x86_64 asset for THIS commit's CONTENT KEY — platform, toolchain, mathlib rev and the Dregg2.FFI boundary-closure hash (scripts/lean-seed-key.sh --asset prints the exact name). It is no longer the whole-Dregg2 tree hash; see the flag day in dregg-lean-ffi/lean-seed.pin."
            exit 1
          fi
          echo "seed present: $(du -h dregg-lean-ffi/libdregg_lean.a | cut -f1)"

      # The verified-gate unit tests: finality_gate (4), coord_gate, finalization_votes, plus the
      # lean_producer_mode integration tests. Under the hard mode these can no longer self-skip.
      - name: node verified-gate tests, hard mode
        if: steps.pin.outputs.armed == '1'
        env:
          DREGG_TEST_REQUIRE_LEAN: "1"
          DREGG_REQUIRE_LEAN: "1"
        run: cargo test -p dregg-node --release --lib --test lean_producer_mode

      # The real-process soak: 4- and 5-node federations over real QUIC gossip with a validator
      # KILLED mid-run. It no longer pins DREGG_LEAN_PRODUCER=0, so the VERIFIED producer — the
      # production default — is what gets fault-injected; under DREGG_TEST_REQUIRE_LEAN=1 the
      # harness also asserts every launched node reports `state_producer = lean`, so this lane
      # cannot quietly degrade to the Rust producer and still pass.
      #
      # DREGG_TEST_REQUIRE_FINALITY is deliberately NOT set: post-kill cross-node finality is a
      # NAMED OPEN leg (A1), measured non-converging at n=4/n=5 on 2026-07-06 and documented as
      # such in the test's own header. Arming it here would red this lane every run for a reason
      # its authors already wrote down. That is the frontier's job, not the arming lane's.
      - name: consensus-under-failure soak (production producer default)
        if: steps.pin.outputs.armed == '1'
        env:
          DREGG_TEST_REQUIRE_LEAN: "1"
          DREGG_REQUIRE_LEAN: "1"
        run: cargo test -p dregg-node --release --test consensus_under_failure -- --ignored --nocapture

      # R3 ON A REAL DRIVEN GRAIN SESSION. `grain-turn`'s `prover` feature is DEFAULT-ON, so
      # unlike the prove job's targets this one already compiles on every push — but its single
      # test is `#[ignore]`d and lives outside `circuit-prove/tests/`, so no `*tooth*` glob could
      # reach it and `cargo test --workspace` skips it. It ran nowhere. It is the whole R3 leg:
      # a genuine `ToolGateway::invoke` session, finalized into rotated wide-anchored EffectVM
      # legs, decided by the extracted Lean `dregg_grain_r3_verify` — with a wound-#22 width tooth
      # (an anchor byte-identical in LANE 0 and differing only at lane 1, which the pre-repair
      # ~31-bit seam ACCEPTED) and a post-state tamper case.
      #
      # ⚠ IT CARRIES A FAIL-OPEN, AND THAT IS WHY IT IS IN *THIS* JOB. The test opens with
      #   `if !dregg_lean_ffi::grain_r3_verify_core_available() { eprintln!("… not linked"); return; }`
      # and `grain_r3_verify_core_available()` does NOT route through `dregg_lean_ffi::demand_lean`,
      # so DREGG_TEST_REQUIRE_LEAN=1 does NOT convert that skip into a panic the way it does for
      # the node's ~43 verified gates. On an archive-less runner it would report `ok` having
      # asserted nothing. Two consequences, both handled rather than hoped about:
      #   1. it belongs in the SEEDED lane, not the hosted prove job — hence its home here;
      #   2. the seed alone is not enough, because a seed missing THIS export (a stale archive
      #      can lack it while `lean_available()` is true) reproduces the same silent pass. So
      #      the step greps the run's own output for the skip line and fails on it. The gate is
      #      the log, not the exit code.
      # The real repair is routing that accessor through `demand_lean`; until that lands this
      # check is what stops the vacuous green.
      #
      # ⚠ RED AT LANDING, MEASURED 2026-07-26 (archive present, `nm` confirms the archive exports
      # BOTH `_dregg_grain_r3_verify` and `_dregg_constraint_admits`, so the self-skip above did
      # NOT fire and this is a real verdict):
      #
      #     test result: FAILED. 0 passed; 1 failed  —  finished in 0.53s
      #     panicked at grain-turn/tests/r3_grain_adapter.rs:62:10:
      #     the grain turn commits (admitted, in-rate): "tool call execution error: turn error:
      #     program violation on cell 77db5dcf30ace956: no constraint oracle installed: …"
      #
      # It never reaches the finalize or the fold. Same root cause as `wing_weld` in the prove job
      # above — the release-only constraint-oracle fail-closed in `cell/src/program/eval.rs`, and a
      # test process that drives the embedded executor without the node's startup
      # `dregg_exec_lean::register_constraint_oracle()`. Read that job's header for the full
      # diagnosis and the named repair; this is the second member of the same class, and the two
      # were found by the same act of arming teeth that had never run.
      - name: R3 adapter on a real driven grain session (grain-turn --features prover)
        if: steps.pin.outputs.armed == '1'
        env:
          DREGG_TEST_REQUIRE_LEAN: "1"
          DREGG_REQUIRE_LEAN: "1"
        run: |
          set +e
          set -uo pipefail
          cargo test -p grain-turn --features prover --release --no-fail-fast \
            --test r3_grain_adapter -- --ignored --nocapture 2>&1 | tee r3-grain.log
          status=${PIPESTATUS[0]}
          if grep -q 'is not linked' r3-grain.log; then
            echo "::error::r3_grain_adapter SELF-SKIPPED: the linked archive lacks the extracted"
            echo "::error::Lean core 'dregg_grain_r3_verify', so the test returned early and reported"
            echo "::error::'ok' having decided NOTHING. That accessor bypasses demand_lean, so"
            echo "::error::DREGG_TEST_REQUIRE_LEAN=1 could not catch it. Cut a seed whose Dregg2 slice"
            echo "::error::includes Dregg2.Grain.R3Verify; do not delete this check to clear it."
            exit 1
          fi
          ran=$(sed -nE 's/^test result:.* ([0-9]+) passed; ([0-9]+) failed.*/\1 \2/p' r3-grain.log \
                 | awk '{s+=$1+$2} END {print s+0}')
          echo "armed-teeth(r3): $ran R3 assertion(s) actually executed (floor 1)."
          if [ "$ran" -lt 1 ]; then
            echo "::error::the R3 adapter tooth did not execute. grain-turn's 'prover' feature is"
            echo "::error::default-on today; if that changed, this file becomes an EMPTY test crate"
            echo "::error::reporting 0 passed and exiting 0. Re-check the feature, do not drop the step."
            exit 1
          fi
          exit "$status"

  # ─────────────────────────────────────────────────────────────────────────────
  # The missing half of this lane. Everything above ALREADY runs, faithfully, every
  # night — and tells nobody. This workflow is `schedule` + `workflow_dispatch` only,
  # and scheduled workflows are NOT PR checks, so a red tooth here does not block a
  # merge and never appears on the checkmark anyone actually reads. Measured 2026-07-15:
  # 4 passed / 11 FAILED of the 17 armed teeth (8/8 binaries red, root-caused to the
  # `generate_rotated_transfer_shape_wide` ↔ `transferVmDescriptor2R24` producer/descriptor
  # drift) — while ci.yml stayed green through all of it. The honesty was in the header
  # and the logs; the signal people read is a checkmark. This job closes that gap.
  #
  # It does NOT gate anything (arming stays diagnostic, per the header above) — it just
  # makes a red tooth reach a human. A standing issue is refreshed rather than spammed:
  # one issue per outage, a comment per subsequent red run.
  gpui-gated-desktop-teeth:
    name: gpui-gated desktop teeth (--features native-full)
    if: github.event_name != 'pull_request'
    # THE THIRD AXIS: EXPENSIVE-SO-GPUI-GATED (added 2026-07-31).
    #
    # `binding-teeth` closed "expensive, therefore #[ignore]d". `feature-gated-prove-teeth`
    # closed "expensive, therefore behind an off-by-default feature". This closes the same
    # disease one crate over, and it was MEASURED by `scripts/check-never-run-targets.py`,
    # which reds on exactly this:
    #
    #   NEW NEVER-RUN: starbridge-v2 test deos_desktop_transclude_is_verified
    #     (gate=['embedded-executor','gpui-ui'] never-activated-by-an-invocation-that-runs-it=['gpui-ui'])
    #
    # `starbridge-v2`'s `default = ["embedded-executor"]`, so every integration test carrying
    # `#![cfg(feature = "gpui-ui")]` compiles to an EMPTY crate and reports `0 passed; 0 failed`
    # — the silent zero this workflow exists to floor. `starbridge-v2-installers.yml:422` runs
    # `cargo test --release --features desktop --no-run`, which COMPILES these and never fires
    # them: a target can be green in CI and have asserted nothing, forever.
    #
    # WHAT IS BEING ARMED, and why it is worth a self-hosted slot:
    #   * `deos_desktop_transclude_is_verified` — THE ANTI-FORGE TOOTH. Until 2026-07-31 the
    #     desktop transclude gesture was a `format!` string that would interpolate ANY 32 bytes
    #     into a plausible-looking provenanced quote. This test transcludes a cell id the
    #     ledger does not hold and asserts the document is left BYTE-IDENTICAL. It is the only
    #     thing standing between "a live, provenanced quote" as a comment and as a fact.
    #   * the desktop doc/heap and world-explorer integration targets beside it, which are
    #     gated the same way and were equally never executed.
    #
    # ── THREE MORE ARMED 2026-08-01, and they were NEVER-RUN FROM BIRTH ──────────────
    # These landed AFTER the six above were armed, carrying the same
    # `#![cfg(all(feature = "gpui-ui", feature = "embedded-executor"))]`, so they went
    # straight into the silent-zero state without ever passing through
    # `.github/dark-targets.txt` — the sweep reported all three as NEW NEVER-RUN and
    # nothing had ever executed one of them:
    #   * `deos_desktop_composer_has_a_real_entry_point` (1) — the ENTRY-POINT tooth.
    #     Every `DeosDesktop::compose_*` method was private and called only by its own
    #     `bake_compose_*` test hook: a surface the suite proved works and the shipped
    #     desktop could not perform. This drives the REAL `actions_for` context menu and
    #     the REAL row dispatch, with no `bake_compose_*` anywhere in the file, and
    #     asserts the no-document case DIMS the row rather than silently doing nothing.
    #   * `deos_desktop_stitcher_is_the_conflict_surface` (1) — the cutover pin. The
    #     desktop's inline branch/stitch/resolve code and `starbridge_v2::stitcher` were
    #     two implementations of one thing; the inline copy is gone and the desktop now
    #     calls the stitcher. It pins all nine painted `ConflictRow` strings, in paint
    #     order, against a literal captured from the pre-cutover build, plus anti-vacuity
    #     teeth (non-empty rows, both authors' provenance and readings, a live
    #     resolution, and an EMPTY surface after the resolve).
    #   * `deos_desktop_composes_a_doc_from_cells` (2) — the EMBED-ALGEBRA anti-forge
    #     tooth, i.e. the transclude defect one algebra over. `ChildCellId` is an opaque
    #     integer and `add_embed` will place ANY value, so a hand-authored embed of a
    #     cell the World does not hold renders exactly like a real one. The desktop's
    #     compose now runs the same ledger gate `docuverse::publish_live` runs, and this
    #     asserts a forged id yields no patch, no heap write and no revision turn — and
    #     that an honest compose leaves a receipt on the chain and a citation in the
    #     committed heap. Its second test is the reorder/layout-fork leg.
    # MEASURED GREEN BEFORE ARMING, and say exactly what was measured: these THREE were
    # run under the real feature set (`cargo test -p starbridge-v2 --features native-full`
    # + `RUST_MIN_STACK`, 2026-08-01) and reported `ok. 1 passed` / `ok. 1 passed` /
    # `ok. 2 passed`, 0 failed. The floor moves 6 -> 10 on that 4, ON TOP OF the 6 measured
    # 2026-07-31 for the six above — whose files are unchanged at HEAD since (one `#[test]`
    # each, none `#[ignore]`d). The six were NOT re-run in this pass. That is safe in the
    # only direction that matters: `ran=` sums PASSED counts only, so a regression in any of
    # the six would already have breached the floor of 6, and raising it is strictly tighter.
    # A lane that wants the whole set re-measured should run all nine and say so here.
    #
    # ⚠ WHY SELF-HOSTED. `native-full` links gpui (metal/harfbuzz/cosmic-text/objc), libservo
    # via `web-shell`, and the multi-MB verified Lean archive through `dregg-turn`. A hosted
    # runner has ~14 GB of disk after reclaim and cannot finish this. hbox is registered with
    # `self-hosted, lean-seed, linux-x86_64` (see lean-seed.yml) and has the RAM and the disk.
    # The label reuse is honest but imperfect: `lean-seed` names a purpose this lane does not
    # share. If a second self-hosted box is ever registered, give it a `desktop` label and
    # narrow this.
    #
    # ⚠ RUST_MIN_STACK IS LOAD-BEARING, NOT A TUNING KNOB. Without it a thread in
    # `panels_workspace::agent_memory_cockpit_affordance` overflows and the whole test process
    # SIGSEGVs mid-run — which reports as a crashed lane, not a failed assertion, and MASKS
    # every result after it. Measured 2026-07-31: the abort was hiding a real fifth failure.
    runs-on: ${{ inputs.desktop_runner || fromJSON('["self-hosted","lean-seed","linux-x86_64"]') }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          lfs: true

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # ⚑ THE REGISTRY CAP TEETH ARE A `--lib` TARGET, AND `--test` NEVER SELECTS ONE.
      # `app_registry` is `#[cfg(feature = "app-registry")]`, which the DEFAULT feature set
      # does NOT pull (`embedded-executor` deliberately omits it so the wasm bundle stays
      # small — Cargo.toml §`app-registry`). So `cargo test -p starbridge-v2 --lib`, the
      # invocation everyone runs, compiles the whole module out and reports `ok` having
      # never seen it, and the step below only names integration targets. These four teeth
      # decide whether TWENTY registry world-drives can refuse an under-authorized actor;
      # they were unrunnable in CI on both counts until this step. gpui-free and ~20s.
      - name: Arm the registry cap teeth (--lib, app-registry)
        env:
          RUST_MIN_STACK: "33554432"
        run: |
          set +e
          set -uo pipefail
          log=/tmp/cap-teeth.log
          cargo test -p starbridge-v2 --features app-registry --lib cap_tooth_tests \
            --no-fail-fast 2>&1 | tee "$log"
          status=${PIPESTATUS[0]}

          # Measured 2026-08-04: 4 tests, all ok. Same ratchet rule as the floor below —
          # a feature that stops being pulled makes this print `ok. 0 passed` and exit 0.
          ran=$(grep -hoE '^test result: (ok|FAILED)\. [0-9]+ passed' "$log" \
                | grep -oE '[0-9]+ passed' | grep -oE '[0-9]+' | paste -sd+ - | bc)
          ran=${ran:-0}
          echo "armed-teeth(cap): $ran registry cap tooth(s) actually executed (floor 4)."
          if [ "$ran" -lt 4 ]; then
            echo "::error::only $ran registry cap tooth(s) executed, below the measured floor of 4."
            echo "::error::\`app_registry\` is feature-gated; a dropped --features flag compiles the"
            echo "::error::module out and this reports success having tested nothing. Fix the arming;"
            echo "::error::do NOT lower the floor."
            status=1
          fi
          # By name: this is the one that asserts the declared rung is MINIMAL, and the one
          # a rename would silence quietest.
          if ! grep -q 'each_entry_declares_the_narrowest_authority_that_launches' "$log"; then
            echo "::error::the registry MINIMALITY tooth did not run. Without it, every entry"
            echo "::error::re-widening to the lattice top is green again. Update this grep in the"
            echo "::error::same commit as any rename."
            status=1
          fi
          exit $status

      # ⚑ `if: !cancelled()` BECAUSE THE STEP ABOVE CAN GO RED, AND ACTIONS STOPS A JOB AT
      # THE FIRST FAILED STEP. That is precisely how the dark-target ratchet was silenced
      # for ~11h on 2026-08-03 (see `.github/dark-targets.txt`): a red step 6 skipped
      # steps 7/8/9, and every skipped sweep read as "not a failure". Adding a step in
      # front of these teeth without this would put the whole desktop suite behind a gate
      # that can go red — so the arming commit fixes it in the same hunk.
      - name: Arm the gpui-gated desktop teeth
        if: ${{ !cancelled() }}
        env:
          RUST_MIN_STACK: "33554432"
        run: |
          # `set +e` for the same reason as every other job here: GitHub runs `run:` under
          # `bash -eo pipefail`, so the first red cargo would abort the step and make the
          # floor check below UNREACHABLE CODE — a guard on the guard that cannot fire.
          set +e
          set -uo pipefail

          # Measured 2026-07-31 at 6 (six targets, one test each). RAISED to 10 on
          # 2026-08-01 when three more targets were armed: composer-entry-point (1) +
          # stitcher-conflict-surface (1) + composes-a-doc-from-cells (2). RAISED to 13 the
          # same day for every-composer-gesture-is-reachable + typed-resolution-and-blame
          # (3 between them; counted by the auditor running all eleven targets: 13 tests, all
          # ok). A floor is a RATCHET: raise it when the set grows, NEVER lower one to make a
          # red lane green.
          #
          # ⚑ WHY THOSE LAST TWO NEEDED A SEPARATE COMMIT, because the shape recurs. They were
          # authored by one lane in the same wave in which ANOTHER lane armed the previous
          # three. Both behaved correctly in isolation — the arming lane declined to arm two
          # files it had not run, the authoring lane wrote "NOT ARMED" in its report — and the
          # wave still left `check-never-run-targets.py` exiting 1 on every push, because that
          # sweep is the `execution sweep` step of ci.yml's `clippy-correctness` HARD GATE.
          # Nobody owned the SEAM between the two lanes. A new gpui-gated test target is not
          # done when it passes; it is done when it is armed here or listed in dark-targets.txt.
          #
          # RAISED to 15 on 2026-08-04 for exchange-floor-cap-tooth (2), armed in the SAME
          # commit that authored it — the seam above, owned. That gate could not have lived
          # in `exchange_floor.rs`'s own `mod tests`: `deos_desktop` is gpui-gated and NO
          # invocation anywhere runs `-p starbridge-v2 --lib` with `gpui-ui` on, so a unit
          # test there is dark in a way no sweep reports (the lib target DOES run — on the
          # default feature set, where the module is `cfg`'d out entirely).
          FLOOR_DESKTOP_TESTS=15

          log=/tmp/gpui-teeth.log
          cargo test -p starbridge-v2 --features native-full \
            --test deos_desktop_transclude_is_verified \
            --test deos_desktop_editor_types_to_heap \
            --test deos_desktop_conflict_is_a_state \
            --test deos_desktop_world_explorer_and_spotter \
            --test two_instance_multiplayer_session \
            --test branch_stitch_settlement_sound_multiplayer \
            --test deos_desktop_composer_has_a_real_entry_point \
            --test deos_desktop_stitcher_is_the_conflict_surface \
            --test deos_desktop_composes_a_doc_from_cells \
            --test deos_desktop_every_composer_gesture_is_reachable \
            --test deos_desktop_typed_resolution_and_blame \
            --test deos_desktop_exchange_floor_cap_tooth \
            --no-fail-fast 2>&1 | tee "$log"
          status=${PIPESTATUS[0]}

          # ── FLOOR: WHAT ACTUALLY EXECUTED ────────────────────────────────────────────
          # The exit code is NOT the verdict. A `#![cfg]`-emptied crate exits 0 having run
          # nothing, which is precisely the failure this lane exists to catch, so the count
          # of ASSERTIONS THAT RAN is the only trustworthy signal.
          ran=$(grep -hoE '^test result: (ok|FAILED)\. [0-9]+ passed' "$log" \
                | grep -oE '[0-9]+ passed' | grep -oE '[0-9]+' \
                | paste -sd+ - | bc)
          ran=${ran:-0}
          echo "armed-teeth(desktop): $ran gpui-gated assertion(s) actually executed (floor $FLOOR_DESKTOP_TESTS)."
          if [ "$ran" -lt "$FLOOR_DESKTOP_TESTS" ]; then
            echo "::error::only $ran gpui-gated tooth(s) executed, below the measured floor of $FLOOR_DESKTOP_TESTS."
            # ⚠ THE BACKTICKS ARE ESCAPED ON PURPOSE. An unescaped backtick inside a
            # double-quoted bash string is COMMAND SUBSTITUTION, and this exact line shipped
            # broken for one edit: it printed "::error::A  target with the feature off
            # reports" — the `#![cfg(...)]` silently deleted, because bash ran it as a command
            # (a leading # made it an empty comment). An error message about silent failure,
            # failing silently. Every backtick below is \` for that reason.
            echo "::error::A \`#![cfg(feature = \"gpui-ui\")]\` target with the feature off reports"
            echo "::error::\`ok. 0 passed\` and EXITS 0 — a dropped --features flag, a renamed"
            echo "::error::feature or a deleted target is indistinguishable from success by exit"
            echo "::error::code. Fix the arming; do NOT lower the floor to clear this."
            status=1
          fi

          # ── THE ANTI-FORGE TOOTH BY NAME ─────────────────────────────────────────────
          # The floor above counts; this asserts the ONE test whose absence would be quietest.
          # It is the flagship's only guarantee that a transclusion cannot be forged, and a
          # rename would slip past a pure count.
          if ! grep -q 'transcluding_an_unpublished_cell_leaves_the_document_unchanged_and_refuses' "$log"; then
            echo "::error::the anti-forge tooth did not run. Until 2026-07-31 the desktop"
            echo "::error::transclude gesture would render ANY 32 bytes as a provenanced quote;"
            echo "::error::this test is what makes that false. If it was renamed, update this"
            echo "::error::grep in the same commit."
            status=1
          fi

          exit $status


  page-on-red:
    name: Page a human when a tooth is red
    needs: [binding-teeth, dark-binding-teeth, feature-gated-prove-teeth, lean-hard-mode, gpui-gated-desktop-teeth]
    # `always()` so this still runs after the teeth job fails; fire only on a real
    # failure (never on cancelled/skipped — lean-hard-mode is dispatch-gated and is
    # `skipped` on every scheduled run).
    #
    # `feature-gated-prove-teeth` is listed here for the reason it exists at all: a job
    # nobody is paged for is the same shape of nothing as a test nobody runs.
    #
    # ⚑ `gpui-gated-desktop-teeth` was added 2026-08-01 for EXACTLY that reason, and it had
    # been missing since the job was written the previous day. Eleven armed desktop targets —
    # including the anti-forge tooth that is the only thing stopping the transclude gesture
    # rendering ANY 32 bytes as a provenanced quote — could go red nightly and page nobody.
    # The job existed, floored what it executed, and reported into silence: a gate whose red
    # nobody receives is a gate nobody has. Found by the lane that armed three more teeth into
    # it, which is the reason to make an arming lane check its own delivery path.
    #
    # ⚑ `dark-binding-teeth` joined on 2026-08-07 IN THE SAME COMMIT that created it — the
    # lesson above, applied at birth rather than a day later. A job that arms 71 teeth nothing
    # had ever run, and whose red reaches nobody, has moved the silence rather than ended it.
    if: >-
      ${{ always() && github.event_name != 'pull_request'
          && (needs.binding-teeth.result == 'failure'
              || needs.dark-binding-teeth.result == 'failure'
              || needs.feature-gated-prove-teeth.result == 'failure'
              || needs.lean-hard-mode.result == 'failure'
              || needs.gpui-gated-desktop-teeth.result == 'failure') }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or refresh the standing red-teeth issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # `gh` resolves the target repo from the local git remote; these jobs deliberately do
          # not check out (they only need to file an issue), so without GH_REPO every one of them
          # died on `fatal: not a git repository` and NO human was ever paged for a red main.
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TEETH: ${{ needs.binding-teeth.result }}
          PROVE: ${{ needs.feature-gated-prove-teeth.result }}
          LEAN: ${{ needs.lean-hard-mode.result }}
          DESKTOP: ${{ needs.gpui-gated-desktop-teeth.result }}
        run: |
          set -euo pipefail
          TITLE='armed-teeth: a deployed binding tooth is RED'
          {
            printf '%s\n\n' "The nightly **Armed teeth** lane failed: ${RUN_URL}"
            printf '%s\n' "- \`binding-teeth\`: **${TEETH}**"
            printf '%s\n' "- \`gpui-gated-desktop-teeth\`: **${DESKTOP}**"
            printf '%s\n' "- \`feature-gated-prove-teeth\`: **${PROVE}** (the \`--features prove\` weld canaries)"
            printf '%s\n\n' "- \`lean-hard-mode\`: **${LEAN}** (dispatch-gated; \`skipped\` on scheduled runs)"
            printf '%s\n' 'These are the DEPLOYED light-client binding teeth. This lane is `schedule` +'
            printf '%s\n' '`workflow_dispatch` only, so it is **not** a PR check — a red tooth here blocks'
            printf '%s\n' 'nothing and is invisible on the checkmark. That is exactly why this issue exists:'
            printf '%s\n\n' 'the tests already ran and already knew; the signal just never reached anyone.'
            printf '%s\n' 'Triage the run, then either fix the tooth or record in the workflow header why it'
            printf '%s\n' 'is expected-red (the header is already scrupulous about this — keep it that way).'
          } > /tmp/body.md
          EXISTING="$(gh issue list --state open --search "${TITLE} in:title" --json number --jq '.[0].number // empty')"
          if [ -n "${EXISTING}" ]; then
            gh issue comment "${EXISTING}" --body-file /tmp/body.md
            echo "refreshed existing issue #${EXISTING}"
          else
            gh issue create --title "${TITLE}" --body-file /tmp/body.md
          fi

  # ─────────────────────────────────────────────────────────────────────────────
  # THE PR-VISIBLE HALF. Runs on `pull_request` only, runs no folds, costs seconds.
  # It answers the one question a reviewer cannot otherwise ask from the checkmark:
  # "are the deployed binding teeth currently biting, and is the nightly still alive?"
  #
  # It reads the workflow's OWN run history through the API rather than re-running
  # anything. Two hard reds, both argued in the `on:` block above: a failing last
  # nightly, and a schedule that has stopped firing.
  nightly-verdict:
    name: Nightly armed-teeth verdict (mirrored onto this PR)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - name: Read the last completed scheduled run of this workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # `gh` resolves the target repo from the local git remote; these jobs deliberately do
          # not check out (they only need to file an issue), so without GH_REPO every one of them
          # died on `fatal: not a git repository` and NO human was ever paged for a red main.
          GH_REPO: ${{ github.repository }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          # A fork PR gets a read-only token that cannot always reach the Actions API.
          # Say so and pass rather than red a contributor's PR for our infrastructure.
          if ! runs=$(gh api "repos/${REPO}/actions/workflows/armed-teeth.yml/runs?event=schedule&status=completed&per_page=1" 2>/dev/null); then
            echo "::notice::Actions API unreachable from this PR (fork token). Nightly verdict not mirrored."
            exit 0
          fi
          count=$(printf '%s' "$runs" | jq -r '.total_count // 0')
          if [ "$count" -eq 0 ]; then
            echo "::error::this workflow has NO completed scheduled run. Either the nightly has"
            echo "::error::never fired, or GitHub disabled the schedule (it does this silently on"
            echo "::error::repositories with no recent activity). The deployed binding teeth are"
            echo "::error::therefore running NOWHERE, which is the state this workflow was created"
            echo "::error::to end. Trigger it once via workflow_dispatch and confirm the cron fires."
            exit 1
          fi
          concl=$(printf '%s' "$runs" | jq -r '.workflow_runs[0].conclusion')
          when=$(printf '%s'  "$runs" | jq -r '.workflow_runs[0].updated_at')
          url=$(printf '%s'   "$runs" | jq -r '.workflow_runs[0].html_url')
          age_h=$(( ( $(date -u +%s) - $(date -u -d "$when" +%s) ) / 3600 ))
          {
            echo "### Nightly armed-teeth verdict"
            echo
            echo "- last scheduled run: **${concl}** (${age_h}h ago)"
            echo "- run: ${url}"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "last scheduled run: ${concl}, ${age_h}h ago — ${url}"

          # 1. THE SCHEDULE IS DEAD. Nothing else in this repository can notice this:
          #    `page-on-red` only fires from inside a run that happened.
          if [ "$age_h" -gt 48 ]; then
            echo "::error::the last completed scheduled armed-teeth run is ${age_h}h old (cron is"
            echo "::error::daily). The nightly has stopped firing — GitHub disables schedules"
            echo "::error::silently — so the deployed binding teeth are once again running nowhere."
            echo "::error::Re-enable the schedule; do not delete this check to clear it."
            exit 1
          fi

          # 2. THE TEETH ARE RED. Deliberately merge-blocking: a review conducted against a
          #    green wall while the deployed binding teeth are broken is a review of a claim
          #    nobody checked. The escape is fixing the teeth (see the header's root-cause
          #    note on the producer/descriptor drift), never muting this job.
          if [ "$concl" != "success" ]; then
            echo "::error::the last nightly armed-teeth run concluded '${concl}'. The DEPLOYED"
            echo "::error::light-client binding teeth are not biting. This blocks the PR on"
            echo "::error::purpose: ci.yml stayed green through 11 of 17 teeth failing every night"
            echo "::error::and the checkmark said nothing. Triage ${url}."
            exit 1
          fi
          echo "nightly armed-teeth: green (${age_h}h ago)."
