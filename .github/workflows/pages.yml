name: Deploy deos to GitHub Pages

# A LAYERED static site: a sober landing that opens into the live, in-browser,
# node-LESS deos. The verified executor runs CLIENT-SIDE in the visitor's own
# WebAssembly tab (no backend server — GitHub Pages is static).
#   /              the sober landing (what-is / play / quickstart / does / enables)
#   /deos/         the deos cockpit (WebImage model skin) — land IN deos, fire a real turn
#   /cockpit-gpui/ the FULL gpui renderer on a WebGPU canvas (same in-tab executor)
#   /cards/        the deos-js card gallery (counter · inspector · tally · kv-store · doc-collab)
#   /explorer/     caps-as-rows (your capabilities expressed as the rows you may read)
#   /light-client/ verify a whole finalized history in ONE recursive proof, in-tab
#   /paper/        the paper landing + PDF compiled from paper/main.typ in this run
#   /papers/direct-logic-arithmetization/direct-logic-arithmetization.pdf
#                  the direct-logic research report, when its Typst source exists
#   /atlas/        the interactive atlas
#   /wasm-provenance.html + /wasm-provenance.json
#                  WHAT WASM THIS DEPLOY ACTUALLY SHIPPED, and from where
#
# ── THIS IS THE FAST PATH. IT DOES NOT BUILD WASM. ──────────────────────────────────
# Typst + a cargo-free `REUSE_WASM=1` assembly + deploy. No cargo, no wasm-pack, no
# `cargo run` anywhere in it. The three `wasm-pack build --release` jobs that used to live
# here — and whose weight is the entire reason this workflow was `workflow_dispatch`-only —
# now live in `.github/workflows/pages-wasm.yml`, on a weekly schedule. That split is what
# buys push-to-publish for the website, and it is what finally gives `--features gpui-web`
# a recurring trigger instead of no coverage at all.
#
# ── IT DEPLOYS EVEN WHEN THE WASM IS MISSING OR STALE. THAT IS DELIBERATE. ──────────
# A red deploy job blocks a typo fix on the landing page, which is exactly the coupling
# this split removes. So a missing or weeks-old wasm artifact NEVER fails this workflow.
# Instead the degradation is made visible IN THE RENDERED SITE:
#   * every wasm-serving page carries <meta name="dregg-wasm-provenance"> naming the run,
#     commit, build time, age and what was missing;
#   * a surface whose wasm is absent gets an in-page MISSING-wasm marker, and a surface
#     whose page cannot exist at all gets a marker PAGE where a bare 404 would be;
#   * a surface older than WASM_STALE_DAYS gets a visible STALE marker;
#   * /wasm-provenance.{json,html} record the whole thing, durably, per deploy.
# The invariant is NO SILENT DEGRADATION, not "no degradation". Failures belong to
# `pages-wasm.yml`; this workflow's job is to publish the site, always.
# See scripts/stamp-wasm-provenance.sh, which does the stamping and the marking.
#
# ── WHAT STILL NEEDS THE HEAVY PATH ─────────────────────────────────────────────────
# The BAKED card gallery pages (`cards-baked`) are produced by a `cargo run` example, so
# editing the card templates in `deos-view/` needs a `pages-wasm.yml` run — not just a push.
# Everything under `site/`, `paper/`, `papers/` and `dregg-atlas/site/` is pure fast path.
#
# ── HOW TO RUN IT ───────────────────────────────────────────────────────────────────
#   (push to main touching the paths below)         the site republishes automatically
#   gh workflow run "Deploy deos to GitHub Pages" --ref main
#                                                   re-deploy now, reusing the newest wasm
#   gh workflow run "Deploy deos to GitHub Pages" --ref main -f wasm_source_run_id=12345
#                                                   re-deploy pinned to one heavy run
#   gh workflow run "Build the Pages wasm surfaces" --ref main
#                                                   THE FULL BUILD: rebuilds all three wasm
#                                                   surfaces, then the workflow_run trigger
#                                                   below assembles and deploys from them
on:
  push:
    branches: [main]
    # Everything scripts/build-pages-dist.sh reads that is NOT a wasm artifact. Kept
    # exhaustive on purpose; a dispatch covers anything this list misses.
    paths:
      - "site/**"
      - "paper/**"
      - "papers/**"
      - "dregg-atlas/site/**"
      - "starbridge-v2/web/cockpit_gpui.html"
      - "scripts/build-pages-dist.sh"
      - "scripts/stamp-wasm-provenance.sh"
      - "scripts/check-web-surface-teeth.sh"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
    inputs:
      wasm_source_run_id:
        description: "Pin the wasm to one pages-wasm.yml run id (blank = newest run that has the artifacts)"
        type: string
        default: ""
  workflow_run:
    # A finished heavy run publishes its surfaces straight to the site, so dispatching
    # pages-wasm.yml remains a ONE-COMMAND full build ending in a deploy.
    workflows: ["Build the Pages wasm surfaces"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read   # listing + downloading another workflow run's artifacts

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # ── WHERE THE WASM COMES FROM ──────────────────────────────────────────────────────
  WASM_SOURCE_WORKFLOW: pages-wasm.yml
  # ── THE ONE LINE THAT REPOINTS PAGES AT RELEASE ARTIFACTS ──────────────────────────
  # Empty = the newest `pages-wasm.yml` run on ANY ref that still retains the artifacts.
  # To make Pages serve a RELEASE's wasm instead, set this to the tag name — e.g.
  #     WASM_SOURCE_HEAD: "v0.1.0"
  # and the resolver will only ever consider the heavy run that tag triggered
  # (pages-wasm.yml already builds on `push: tags: [v*]`, so such a run exists). That is
  # the whole change: one line, no new plumbing. There is no release process here to
  # invent — this just pins consumption to a tag once one exists.
  WASM_SOURCE_HEAD: ""
  # Older than this and the deployed pages carry a visible STALE marker. 10 days is
  # deliberately just over pages-wasm.yml's weekly cadence: one missed run shows up.
  WASM_STALE_DAYS: "10"

jobs:
  # ── cargo-free assembly: typst + the script's REUSE_WASM mode + the stamp + upload ──
  assemble:
    runs-on: ubuntu-latest
    steps:
      # ⚑ LFS IS BEST-EFFORT, NOT A PRECONDITION (2026-07-27). `lfs: true` here made the
      # ENTIRE SITE undeployable the moment the repo hit its LFS budget: every recent Pages
      # run failed inside actions/checkout, before a single line of our code ran —
      #   "This repository exceeded its LFS budget."
      # The only LFS content the site wants is the atlas screenshots. Losing those must cost
      # us the screenshots, NOT the deploy — the same staging posture we took for wasm: ship
      # the site, mark what is missing. A billing limit is not a reason to have no website.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          lfs: false

      - name: Fetch LFS media (best-effort — a budget failure must not block the deploy)
        continue-on-error: true
        run: git lfs pull --include="dregg-atlas/site/screenshots/*" || true

      - name: Install Typst for the papers
        uses: typst-community/setup-typst@48aeee7543d37f01afd1ffb27307dc277387ba13 # v4.3.1
        with:
          typst-version: "0.15.0"

      - name: Resolve which pages-wasm.yml run supplies the wasm surfaces
        id: wasm
        # NEVER FAILS. If it cannot find a usable run it says so loudly and reports
        # found=false; the assembly then produces a site that declares the absence on
        # every affected page. `set -e` is deliberately NOT on.
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          OVERRIDE_RUN_ID: ${{ inputs.wasm_source_run_id }}
          TRIGGER_RUN_ID: ${{ github.event.workflow_run.id }}
          SITE_SHA: ${{ github.sha }}
        run: |
          set -uo pipefail
          REQUIRED="wasm-webimage wasm-cards cards-baked"

          # Candidates in priority order. One code path, so there is no second, subtly
          # different resolution rule to drift: an explicit pin, then the heavy run that
          # triggered us (workflow_run), then the newest completed heavy runs.
          candidates=""
          [ -n "${OVERRIDE_RUN_ID:-}" ] && candidates="$OVERRIDE_RUN_ID"
          [ -n "${TRIGGER_RUN_ID:-}" ] && candidates="$candidates $TRIGGER_RUN_ID"

          # status=completed, NOT status=success. The real question is "does this run have
          # the artifacts I need", and a heavy run whose gpui job failed still has perfectly
          # good webimage + cards. Filtering on success would discard them and leave the
          # site with no wasm because an unrelated surface broke.
          q="repos/$REPO/actions/workflows/$WASM_SOURCE_WORKFLOW/runs?status=completed&per_page=30"
          [ -n "${WASM_SOURCE_HEAD:-}" ] && q="$q&branch=$WASM_SOURCE_HEAD"
          more="$(gh api "$q" --jq '.workflow_runs[].id' 2>/dev/null)" || more=""
          candidates="$candidates $more"

          FOUND=""; NAMES=""
          for id in $candidates; do
            [ -n "$id" ] || continue
            names="$(gh api "repos/$REPO/actions/runs/$id/artifacts?per_page=100" \
                       --jq '.artifacts[] | select(.expired | not) | .name' 2>/dev/null)" || names=""
            ok=1
            for r in $REQUIRED; do
              printf '%s\n' "$names" | grep -qx "$r" || ok=0
            done
            if [ "$ok" = "1" ]; then FOUND="$id"; NAMES="$names"; break; fi
          done

          if [ -z "$FOUND" ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "gpui=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=No wasm artifacts available::No completed '$WASM_SOURCE_WORKFLOW' run retains wasm-webimage + wasm-cards + cards-baked (90-day artifact retention lapsed, or none has ever run). The site WILL deploy, with every wasm surface marked MISSING in the rendered page. Fix by running: gh workflow run \"Build the Pages wasm surfaces\" --ref main"
            {
              echo "### wasm resolution: NOTHING FOUND"
              echo
              echo "No completed \`$WASM_SOURCE_WORKFLOW\` run retains all of"
              echo "\`wasm-webimage\` + \`wasm-cards\` + \`cards-baked\`."
              echo "Deploying the static content anyway, with in-page MISSING markers."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          meta="$(gh api "repos/$REPO/actions/runs/$FOUND" \
                    --jq '[.head_sha, .head_branch, .run_started_at, .html_url, .conclusion] | @tsv' 2>/dev/null)" || meta=""
          head_sha="$(printf '%s' "$meta" | cut -f1)"
          head_branch="$(printf '%s' "$meta" | cut -f2)"
          started="$(printf '%s' "$meta" | cut -f3)"
          html_url="$(printf '%s' "$meta" | cut -f4)"
          conclusion="$(printf '%s' "$meta" | cut -f5)"

          gpui=false
          printf '%s\n' "$NAMES" | grep -qx 'wasm-gpui' && gpui=true

          # How far the site content has moved past the wasm. One compare call — no deep
          # clone needed, so the checkout stays shallow and this job stays fast.
          ahead="$(gh api "repos/$REPO/compare/$head_sha...$SITE_SHA" --jq '.ahead_by' 2>/dev/null)" || ahead=""

          {
            echo "found=true"
            echo "run_id=$FOUND"
            echo "run_url=$html_url"
            echo "head_sha=$head_sha"
            echo "head_branch=$head_branch"
            echo "started=$started"
            echo "gpui=$gpui"
            echo "commits_ahead=$ahead"
          } >> "$GITHUB_OUTPUT"

          echo "resolved wasm source: run $FOUND ($html_url) conclusion=$conclusion gpui=$gpui"
          if [ "$conclusion" != "success" ]; then
            echo "::warning title=Reusing wasm from a RED heavy run::run $FOUND concluded '$conclusion' but retains the required artifacts, so they are being used. Check $html_url for which surface broke."
          fi

      # continue-on-error on ALL of these: a download hiccup must degrade the SITE, never
      # fail the deploy. Whatever fails to land is marked in the rendered page by the stamp.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: ${{ steps.wasm.outputs.found == 'true' }}
        continue-on-error: true
        with:
          name: wasm-webimage
          path: starbridge-v2/web/pkg
          run-id: ${{ steps.wasm.outputs.run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        # Absent whenever the source run shipped without it (the gpui job was skipped by a
        # dispatch input, or its documented matrix+zed sqlite3 wall bit). /cockpit-gpui/
        # then becomes a marker page naming this artifact.
        if: ${{ steps.wasm.outputs.found == 'true' && steps.wasm.outputs.gpui == 'true' }}
        continue-on-error: true
        with:
          name: wasm-gpui
          path: starbridge-v2/web/pkg-gpui
          run-id: ${{ steps.wasm.outputs.run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: ${{ steps.wasm.outputs.found == 'true' }}
        continue-on-error: true
        with:
          name: wasm-cards
          path: wasm/pkg
          run-id: ${{ steps.wasm.outputs.run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: ${{ steps.wasm.outputs.found == 'true' }}
        continue-on-error: true
        with:
          name: cards-baked
          path: deos-view/target/web-out/dist
          run-id: ${{ steps.wasm.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Assemble the layered deos site (REUSE_WASM — no cargo in this job)
        # The script's REUSE_WASM mode: it assembles from the pkgs above, records what was
        # and was not there, runs the browser-surface teeth against the exact bundles that
        # are shipping, and finishes by stamping provenance + markers into the dist. In this
        # mode a missing surface or a bitten tooth is REPORTED IN THE SITE, not fatal — see
        # the script header for why the polarity differs from a full build.
        env:
          WASM_PROV_SOURCE: ${{ steps.wasm.outputs.found == 'true' && 'reused-run' || 'none-available' }}
          WASM_PROV_RUN_ID: ${{ steps.wasm.outputs.run_id }}
          WASM_PROV_RUN_URL: ${{ steps.wasm.outputs.run_url }}
          WASM_PROV_COMMIT: ${{ steps.wasm.outputs.head_sha }}
          WASM_PROV_HEAD: ${{ steps.wasm.outputs.head_branch }}
          WASM_PROV_BUILT_AT: ${{ steps.wasm.outputs.started }}
          WASM_PROV_COMMITS_BEHIND: ${{ steps.wasm.outputs.commits_ahead }}
          WASM_PROV_SITE_COMMIT: ${{ github.sha }}
        run: REUSE_WASM=1 scripts/build-pages-dist.sh

      - name: Sanity-check the dist
        run: |
          set -euo pipefail
          # ── THE STATIC CONTENT: hard requirements. This is what the fast path exists to
          # ship, so its absence IS a deploy failure.
          test -f site/dist/index.html
          test -f site/dist/assets/style.css
          grep -q 'A turn is the exercise' site/dist/index.html
          # the paper landing + PDF, compiled from paper/main.typ in this run
          test -f site/dist/paper/index.html
          test -s site/dist/paper/dregg.pdf
          test "$(head -c 5 site/dist/paper/dregg.pdf)" = '%PDF-'
          # The direct-logic report becomes a required, freshly compiled Pages
          # artifact as soon as its source lands. Until then, keep deploys green.
          report_src=papers/direct-logic-arithmetization/main.typ
          report_pdf=site/dist/papers/direct-logic-arithmetization/direct-logic-arithmetization.pdf
          if [ -f "$report_src" ]; then
            test -s "$report_pdf"
            test "$(head -c 5 "$report_pdf")" = '%PDF-'
          else
            test ! -e "$report_pdf"
          fi
          # the reclaimed surfaces
          test -f site/dist/explorer/index.html
          test -f site/dist/explorer/caps-as-rows.js
          test -f site/dist/light-client/index.html
          # dregg.works — the trustless-host front door + the injectable verify badge
          test -f site/dist/dregg-works/index.html
          test -s site/dist/dregg-works/verify-badge.js
          grep -q 'cannot tamper' site/dist/dregg-works/index.html
          # the real pre-folded whole-history aggregate the light-client page verifies in-tab
          test -s site/dist/light-client/history.json
          # the atlas + its materialized (non-LFS-stub) images
          test -f site/dist/atlas/index.html
          # The atlas image MUST exist AND not be an unmaterialized LFS pointer. The old
          # `head -c 20 … | grep -q` form was TWICE-blind: (1) `2>/dev/null` on a MISSING
          # file made the pipe empty, grep -q returned no-match, and a wholly-absent image
          # sailed through as "fine"; (2) under `set -o pipefail`, grep -q exiting on the
          # first matched line SIGPIPEs `head`, so a genuine pointer could flip the pipeline
          # to non-zero and be read as "no pointer". Capture the header (existence is a hard
          # `test -f`, so absence fails LOUD) and match with `case` — no pipe, no SIGPIPE.
          # ⚑ STAGING: the atlas images are LFS-backed and the repo is over its LFS budget, so
          # they may be absent or left as pointer stubs. That must cost us the SCREENSHOTS, not
          # the deploy — the whole point of making the LFS fetch best-effort above. This reports
          # and continues. (When the budget is restored, or the images stop being LFS-tracked,
          # turn these back into hard failures: that is the point at which "the atlas renders"
          # becomes a claim rather than a hope.)
          atlas_img=site/dist/atlas/ui-states/HOME_.jpg
          if [ ! -f "$atlas_img" ]; then
            echo "NOTE (staging): atlas image $atlas_img absent — LFS not materialized; atlas ships without screenshots"
          else
            atlas_hdr="$(head -c 20 "$atlas_img")"
            case "$atlas_hdr" in
              'version https://gi'*)
                echo "NOTE (staging): atlas image is an unmaterialized LFS pointer — atlas ships without screenshots" ;;
            esac
          fi

          # ── THE WASM SURFACES: presence is NOT required. What IS required is that the
          # site never lies about them. For each surface: the provenance record must agree
          # with what is actually on disk, and an absent one must SAY SO on its own route.
          # A gate that cannot go red is not a gate, so this one bites on silence — a
          # surface that vanished without a marker fails the deploy even though the missing
          # wasm itself does not.
          test -s site/dist/wasm-provenance.json
          test -s site/dist/wasm-provenance.html
          python3 - <<'PY'
          import json, os, sys
          d = json.load(open("site/dist/wasm-provenance.json"))
          # the page that each surface's own route serves
          ROUTE_PAGE = {
              "webimage": "deos/index.html",
              "cockpit_gpui": "cockpit-gpui/index.html",
              "cards": "cards/index.html",
          }
          bad = []
          for key, s in d["surfaces"].items():
              blob = os.path.join("site/dist", s["blob"])
              on_disk = os.path.exists(blob) and os.path.getsize(blob) > 0
              if on_disk != s["included"]:
                  bad.append(f"{key}: record says included={s['included']}, on disk={on_disk}")
              page = os.path.join("site/dist", ROUTE_PAGE[key])
              if not os.path.exists(page):
                  bad.append(f"{key}: route page {ROUTE_PAGE[key]} is missing entirely "
                             f"(the stamp should have stood a marker page up)")
                  continue
              html = open(page, encoding="utf-8", errors="replace").read()
              if 'name="dregg-wasm-provenance"' not in html:
                  bad.append(f"{key}: {ROUTE_PAGE[key]} carries no provenance meta tag")
              if not on_disk and ("dregg-provenance-marker" not in html
                                  and "is not in this build" not in html):
                  bad.append(f"{key}: wasm is ABSENT and {ROUTE_PAGE[key]} does not say so "
                             f"— that is the silent degradation this check exists to catch")
          if bad:
              print("ERROR: the deployed site misdescribes its own wasm:")
              for b in bad:
                  print("  - " + b)
              sys.exit(1)
          w = d["wasm"]
          age = f"{w['age_days']}d" if w["age_days"] is not None else "unknown"
          print(f"wasm: source={w['source']} run={w['run_id']} age={age} "
                f"stale={w['stale']} included={d['included']} missing={d['missing']}")
          PY
          echo "dist OK: $(find site/dist -type f | wc -l) files"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: site/dist

  deploy:
    needs: assemble
    if: ${{ !cancelled() && needs.assemble.result == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
