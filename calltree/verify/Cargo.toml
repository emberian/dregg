# dregg-calltree-verify — the STRANGER's verifier for a recorded call tree (initiative 9).
# Light on purpose: it links the tlsn extraction (dregg-zkoracle-live) and nothing of the grain
# executor, so it builds without the Lean static archive. Acceptance is the Lean exe
# `calltree-check`; this binary only extracts what each presentation authenticates.
[package]
name = "dregg-calltree-verify"
version = "0.1.0"
edition = "2024"

[workspace]

[[bin]]
name = "dregg-calltree-verify"
path = "src/main.rs"

[dependencies]
dregg-zkoracle-live = { path = "../../zkoracle-live" }
serde_json = "1"
hex = "0.4"
anyhow = "1"

# ── [patch] sections copied from the root Cargo.toml, keeping only the patches this crate's graph uses (cargo reported the others unused; their paths need not exist in a sparse checkout) (paths re-rooted to ../);
# [patch] applies only from the workspace root, and this crate is its own workspace.
[patch."https://github.com/o1-labs/proof-systems"]
# ─────────────────────────────────────────────────────────────────────────────
[patch."https://github.com/Plonky3/Plonky3"]
# Exact 82cfad73 `p3-fri` source with one additive backend-injection seam.  All
# other p3 crates remain pinned to that same git revision; the local crate's
# manifest repeats those pins so the field/MMCS types cannot split by source.
p3-fri = { path = "../../vendor/plonky3-fri-82cfad73" }
# ⚑ THE PROVER IS BYTE-DETERMINISTIC AGAIN. Exact 82cfad73 `p3-challenger` source with ONE
# delta: the five PoW `grind` sites take rayon's ORDERED finders (`find_first` /
# `find_map_first`) instead of the unordered `find_any` / `find_map_any`.
#
# Upstream returns whichever worker chunk finishes first, so two runs of the same binary on the
# same transcript pick different (equally valid) PoW witnesses. The witness is absorbed into
# Fiat-Shamir BEFORE the query indices are drawn, so the whole proof — opened values, varint
# lengths, total bytes — moves run to run. Measured 2026-07-31: three rayon runs, three distinct
# apex/terminal/shrink lengths; the serial fallback (which implements `find_any` as
# `Iterator::find`) reproduced its own bytes exactly. Two live byte-parity tests assumed
# determinism and flaked (`gpu_outer_config_synthetic_stark_byte_identical_to_cpu` 3/8;
# `decider_experiments::d3` 7/10), plus several `#[ignore]`d GPU parity gates.
#
# NOT a flag day and NOT a soundness change: no PoW knob moves, the verifier still checks only
# `check_witness` VALIDITY, and `recursion_vk_fingerprint` hashes circuit SHAPE (it excludes the
# pow witness, opened values and query proofs) so the VK was already invariant — verified
# identical across serial and both rayon runs in that measurement. What changes is that the
# emitted PROOF BYTES are now reproducible, and that rayon-on now agrees with rayon-off.
p3-challenger = { path = "../../vendor/plonky3-challenger-82cfad73" }
# ─────────────────────────────────────────────────────────────────────────────
[patch.crates-io]
# Exact fhe 0.1.1 source with ONE additive, feature-gated seam: a canonical wire
# codec for `mbfv::RelinKeyShare` (`mbfv-share-codec`). Upstream makes the
# multiparty relinearization share fully opaque — `pub(crate)` fields, no
# accessor, no Serialize impl anywhere in `mbfv` — so the relin ceremony
# physically cannot cross a process boundary, and the dregg committee runs its
# parties as SEPARATE PROCESSES. The seam adds no cryptography: polynomials ride
# `fhe_math::rq::Poly`'s own public exact round-trip codec and the rebuilt share
# is the struct the in-process path already builds. All BFV/mbfv protocol code is
# byte-identical to 0.1.1. See vendor/fhe-dregg/Cargo.toml for the full delta.
# Exact curve25519-dalek 4.1.3 source with one additive, feature-gated
# qualification API for canonical extended-coordinate GPU parity. All normal
# dalek arithmetic and encodings remain upstream-identical.
curve25519-dalek = { path = "../../vendor/curve25519-dalek-dregg" }
# ark-serialize fork — the `serde_with` feature `dregg-hints` needs (emberian/algebra).
# The two zed-forked async-* crates the gpui dep tree's `[patch.crates-io]` pins
# (gpui's vendored `util` calls `smol::process::Child::adopt_raw_pid`, present only
# on these forks). Inert when the gpui-bearing crates are not in the build graph.
async-task = { git = "https://github.com/smol-rs/async-task.git", rev = "b4486cd71e4e94fbda54ce6302444de14f4d190e" }
# Vendored pathfinder_simd 0.5.6 (gpui → font-kit → pathfinder): scalar-path build
# (the nightly portable-SIMD intrinsics were removed from current toolchains). The
# one canonical vendored copy lives under starbridge-v2.
# stylo `ToCss`-derive fork (emberian/stylo@ember-nightly-fix) — pins the `?`
# residual error type to `core::fmt::Error`, defeating the serde_fmt ambiguity in
# the full cockpit graph (web-shell → servo → stylo). Inert outside that graph.
# servo-paint SWGL fork (servo-render's libservo path): WebRenderOptions
# `clear_caches_with_quads: false` so SWGL's DepthFunc assert does not SIGABRT.
# servo-net forbidden-schemes fork (servo-render's libservo path): allow an
# embedder ProtocolHandler for http/https (the cap-gated byte socket).

# The gpui fork (emberian/zed) resolves directly from git at the rev pinned in
# starbridge-v2/Cargo.toml (the offscreen/headless wgpu renderer the render-capture
# bakes need is on that pushed rev) — no local-path [patch] override.


